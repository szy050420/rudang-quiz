求党员和群众的意见；④支部委员会审查；⑤支部大会讨论、表决通过；⑥报上级党委审批（三个月内）。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_0d926533","m":"fz","f":"延长预备期的规定？","b":"可以延长一次预备期，延长时间不能少于半年、最长不超过一年。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_a6a375f3","m":"fz","f":"什么情况下取消预备党员资格？","b":"不履行党员义务、不具备党员条件的，应当取消其预备党员资格；违犯党纪情节较重、应当追究党纪责任的，也应取消预备党员资格。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_897f1154","m":"fz","f":"发展党员工作的五个阶段？","b":"①申请入党；②入党积极分子的确定和培养教育；③发展对象的确定和考察；④预备党员的接收；⑤预备党员的教育、考察和转正。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_ee26036a","m":"fz","f":"《细则》共几章几条？","b":"共七章四十四条。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_fz_25a651de","m":"fz","f":"入党宣誓由谁组织？","b":"宣誓仪式一般由基层党委或党支部组织进行，预备党员必须面向党旗进行入党宣誓。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_f00cfc6d","m":"fz","f":"发展对象未来多长时间内将离开单位的怎么办？","b":"发展对象未来三个月内将离开工作、学习单位的，一般不办理接收预备党员的手续。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_fz_bc915a88","m":"fz","f":"党委审批前与谁谈话？","b":"指派党委委员或组织员同发展对象谈话，作进一步了解，并将谈话情况和意见如实填写在《入党志愿书》上。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_822381fb","m":"dsl","f":"《党史学习教育工作条例》何时批准、何时发布？","b":"2024年1月18日中共中央政治局常委会会议审议批准，2024年2月5日中共中央发布。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_9b8f8a1b","m":"dsl","f":"《条例》共几章几条？","b":"共六章、三十四条。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dsl_dd048ae1","m":"dsl","f":"党史学习教育的主要任务（四个学史）？","b":"学史明理、学史增信、学史崇德、学史力行。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dsl_6f183c30","m":"dsl","f":"学史明理、增信、崇德、力行各自的内涵？","b":"明理：领悟中国共产党为什么能、马克思主义为什么行、中国特色社会主义为什么好；增信：增强对马克思主义共产主义的信仰、对中国特色社会主义的信念、对民族复兴的信心；崇德：崇尚对党忠诚的大德、造福人民的公德、严于律己的品德；力行：在锤炼党性、为民服务、推动发展上力行。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_f5a484f1","m":"dsl","f":"党史学习教育工作的原则？","b":"①坚持党的全面领导；②坚持围绕中心、服务大局；③坚持以史鉴今、资政育人；④坚持守正创新、注重实效。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_64ae4f04","m":"dsl","f":"党史学习教育的内容体系中，什么摆在首位？","b":"学习党的创新理论——把学习习近平新时代中国特色社会主义思想摆在首要位置，坚持学党史和悟思想相统一。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_18ef98dd","m":"dsl","f":"开展党史学习教育的两种基本方式？","b":"党员自学和组织学习。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_0679ef22","m":"dsl","f":"条例要求坚决反对什么错误思潮？","b":"旗帜鲜明反对和抵制历史虚无主义，防止“低级红”“高级黑”。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dsl_072447c1","m":"dsl","f":"党史学习教育的领导体制？","b":"在党中央集中统一领导下，由中央宣传思想文化工作领导小组统筹协调、整体推进、督促落实。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dsl_290c350d","m":"dsl","f":"党史学习教育覆盖对象？","b":"覆盖全体党员，同时面向全社会开展，做到覆盖全党与面向社会相贯通。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_esd_83bb3b49","m":"esd","f":"党的二十大的大会主题？","b":"高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_36072f90","m":"esd","f":"新时代十年的三件大事？","b":"①迎来中国共产党成立一百周年；②中国特色社会主义进入新时代；③完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_2757c8ef","m":"esd","f":"新时代新征程中国共产党的中心任务？","b":"团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_7aefa069","m":"esd","f":"中国式现代化的五个特征？","b":"①人口规模巨大；②全体人民共同富裕；③物质文明和精神文明相协调；④人与自然和谐共生；⑤走和平发展道路。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_975c66da","m":"esd","f":"中国式现代化的本质要求（九条）？","b":"坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_852c4831","m":"esd","f":"两步走战略安排？","b":"从2020年到2035年基本实现社会主义现代化；从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_bd4a023f","m":"esd","f":"六个必须坚持（世界观方法论）？","b":"必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_2491ee33","m":"esd","f":"两个结合？","b":"把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_c000b0cd","m":"esd","f":"三个务必？","b":"务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_0fa405eb","m":"esd","f":"五个必由之路？","b":"坚持党的全面领导、中国特色社会主义、团结奋斗、贯彻新发展理念、全面从严治党（分别是坚持和发展中特、实现复兴、创造伟业、发展壮大、永葆生机活力的必由之路）。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_d2954454","m":"esd","f":"三个第一？","b":"科技是第一生产力、人才是第一资源、创新是第一动力。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_bb0ed110","m":"esd","f":"教育、科技、人才是什么？","b":"是全面建设社会主义现代化国家的基础性、战略性支撑。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_bea405c3","m":"esd","f":"全过程人民民主是什么？","b":"社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_8fdad973","m":"esd","f":"总体国家安全观的核心要义（五个以）？","b":"以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_e7cfe105","m":"esd","f":"建军一百年奋斗目标是哪一年？","b":"确保到2027年实现建军一百年奋斗目标。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_esd_5b6ef0aa","m":"esd","f":"社会主义核心价值观（24字）？","b":"富强、民主、文明、和谐；自由、平等、公正、法治；爱国、敬业、诚信、友善。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_21a29214","m":"esd","f":"跳出历史周期率的两个答案？","b":"第一个答案：让人民来监督政府（毛泽东）；第二个答案：不断推进党的自我革命。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_esd_895cf377","m":"esd","f":"反腐败是最彻底的自我革命；反腐败斗争如何推进？","b":"以零容忍态度反腐惩恶，一体推进不敢腐、不能腐、不想腐，坚决打赢反腐败斗争攻坚战持久战。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_879df864","m":"esd","f":"高质量发展是什么？","b":"高质量发展是全面建设社会主义现代化国家的首要任务；发展是党执政兴国的第一要务。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_esd_31733b04","m":"esd","f":"双碳目标的时间节点？","b":"2030年前实现碳达峰、2060年前实现碳中和。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_esd_7de4f5f3","m":"esd","f":"全人类共同价值？","b":"和平、发展、公平、正义、民主、自由。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_esd_a7f86e25","m":"esd","f":"三大全球倡议？","b":"全球发展倡议、全球安全倡议、全球文明倡议。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_esd_a8971652","m":"esd","f":"前进路上必须把握的五个重大原则？","b":"坚持和加强党的全面领导、坚持中国特色社会主义道路、坚持以人民为中心的发展思想、坚持深化改革开放、坚持发扬斗争精神。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_szqh_4451fedb","m":"szqh","f":"二十届三中全会的时间与最主要成果？","b":"2024年7月15日至18日；审议通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","lv":1,"freq":"must","obj":["develop"]},{"id":"c_szqh_64e69e5c","m":"szqh","f":"进一步全面深化改革的总目标？","b":"继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。","lv":1,"freq":"must","obj":["develop"]},{"id":"c_szqh_4d3abacd","m":"szqh","f":"到2035年的改革目标？","b":"全面建成高水平社会主义市场经济体制，中国特色社会主义制度更加完善，基本实现国家治理体系和治理能力现代化，基本实现社会主义现代化。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_szqh_af913ae0","m":"szqh","f":"完成《决定》改革任务的时间节点？","b":"到2029年中华人民共和国成立八十周年时，完成本决定提出的改革任务。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_szqh_4ced7735","m":"szqh","f":"七个聚焦？","b":"聚焦构建高水平社会主义市场经济体制、发展全过程人民民主、建设社会主义文化强国、提高人民生活品质、建设美丽中国、建设更高水平平安中国、提高党的领导水平和长期执政能力。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_szqh_6a33bfa6","m":"szqh","f":"进一步全面深化改革的六个坚持（重大原则）？","b":"坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以制度建设为主线、坚持全面依法治国、坚持系统观念。","lv":1,"freq":"must","obj":["develop"]},{"id":"c_szqh_50934e29","m":"szqh","f":"进一步全面深化改革的出发点和落脚点？","b":"促进社会公平正义、增进人民福祉。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_szqh_9247aed6","m":"szqh","f":"新质生产力的内涵（特点、关键、本质）？","b":"特点是创新，关键在质优，本质是先进生产力；具有高科技、高效能、高质量特征。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_szqh_4ec8856c","m":"szqh","f":"《决定》共几部分几条？提出多少项改革举措？","b":"共15个部分、60条，提出300多项重要改革举措。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_szqh_29f2e291","m":"szqh","f":"三中全会强调以什么为牵引？","b":"以经济体制改革为牵引。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_82638c5e","m":"ssqh","f":"二十届四中全会的时间与出席人数？","b":"2025年10月20日至23日在北京举行；出席全会的有中央委员168人，候补中央委员147人。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_a946e7a1","m":"ssqh","f":"四中全会审议通过的最重要成果？","b":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》（“十五五”规划建议）。","lv":1,"freq":"must","obj":["develop"]},{"id":"c_ssqh_30d85a66","m":"ssqh","f":"《“十五五”规划建议》共几部分几条？分几大板块？","b":"共15个部分、61条，分三大板块（总论、分论、保障部署）。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_ssqh_89396180","m":"ssqh","f":"对“十四五”时期的总评价？","b":"发展历程极不寻常、极不平凡，取得重大成就；经济实力、科技实力、综合国力跃上新台阶，中国式现代化迈出新的坚实步伐，“十四五”即将圆满收官。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_de3c72d7","m":"ssqh","f":"“十五五”时期的历史定位？","b":"是基本实现社会主义现代化夥实基础、全面发力的关键时期，在基本实现社会主义现代化进程中具有承前启后的重要地位。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_12c0bc33","m":"ssqh","f":"对我国发展环境的总体判断？","b":"处于战略机遇和风险挑战并存、不确定难预料因素增多的时期。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_0640045a","m":"ssqh","f":"我国经济的四大优势？","b":"中国特色社会主义制度优势、超大规模市场优势、完整产业体系优势、丰富人才资源优势（经济基础稳、优势多、韧性强、潜能大）。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_4891ac88","m":"ssqh","f":"“十五五”经济社会发展的六个坚持原则？","b":"坚持党的全面领导、坚持人民至上、坚持高质量发展、坚持全面深化改革、坚持有效市场和有为政府相结合、坚持统筹发展和安全。","lv":1,"freq":"must","obj":["develop"]},{"id":"c_ssqh_7cd7fbb8","m":"ssqh","f":"“十五五”七个主要目标？","b":"①高质量发展取得显著成效；②科技自立自强水平大幅提高；③进一步全面深化改革取得新突破；④社会文明程度明显提升；⑤人民生活品质不断提高；⑥美丽中国建设取得新的重大进展；⑦国家安全屏障更加牢固。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_bfa38182","m":"ssqh","f":"2035年远景目标中人均GDP达到什么水平？","b":"人均国内生产总值达到中等发达国家水平，基本实现社会主义现代化。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_8cc4a43a","m":"ssqh","f":"战略任务第一条是什么？","b":"建设现代化产业体系，巩固壮大实体经济根基（固本升级、创新育新、扩容提质、强基增效）。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_765c81c3","m":"ssqh","f":"需要优先补上的最大短板？","b":"农业农村现代化，加快建设农业强国，把解决好“三农”问题作为全党工作重中之重。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_ssqh_8c0518ee","m":"ssqh","f":"全会对全党提出的政治要求（领悟两个确立…）？","b":"深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，续写经济快速发展和社会长期稳定两大奇迹新篇章。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_5b89d060","m":"jjgz","f":"2025年经济成绩单的关键数字？","b":"全年经济增长5%左右，经济总量有望达140万亿元左右，前三季度GDP增长5.2%；中国仍是全球经济增长最大引擎。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_jjgz_1a60587e","m":"jjgz","f":"当前经济面临的三大挑战？","b":"外部环境变化影响加深、国内供强需弱矛盾突出、重点领域风险隐患较多。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_402420ba","m":"jjgz","f":"五个必须（新的规律性认识）？","b":"①必须充分挖掘经济潜能；②必须坚持政策支持和改革创新并举；③必须做到既“放得活”又“管得好”；④必须坚持投资于物和投资于人紧密结合；⑤必须以苦练内功来应对外部挑战。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_jjgz_39503dbf","m":"jjgz","f":"两个更好统筹？","b":"更好统筹国内经济工作和国际经贸斗争，更好统筹发展和安全。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_bdafb1bf","m":"jjgz","f":"2026年经济工作的政策取向（八个字）？","b":"稳中求进、提质增效。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_fa05e883","m":"jjgz","f":"2026年财政政策与货币政策的定调？","b":"继续实施更加积极的财政政策；继续实施适度宽松的货币政策。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_869c2377","m":"jjgz","f":"八项重点任务（八个坚持）？","b":"坚持内需主导建设强大国内市场、坚持创新驱动、坚持改革攻坚、坚持对外开放、坚持协调发展、坚持“双碳”引领、坚持民生为大、坚持守牢底线。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_jjgz_076b79a6","m":"jjgz","f":"八项重点任务中居首位的是？","b":"坚持内需主导，建设强大国内市场。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_7f2f8c3a","m":"jjgz","f":"2026年是什么之年？","b":"“十五五”规划开局之年，要奋力实现“十五五”良好开局。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_jjgz_ee4f4b99","m":"jjgz","f":"2025年经济工作总结性评价？","b":"我国经济顶压前行、向新向优发展；经济社会发展主要目标将顺利完成，“十四五”即将圆满收官。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_jjgz_1c9e06de","m":"jjgz","f":"财政政策中的“三保”与纪律要求？","b":"兜牢基层“三保”底线（保基本民生、保工资、保运转）；严肃财经纪律，坚持党政机关过紧日子。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_jjgz_fec469d1","m":"jjgz","f":"五个关键着力点？","b":"拓展内需增长新空间、推动科技创新和产业创新深度融合、深化改革扩大开放、加大保障和改善民生力度、稳妥做好重点领域风险化解。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_zwgm_32d17667","m":"zwgm","f":"勇于自我革命是什么？","b":"是我们党最鲜明的品格，也是我们党最大的优势。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_21a29214","m":"zwgm","f":"跳出历史周期率的两个答案？","b":"第一个答案：让人民来监督政府；第二个答案：不断推进党的自我革命。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zwgm_9d6173d9","m":"zwgm","f":"党的自我革命重要思想在哪次全会系统阐述？","b":"2024年1月8日，二十届中央纪委三次全会。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_b5431096","m":"zwgm","f":"自我革命重要思想系统回答了哪三个重大问题？","b":"为什么要自我革命、为什么能自我革命、怎样推进自我革命。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_75e5a837","m":"zwgm","f":"九个以（完整背诵）？","b":"以坚持党中央集中统一领导为根本保证；以引领伟大社会革命为根本目的；以新时代中国特色社会主义思想为根本遵循；以跳出历史周期率为战略目标；以解决大党独有难题为主攻方向；以健全全面从严治党体系为有效途径；以锻造坚强组织、建设过硬队伍为重要着力点；以正风肃纪反腐为重要抓手；以自我监督和人民监督相结合为强大动力。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zwgm_992cf7c1","m":"zwgm","f":"四个自我？","b":"自我净化、自我完善、自我革新、自我提高。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zwgm_c762a656","m":"zwgm","f":"大党独有难题的六个如何始终？","b":"如何始终不忘初心牢记使命、如何始终统一思想统一意志统一行动、如何始终具备强大的执政能力和领导水平、如何始终保持干事创业精神状态、如何始终能够及时发现和解决自身存在的问题、如何始终保持风清气正的政治生态。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_b15391aa","m":"zwgm","f":"一体推进什么？","b":"一体推进不敢腐、不能腐、不想腐。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_ac4cc7a1","m":"zwgm","f":"监督执纪四种形态？","b":"红红脸出出汗成为常态；党纪轻处分、组织调整成为大多数；党纪重处分、重大职务调整成为少数；严重违纪涉嫌违法立案审查成为极少数。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_8a0d4fb1","m":"zwgm","f":"反腐败是最彻底的自我革命；腐败是什么？","b":"腐败是危害党的生命力和战斗力的最大毒瘤。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_aa37c1a6","m":"zwgm","f":"两个永远在路上？","b":"全面从严治党永远在路上，党的自我革命永远在路上。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_zwgm_28595c58","m":"zwgm","f":"新征程反腐败斗争总的要求？","b":"坚持一体推进不敢腐、不能腐、不想腐，深化标本兼治、系统施治，在铲除腐败问题产生的土壤和条件上持续发力、纵深推进，坚决打赢反腐败斗争攻坚战持久战。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jcgn_ed95b8b8","m":"jcgn","f":"两个确立？","b":"确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。","lv":1,"freq":"must","obj":["active"]},{"id":"c_jcgn_6b2c6320","m":"jcgn","f":"两个维护？","b":"坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","lv":1,"freq":"must","obj":["active"]},{"id":"c_jcgn_10c8d19f","m":"jcgn","f":"四个意识？","b":"政治意识、大局意识、核心意识、看齐意识。","lv":1,"freq":"must","obj":["active"]},{"id":"c_jcgn_68c4c309","m":"jcgn","f":"四个自信？","b":"道路自信、理论自信、制度自信、文化自信。","lv":1,"freq":"must","obj":["active"]},{"id":"c_jcgn_5936f34e","m":"jcgn","f":"党的根本宗旨？","b":"全心全意为人民服务。","lv":1,"freq":"must","obj":["active"]},{"id":"c_jcgn_97234f4b","m":"jcgn","f":"中国梦的基本内涵？","b":"国家富强、民族振兴、人民幸福。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_1c2147c9","m":"jcgn","f":"新发展理念？","b":"创新、协调、绿色、开放、共享。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_b88bfeca","m":"jcgn","f":"党的三大优良作风？","b":"理论联系实际、密切联系群众、批评与自我批评。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_c105efe3","m":"jcgn","f":"党的百年奋斗历史经验（十个坚持）？","b":"坚持党的领导、人民至上、理论创新、独立自主、中国道路、胸怀天下、开拓创新、敢于斗争、统一战线、自我革命。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_795af651","m":"jcgn","f":"党史上的三个历史决议？","b":"1945年《关于若干历史问题的决议》；1981年《关于建国以来党的若干历史问题的决议》；2021年《中共中央关于党的百年奋斗重大成就和历史经验的决议》。","lv":3,"freq":"know","obj":["active"]},{"id":"c_jcgn_57d66161","m":"jcgn","f":"四个伟大及其决定性作用的是？","b":"伟大斗争、伟大工程、伟大事业、伟大梦想；起决定性作用的是党的建设新的伟大工程。","lv":3,"freq":"know","obj":["active"]},{"id":"c_jcgn_4b820727","m":"jcgn","f":"习近平新时代中国特色社会主义思想的核心内容概括？","b":"“十个明确”＋“十四个坚持”＋“十三个方面成就”；十九大、十九届六中全会相继概括。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_88f8e51e","m":"jcgn","f":"三会一课指什么？","b":"支部党员大会、支部委员会会议、党小组会和党课。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_9d5547bf","m":"jcgn","f":"发展党员各阶段的身份称谓链条？","b":"入党申请人→入党积极分子→发展对象→预备党员→正式党员。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_885f1c59","m":"jcgn","f":"新质生产力三要素（特点、关键、本质）？","b":"特点是创新，关键在质优，本质是先进生产力。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_d9041be9","m":"jcgn","f":"和平共处五项原则？","b":"互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。","lv":3,"freq":"know","obj":["active"]},{"id":"c_jcgn_925660a6","m":"jcgn","f":"我国发展新的历史方位？","b":"中国特色社会主义进入了新时代。","lv":2,"freq":"high","obj":["active"]},{"id":"c_jcgn_2211b5b3","m":"jcgn","f":"中国共产党人的精神之源？","b":"伟大建党精神（坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民）。","lv":2,"freq":"high","obj":["active"]},{"id":"c_shiwu_c77a8b3c","m":"shiwu","f":"2026年全国两会具体指哪次会议？批准了什么重要文件？","b":"十四届全国人大四次会议（2026年3月5日—12日召开），审查批准了《中华人民共和国国民经济和社会发展第十五个五年规划纲要》。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_shiwu_b7f60eb5","m":"shiwu","f":"2026年经济增长预期目标？","b":"经济增长4.5%—5%，在实际工作中努力争取更好结果。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_shiwu_4bc00937","m":"shiwu","f":"2026年全国两会通过了哪三部重要法律？","b":"生态环境法典、民族团结进步促进法、国家发展规划法。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_shiwu_79184546","m":"shiwu","f":"《国家发展规划法》的意义？","b":"2026年3月通过，自公布之日起施行，对国家发展规划的编制、审查和批准、实施及监督程序作出全面系统规定，是我国规划制度建设的重要里程碑。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_shiwu_e9926e17","m":"shiwu","f":"“十五五”规划纲要对GDP增长如何表述？","b":"国内生产总值增长保持在合理区间、各年度视情提出，为到2035年人均GDP比2020年翻一番、达到中等发达国家水平打好基础。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_shiwu_4bac2f63","m":"shiwu","f":"“十五五”期间全社会研发经费投入年均增长多少？","b":"年均增长7%以上；数字经济核心产业增加值占GDP比重达到12.5%。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_shiwu_7c33dea1","m":"shiwu","f":"2026年政府工作报告的宏观政策基调？","b":"实施更加积极有为的宏观政策，继续实施积极的财政政策和适度宽松的货币政策。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_shiwu_b980a2a4","m":"shiwu","f":"“十四五”收官时我国经济总量与制造业成就？","b":"经济总量首次突破140万亿元大关，制造业增加值连续16年稳居世界首位。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_kz80_48208513","m":"kz80","f":"纪念抗战胜利80周年大会何时何地以何种形式举行？","b":"2025年9月3日在北京天安门广场隆重举行，举行盛大阅兵仪式，习近平发表重要讲话并检阅受阅部队。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_kz80_5a70166a","m":"kz80","f":"中国人民抗日战争胜利的历史意义？","b":"经过14年浴血奋战，彻底打败日本军国主义侵略者；是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点，也是世界发展的一个重大转折点。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_kz80_cfb6e3df","m":"kz80","f":"习近平强调的三个“任何时候都要”？","b":"任何时候都要弘扬全人类共同价值、坚定捍卫国际公平正义；都要坚持走和平发展道路、携手构建人类命运共同体；都要以人民之心为心、以天下之利为利、为增进人民福祉而不懈努力。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_kz80_77525ef5","m":"kz80","f":"纪念抗战胜利80周年大会的核心论断金句？","b":"正义的信念不可动摇，和平的期盼不可阻遏，人民的力量不可战胜；一时强弱在于力，千秋胜负在于理。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_kz80_aaa8241f","m":"kz80","f":"中国式现代化与世界和平的关系？","b":"中国式现代化是走和平发展道路的现代化，中国永远是世界的和平力量、稳定力量、进步力量。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_kz80_53fe0bce","m":"kz80","f":"伟大抗战精神的内涵（32字）？","b":"天下兴亡、匹夫有责的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_kz80_1e4d567d","m":"kz80","f":"纪念抗战胜利80周年的目的？","b":"铭记历史、缅怀先烈、珍爱和平、开创未来。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_bxd_bb079f56","m":"bxd","f":"深入贯彻中央八项规定精神学习教育何时开展？","b":"2025年全国两会后启动、7月底前基本结束，在全党开展。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_bxd_2ced98dc","m":"bxd","f":"中央八项规定精神学习教育的开展目的？","b":"贯彻落实党的二十届三中全会部署，巩固拓展主题教育成果、巩固深化党纪学习教育成果，锲而不舍落实中央八项规定精神，推进作风建设常态化长效化。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_bxd_7d4b22d2","m":"bxd","f":"学习教育的方式方法？","b":"聚焦主题、简约务实，不分批次、不划阶段，一体推进学查改，融入日常、抓在经常。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_bxd_82498de0","m":"bxd","f":"中央八项规定（2012年12月）的核心内容？","b":"改进调查研究、精简会议活动、精简文件简报、规范出访活动、改进警卫工作、改进新闻报道、严格文稿发表、厉行勤俭节约。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_bxd_c1b18bcb","m":"bxd","f":"中央八项规定精神的定位？","b":"中央八项规定是全面从严治党的切入口和动员令，是新时代全面从严治党的亮丽名片。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_bxd_2f995946","m":"bxd","f":"作风与党性的关系？","b":"作风问题本质上是党性问题；党的作风是观察党群干群关系、人心向背的晴雨表。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_bxd_165c567c","m":"bxd","f":"如何理解“由风及腐”？","b":"由作风问题滋生腐败，深入剖析作风问题背后的腐败隐患，运用由风及腐案例加强警示教育。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_djsx_4bb84623","m":"djsx","f":"习近平党建思想何时正式提出、如何定位？","b":"2026年6月15日全国党建工作座谈会正式提出并全面阐述；是习近平新时代中国特色社会主义思想的“党建篇”，为发展马克思主义建党学说作出重大原创性贡献。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_djsx_afea0067","m":"djsx","f":"习近平党建思想回答的重大时代课题？","b":"建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_djsx_312aabe9","m":"djsx","f":"十四个坚持中最本质、统领性的是哪几条？","b":"坚持党的领导是中国特色社会主义最本质的特征、坚持党中央集中统一领导、坚持全面从严治党、坚持以党的政治建设为统领。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_djsx_862a39a7","m":"djsx","f":"十四个坚持中关于“三不腐”的表述？","b":"坚持一体推进不敢腐、不能腐、不想腐。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_djsx_4f6e6546","m":"djsx","f":"“窑洞之问”的两个答案？","b":"第一个答案是毛泽东提出的让人民来监督政府；第二个答案是党的十八大以来给出的不断推进党的自我革命。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_djsx_30bccd11","m":"djsx","f":"习近平党建思想的来源？","b":"源自马克思主义科学理论，植根中华优秀传统文化，孕育于新时代全面从严治党的伟大实践。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_djsx_afea1da9","m":"djsx","f":"中国共产党目前的规模？","b":"超过1亿名党员、500多万个基层党组织，领导14亿多人口大国的世界第一大执政党。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_fczc_5d5d3ca1","m":"fczc","f":"高质量发展的重要地位？","b":"高质量发展是全面建设社会主义现代化国家的首要任务。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_fczc_3a27df04","m":"fczc","f":"新质生产力的三要素（特点、关键、本质）？","b":"特点是创新，关键在质优，本质是先进生产力。","lv":1,"freq":"must","obj":["develop"]},{"id":"c_fczc_ad887ffd","m":"fczc","f":"如何发展新质生产力？","b":"因地制宜发展新质生产力；以科技创新引领产业升级，不断催生新质生产力。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_fczc_491fa3fd","m":"fczc","f":"“两个毫不动摇”的内容？","b":"毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_fczc_1e6829ea","m":"fczc","f":"2025年民营企业座谈会的意义？","b":"为促进民营经济高质量发展注入“强心剂”，强调民营经济是推进中国式现代化的生力军。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_fczc_4bbafad2","m":"fczc","f":"民营经济促进法如何落实？","b":"落实民营经济促进法，构建民营企业参与国家重点项目建设长效机制，推动创新基础设施共享共用。","lv":2,"freq":"high","obj":["develop"]},{"id":"c_fczc_31af482b","m":"fczc","f":"三大国际科技创新中心？","b":"北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心。","lv":3,"freq":"know","obj":["develop"]},{"id":"c_ssqh_65e7cff0","m":"ssqh","f":"党的二十届四中全会的时间、地点与最主要成果？","b":"2025年10月20日至23日，北京；审议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。","lv":1,"src":"四中全会公报，2025年10月23日","obj":["develop"],"freq":"must"},{"id":"c_ssqh_2ba226c1","m":"ssqh","f":"四中全会出席人数？","b":"中央委员168人，候补中央委员147人；中纪委常委和有关方面负责同志列席。","lv":2,"src":"四中全会公报，2025年10月23日","obj":["develop"],"freq":"high"},{"id":"c_ssqh_4c351911","m":"ssqh","f":"“十五五”规划的六条原则？","b":"坚持党的全面领导、坚持人民至上、坚持高质量发展、坚持全面深化改革、坚持有效市场和有为政府相结合、坚持统筹发展和安全。","lv":1,"src":"四中全会公报，2025年10月23日","obj":["develop"],"freq":"must"},{"id":"c_ssqh_f4714c12","m":"ssqh","f":"“十五五”规划建议的结构？","b":"共15个部分、61条；提出7项主要目标、12项战略任务部署。","lv":2,"src":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》","obj":["develop"],"freq":"high"},{"id":"c_shiwu_8a523345","m":"shiwu","f":"2026年政府工作报告的主要预期目标？","b":"GDP增长4.5%—5%；城镇调查失业率5.5%左右、新增就业1200万人以上；CPI涨幅2%左右；粮食产量1.4万亿斤左右；单位GDP二氧化碳排放降低3.8%左右。","lv":1,"src":"2026年政府工作报告，2026年3月5日","obj":["develop"],"freq":"must"},{"id":"c_shiwu_5c2ba88d","m":"shiwu","f":"“十五五”规划纲要草案的20项主要指标如何分布？","b":"经济发展3项、创新驱动3项、民生福祉7项、绿色低碳5项、安全保障2项。","lv":2,"src":"2026年政府工作报告","obj":["develop"],"freq":"high"},{"id":"c_shiwu_e5419ecc","m":"shiwu","f":"“十五五”109项重大工程的6个方面？","b":"引领新质生产力发展28项、现代化基础设施23项、城乡融合9项、民生25项、绿色低碳18项、安全保障6项。","lv":3,"src":"2026年政府工作报告","obj":["develop"],"freq":"know"},{"id":"c_shiwu_9166a2ef","m":"shiwu","f":"《国家发展规划法》的通过时间与施行时间？","b":"2026年3月12日十四届全国人大四次会议通过，主席令第七十二号，自公布之日起施行。","lv":2,"src":"《中华人民共和国国家发展规划法》","obj":["develop"],"freq":"high"},{"id":"c_shiwu_6828fb64","m":"shiwu","f":"2026年政府工作的十项任务（记首项与结构）？","b":"首项“着力建设强大国内市场”；其余为新动能、科技自立自强、重点改革、高水平开放、乡村振兴、城镇化与区域协调、民生、绿色转型、风险防范与安全能力。","lv":2,"src":"2026年政府工作报告","obj":["develop"],"freq":"high"},{"id":"c_jjgz_c76319ca","m":"jjgz","f":"2025年中央经济工作会议的时间与主题？","b":"2025年12月10日至11日在北京举行；总结2025年经济工作，部署2026年八项重点任务。","lv":1,"src":"中央经济工作会议，2025年12月10日至11日","obj":["develop"],"freq":"must"},{"id":"c_jjgz_9c7fc1c7","m":"jjgz","f":"中央经济工作会议关于科技创新的三项部署？","b":"建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心；深化拓展“人工智能+”；创新科技金融服务。","lv":2,"src":"中央经济工作会议，2025年12月10日至11日","obj":["develop"],"freq":"high"},{"id":"c_jjgz_1845b317","m":"jjgz","f":"2025年中央经济工作会议关于房地产的表述？","b":"着力稳定房地产市场，因城施策控增量、去库存、优供给，鼓励收购存量商品房重点用于保障性住房，有序推动“好房子”建设。","lv":2,"src":"中央经济工作会议，2025年12月10日至11日","obj":["develop"],"freq":"high"},{"id":"c_jd105_12c37fad","m":"jd105","f":"建党105周年与长征胜利90周年分别是哪一年？","b":"2026年：7月1日建党105周年；10月长征胜利90周年（1936年10月三大主力会师）。","lv":1,"src":"1921年7月建党；1936年10月长征胜利","obj":["active","develop"],"freq":"must"},{"id":"c_jd105_0206edb3","m":"jd105","f":"长征胜利的标志事件？","b":"1936年10月，红一、红二、红四方面军在甘肃会宁、静宁将台堡会师，长征胜利结束。","lv":1,"src":"《中国共产党简史》第五章","obj":["active","develop"],"freq":"must"},{"id":"c_jd105_e03b8ce7","m":"jd105","f":"遵义会议的历史意义？","b":"1935年1月召开，确立了毛泽东同志在党中央和红军的领导地位，挽救了党、挽救了红军、挽救了中国革命，是党的历史上生死攸关的转折点。","lv":1,"src":"《中国共产党简史》第五章","obj":["active","develop"],"freq":"must"},{"id":"c_jd105_0e6627bc","m":"jd105","f":"伟大建党精神的内容？","b":"坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。","lv":1,"src":"习近平在庆祝中国共产党成立100周年大会上的讲话，2021年7月1日","obj":["active","develop"],"freq":"must"},{"id":"c_fz_952b4084","m":"fz","f":"发展党员五个阶段的名称与顺序？","b":"申请入党→入党积极分子的确定和培养教育→发展对象的确定和考察→预备党员的接收→预备党员的教育考察和转正。","lv":1,"src":"《中国共产党发展党员工作细则》","obj":["active","develop"],"freq":"must"},{"id":"c_fz_d9f3b60a","m":"fz","f":"发展党员的十六字总要求？","b":"控制总量、优化结构、提高质量、发挥作用。","lv":1,"src":"《中国共产党发展党员工作细则》第二条","obj":["active","develop"],"freq":"must"},{"id":"c_fz_21e7ccac","m":"fz","f":"政治审查的四项内容？","b":"对党的理论和路线方针政策的态度；政治历史和在重大政治斗争中的表现；遵纪守法和遵守社会公德情况；直系亲属和主要社会关系的政治情况。","lv":1,"src":"《中国共产党发展党员工作细则》第十六条","obj":["active","develop"],"freq":"must"},{"id":"c_dz_72d4040e","m":"dz","f":"“四个服从”是什么？","b":"党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。","lv":1,"src":"《中国共产党章程》第十条","obj":["active","develop"],"freq":"must"},{"id":"c_jcgn_94c34e2e","m":"jcgn","f":"“四个意识”“四个自信”“两个维护”分别指什么？","b":"四个意识：政治、大局、核心、看齐；四个自信：道路、理论、制度、文化；两个维护：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","lv":1,"src":"党的十九大报告；《中国共产党章程》总纲","obj":["active"],"freq":"must"},{"id":"c_jcgn_1a7aa97f","m":"jcgn","f":"“五位一体”与“四个全面”的关系？","b":"五位一体是总体布局（经济、政治、文化、社会、生态文明建设）；四个全面是战略布局（全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党）。","lv":1,"src":"党的十九大报告","obj":["active"],"freq":"must"},{"id":"c_jcgn_372bab7a","m":"jcgn","f":"中国式现代化的五个中国特色？","b":"人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。","lv":1,"src":"党的二十大报告，2022年10月16日","obj":["active"],"freq":"must"},{"id":"c_rzsd_54e65c99","m":"rzsd","f":"什么是唯一正确的入党动机？","b":"只有为了献身共产主义事业、更好地为人民服务而要求入党，才是唯一正确的入党动机。入党动机决定入党后的行动方向。","lv":1,"src":"中共中央组织部《入党教材》（2023年版）","obj":["active"],"freq":"must"},{"id":"c_fz_73f4d5b1","m":"fz","f":"发展对象公示与政审的硬要求？","b":"公示时间一般不少于5个工作日；未经政治审查或政治审查不合格的不能发展入党，政审须形成结论性材料。","lv":1,"src":"《中国共产党发展党员工作细则》第十六条、第十九条","obj":["active","develop"],"freq":"must"},{"id":"c_jjjc_39f1e215","m":"jjjc","f":"五种纪律处分的影响期怎么记？","b":"警告1年、严重警告1年半、撤销党内职务2年、留党察看最长2年（期间无表决权选举权被选举权）、开除党籍5年内不得重新入党。","lv":1,"src":"《中国共产党纪律处分条例》第十条至第十三条","obj":["active","develop"],"freq":"must"},{"id":"c_dz_211ce042","m":"dz","f":"基层党组织的任期？","b":"基层委员会3至5年；总支部委员会、支部委员会2年或3年。","lv":1,"src":"《中国共产党章程》第三十一条","obj":["active","develop"],"freq":"must"},{"id":"c_ssqh_56082cf0","m":"ssqh","f":"“十五五”规划建议的12项部署？","b":"现代化产业体系、科技自立自强与新质生产力、强大国内市场、高水平社会主义市场经济体制、高水平对外开放、农业农村现代化、区域协调、文化、民生、绿色转型、国家安全、国防军队。","lv":2,"src":"党的二十届四中全会公报，2025年10月23日","obj":["develop"],"freq":"high"},{"id":"c_shiwu_e473ab4e","m":"shiwu","f":"2026年政府十项工作任务的记忆线索？","b":"内需、新动能、科技、改革、开放、乡村振兴、城镇化与区域、民生、绿色、安全——十条按“需求→供给→改革→开放→城乡→民生→绿色→安全”排列。","lv":2,"src":"2026年政府工作报告，2026年3月5日","obj":["develop"],"freq":"high"},{"id":"c_fzqh_01","m":"fzqh","f":"党的二十届五中全会何时何地召开、通过了什么文件？","b":"2026年10月26日至29日在北京召开，听取和讨论习近平受中央政治局委托所作的工作报告，审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_fzqh_02","m":"fzqh","f":"党的二十届五中全会对“十四五”“十五五”作出什么判断？","b":"“十四五”圆满收官，“十五五”开局良好。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_fzqh_03","m":"fzqh","f":"跳出治乱兴衰历史周期率的“两个答案”是什么？","b":"第一个答案：让人民来监督政府（毛泽东在延安“窑洞对”中提出）；第二个答案：自我革命（经过百年奋斗特别是新时代实践得出）。两者都是中国共产党的独特创造。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_fzqh_04","m":"fzqh","f":"党的二十届五中全会的主题和《决定》的中心线索是什么？","b":"主题是持之以恒推进全面从严治党、健全全面从严治党体系；健全全面从严治党体系是《决定》的中心线索。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_fzqh_05","m":"fzqh","f":"党的二十届五中全会部署了哪项学习教育、庆祝了哪个周年？","b":"部署开展树立和践行正确政绩观学习教育；隆重庆祝中国共产党成立105周年（2026年7月1日）。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"c_czjx_01","m":"czjx","f":"伟大长征精神的五个方面内涵是什么？","b":"①坚定革命的理想和信念，坚信正义事业必然胜利；②为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲；③坚持独立自主、实事求是，一切从实际出发；④顾全大局、严守纪律、紧密团结；⑤紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_czjx_02","m":"czjx","f":"长征精神“五关”与五条内涵如何对应？","b":"信念关←第1条（理想信念）；求是关←第3条（实事求是）；团结关←第4条（顾全大局、紧密团结）；为民关←第5条（依靠群众）；奋斗关←第2条（不怕牺牲、艰苦奋斗）。五关顺序为信念、求是、团结、为民、奋斗。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_czjx_03","m":"czjx","f":"长征的关键史实时间轴与数字是什么？","b":"1934年10月开始战略转移；1935年1月遵义会议（事实上确立毛泽东同志在党中央和红军的领导地位，生死攸关的转折点）；1936年10月红一、红二、红四方面军在甘肃会宁和将台堡会师，长征胜利结束。途经11个省、翻越18座大山、跨过24条大河。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_czjx_04","m":"czjx","f":"《七律·长征》中“金沙水拍云崖暖”“大渡桥横铁索寒”分别指什么？","b":"“金沙水拍云崖暖”指巧渡金沙江；“大渡桥横铁索寒”指飞夺泸定桥。一暖一寒，形成鲜明对照。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_czjx_05","m":"czjx","f":"湘江战役的代价与历史影响是什么？","b":"1934年底长征初期最惨烈一役，中央红军由8万余人锐减至3万余人；党内对“左”倾错误的怀疑和不满达到顶点，直接促成了1935年1月遵义会议的召开。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_by10_01","m":"by10","f":"《榜样10》的基本信息是什么？","b":"由中央组织部、中央广播电视总台联合制作，2026年1月20日CCTV-1晚8点档首播；通过典型事迹展示、现场访谈互动、重温入党志愿书等形式，集中展现5名党员和2个党支部的先进事迹。","lv":1,"freq":"must","obj":["active"]},{"id":"c_by10_02","m":"by10","f":"茹振钢的身份与事迹是什么？","b":"河南科技学院教授、小麦育种专家，被称为“麦田守望者”。四十余载深耕小麦育种，育成“矮抗58”等品种，推广面积超4亿亩，守护国家粮食安全，践行“把论文写在田野上”。","lv":1,"freq":"must","obj":["active"]},{"id":"c_by10_03","m":"by10","f":"梁建英的身份与事迹是什么？","b":"中车四方高铁研发专家。面对国外高铁技术封锁，带队攻克空气动力学、噪声控制等世界级难题，推动中国高铁从“跟跑”“并跑”到“领跑”。","lv":1,"freq":"must","obj":["active"]},{"id":"c_by10_04","m":"by10","f":"冷晓琨、田野分别是谁？","b":"冷晓琨：人形机器人领域青年科技工作者，从零起步投身前沿，致力突破“卡脖子”关键核心技术。田野：基层干部，扎根贵州纳雍县推动乡村振兴，把群众急难愁盼放在心上。","lv":2,"freq":"high","obj":["active"]},{"id":"c_by10_05","m":"by10","f":"罗胤和《榜样10》中的两个党支部分别是什么？","b":"罗胤：北京市东城区司法局副局长、基层司法行政人，20余年工作经历中15年扎根基层司法所，获“全国人民满意的公务员”等称号。两个党支部：义乌市天盟实业投资有限公司党支部（“义新欧”班列运营企业党组织）、空军95944部队60分队党支部。","lv":2,"freq":"high","obj":["active"]},{"id":"c_zzjs_01","m":"zzjs","f":"党的最高领导机关、根本组织原则和“四个服从”是什么？","b":"最高领导机关：党的全国代表大会和它所产生的中央委员会。根本组织原则：民主集中制（民主基础上的集中和集中指导下的民主相结合）。“四个服从”：党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zzjs_02","m":"zzjs","f":"党的组织体系与基层组织的成立条件、定位是什么？","b":"组织体系分三级：党的中央组织、党的地方组织、党的基层组织。凡是有正式党员3人以上的基层单位应当成立党的基层组织；党的基层组织是党在社会基层组织中的战斗堡垒，是党的全部工作和战斗力的基础。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zzjs_03","m":"zzjs","f":"“三会一课”和“双重组织生活”分别指什么？","b":"“三会一课”：支部党员大会、支部委员会会议、党小组会，按时上好党课。双重组织生活：党员领导干部除参加党委（党组）的组织生活外，还应当参加所在党支部或者党小组的组织生活。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zzjs_04","m":"zzjs","f":"党的三大优良作风和中央八项规定的时间是什么？","b":"三大优良作风由党的七大概括：理论联系实际、密切联系群众、批评和自我批评。中央八项规定于2012年12月出台，是新时代改进作风的切入口和动员令。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_zzjs_05","m":"zzjs","f":"六大纪律与五种纪律处分、留党察看期限是什么？","b":"六大纪律：政治、组织、廉洁、群众、工作、生活纪律，其中政治纪律最重要、最根本、最关键。五种处分：警告、严重警告、撤销党内职务、留党察看、开除党籍。留党察看一般为一年，最长不超过二年。对党员的处分须经支部大会讨论决定，报党的基层委员会批准。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_xd6_01","m":"xd6","f":"“六大思想”分别在什么时间提出？","b":"强军思想（2017年十九大）、经济思想（2017年12月中央经济工作会议）、生态文明思想（2018年5月全国生态环境保护大会）、外交思想（2018年6月中央外事工作会议）、法治思想（2020年11月中央全面依法治国工作会议）、文化思想（2023年10月全国宣传思想文化工作会议）。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_02","m":"xd6","f":"习近平强军思想的要点是什么？","b":"党在新时代的强军目标：建设一支听党指挥、能打胜仗、作风优良的人民军队；到2027年实现建军一百年奋斗目标，2035年基本实现国防和军队现代化，本世纪中叶建成世界一流军队。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_03","m":"xd6","f":"习近平经济思想的核心要义？","b":"加强党对经济工作的全面领导；坚持以人民为中心；完整准确全面贯彻新发展理念；构建新发展格局；推动高质量发展；使市场在资源配置中起决定性作用、更好发挥政府作用；发展新质生产力。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_04","m":"xd6","f":"习近平生态文明思想的核心表述？","b":"绿水青山就是金山银山；人与自然和谐共生；山水林田湖草沙一体化保护和系统治理；“双碳”目标——2030年前碳达峰、2060年前碳中和。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_05","m":"xd6","f":"习近平外交思想的核心是什么？","b":"推动构建人类命运共同体；中国特色大国外交；“十个坚持”；高质量共建“一带一路”；三大全球倡议——全球发展倡议、全球安全倡议、全球文明倡议。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_06","m":"xd6","f":"习近平法治思想的核心要义？","b":"“十一个坚持”，第一条核心要义是坚持党对全面依法治国的领导；全面依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_07","m":"xd6","f":"习近平文化思想的特质与目标？","b":"“明体达用、体用贯通”；担负新的文化使命；坚定文化自信；坚持“两个结合”特别是“第二个结合”；建设中华民族现代文明；到2035年建成文化强国。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_xd6_08","m":"xd6","f":"习近平关于党的建设的重要思想何时概括、核心是什么？","b":"2023年6月全国组织工作会议首次概括，核心是“十三个坚持”，以“两个维护”为最高政治原则、以坚持和加强党的全面领导为根本保证。注意它不属于“六大思想”序列但常考。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"c_xd6_09","m":"xd6","f":"总体国家安全观何时提出、基本内涵？","b":"2014年4月中央国家安全委员会第一次会议提出；以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"c_dz_01","m":"dz","f":"入党誓词全文（12句、80字）","b":"我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_02","m":"dz","f":"党员八项义务的关键词（速记）","b":"①学习理论路线政策党史；②增强“四个意识”、坚定“四个自信”、做到“两个维护”，起先锋模范作用；③吃苦在前、享受在后；④遵守纪律首先是政治纪律和政治规矩；⑤对党忠诚老实、言行一致；⑥批评和自我批评；⑦密切联系群众；⑧挺身而出、英勇斗争、不怕牺牲。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_03","m":"dz","f":"党员八项权利的关键词（速记）","b":"①参加会议、阅读文件、接受教育培训；②在党的会议上和党报党刊上参加政策讨论；③对党的工作提出建议和倡议；④有根据地批评、揭发检举、要求处分和罢免；⑤表决权、选举权、被选举权；⑥受处分时参加和申辩；⑦坚决执行前提下声明保留；⑧向上级直至中央提出请求、申诉和控告。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_04","m":"dz","f":"申请入党的五个基本条件","b":"①年满十八岁；②承认党的纲领和章程；③愿意参加党的一个组织并在其中积极工作；④愿意执行党的决议；⑤愿意按期交纳党费。（对象为中国工人、农民、军人、知识分子和其他社会阶层的先进分子）","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_05","m":"dz","f":"预备党员在权利上有何特殊规定？","b":"预备党员的义务与正式党员一样；权利上没有表决权、选举权和被选举权，其他权利与正式党员相同。任何一级组织直至中央都无权剥夺党员权利。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_01","m":"fz","f":"发展党员的五个阶段","b":"①入党申请；②入党积极分子的确定和培养教育；③发展对象的确定和考察；④预备党员的接收；⑤预备党员的教育、考察和转正。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_02","m":"fz","f":"发展党员关键时限数字串（必背）","b":"申请书后1个月内谈话；1至2名正式党员作培养联系人；每半年考察一次；培养教育1年以上可列为发展对象；公示不少于5个工作日；集中培训不少于3天（24学时）；2名正式党员作介绍人；赞成数超过应到会有表决权正式党员的半数；3个月内审批（特殊情况不超过6个月）；预备期1年；延长不少于半年、最长不超过1年且只能一次。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_03","m":"fz","f":"培养联系人与入党介绍人的区别","b":"培养联系人由党组织指定1至2名正式党员担任，负责培养教育；入党介绍人须2名正式党员，一般由培养联系人担任，负责了解思想品质经历表现并向党组织作出负责的报告。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jjjc_01","m":"jjjc","f":"党的纪律处分有哪五种？","b":"警告、严重警告、撤销党内职务、留党察看、开除党籍。开除党籍是党内最高处分，五年内不得重新入党；留党察看最长不超过二年。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_02","m":"jjjc","f":"六大纪律及政治纪律的地位","b":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。政治纪律是最重要、最根本、最关键的纪律，是遵守党的全部纪律的重要基础。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_03","m":"jjjc","f":"监督执纪“四种形态”是什么？","b":"①经常开展批评和自我批评、约谈函询，让“红红脸、出出汗”成为常态；②党纪轻处分、组织调整成为大多数；③党纪重处分、重大职务调整的成为少数；④严重违纪涉嫌违法立案审查的成为极少数。","lv":1,"freq":"must","obj":["active","develop"]}],"points":{"jjjc":[{"g":"一、党的纪律与六大纪律","items":[{"k":"党的纪律的概念","v":"党的纪律是党的各级组织和全体党员必须遵守的行为规则，是维护党的团结统一、完成党的任务的保证。","tag":"精华"},{"k":"党的六大纪律","v":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。","tag":"精华"},{"k":"政治纪律","v":"是党最根本、最重要的纪律，是维护党的团结统一的根本保证。","tag":"精华"},{"k":"组织纪律","v":"规范党组织和党员的组织行为，核心是坚持民主集中制，做到“四个服从”。","tag":"重点"},{"k":"廉洁纪律与群众纪律","v":"廉洁纪律要求廉洁用权、公私分明；群众纪律要求密切联系群众，不得侵害群众利益。","tag":"了解"}]},{"g":"二、《中国共产党纪律处分条例》要点","items":[{"k":"《条例》最新修订","v":"2023年12月中共中央印发新修订的《中国共产党纪律处分条例》，自2024年1月1日起施行。","tag":"精华"},{"k":"党的纪律处分应当坚持的原则","v":"党要管党、全面从严治党；党纪面前一律平等；实事求是；民主集中制；惩前毖后、治病救人。","tag":"精华"},{"k":"对党员的纪律处分种类","v":"警告、严重警告、撤销党内职务、留党察看、开除党籍。","tag":"精华"},{"k":"五种纪律处分的含义","v":"警告、严重警告为较轻处分；撤销党内职务指撤销由党内选举或组织任命的职务；留党察看最长为两年；开除党籍为最重处分。","tag":"精华"},{"k":"留党察看","v":"期限一般为一年，最长不超过两年；留党察看期间没有表决权、选举权和被选举权，确实改正的可恢复党员权利，坚持不改的应当开除党籍。","tag":"精华"},{"k":"开除党籍","v":"最重的党纪处分；五年内不得重新入党，也不得推荐担任与其原任职务相当或者高于原任职务的党外职务。","tag":"精华"},{"k":"对党组织的纪律处分","v":"对违犯党纪的党组织的处理措施：改组、解散。","tag":"了解"},{"k":"监督执纪“四种形态”","v":"经常开展批评和自我批评、约谈函询，让“红红脸、出出汗”成为常态；党纪轻处分、组织调整成为违纪处理的大多数；党纪重处分、重大职务调整的成为少数；严重违纪涉嫌犯罪被立案审查的成为极少数。","tag":"精华"}]},{"g":"三、党内法规体系","items":[{"k":"党内法规的定义","v":"党内法规是党的中央组织以及中央纪律检查委员会、中央各部门和省、自治区、直辖市党委制定的，体现党的统一意志、规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度。","tag":"重点"},{"k":"党章是最根本的党内法规","v":"党章是最根本的党内法规，是制定其他党内法规的基础和依据，是管党治党的总规矩。","tag":"精华"},{"k":"党内法规的名称","v":"党章、准则、条例、规定、办法、规则、细则。","tag":"精华"},{"k":"党内法规体系“1+4”布局","v":"以党章为根本，包括党的组织法规、党的领导法规、党的自身建设法规、党的监督保障法规四个板块。","tag":"精华"},{"k":"依规治党","v":"坚持依规治党，加快形成覆盖党的领导和党的建设各方面的党内法规制度体系，实现制度治党、依规治党。","tag":"了解"},{"k":"党内政治生活准则","v":"《关于新形势下党内政治生活的若干准则》（2016年），对严肃党内政治生活作出规定。","tag":"了解"},{"k":"党内监督条例","v":"《中国共产党党内监督条例》（2016年），是加强党内监督的基本法规。","tag":"了解"},{"k":"《中国共产党廉洁自律准则》","v":"2015年修订，是规范全党廉洁自律工作的重要基础性法规，坚持正面倡导、面向全体党员。对全体党员提出“四个必须”：必须坚定共产主义理想和中国特色社会主义信念，必须坚持全心全意为人民服务根本宗旨，必须继承发扬党的优良传统和作风，必须自觉培养高尚道德情操。","tag":"重点"},{"k":"《中国共产党问责条例》","v":"2019年修订，是全面从严治党的利器。问责对象主要是党的各级组织和党的领导干部。问责情形包括党的领导弱化、党的建设缺失、全面从严治党不力、维护党的纪律不力等，坚持失责必问、问责必严，有权必有责、有责要担当、失责必追究。","tag":"重点"},{"k":"《中国共产党巡视工作条例》","v":"巡视是党内监督的战略性制度安排，是全面从严治党的重大举措、党之利剑。2023年修订。巡视工作坚持发现问题、形成震慑，推动改革、促进发展。中央和省、自治区、直辖市党委实行巡视制度，一届任期内对所管理地方、部门、企事业单位党组织全面巡视。","tag":"重点"}]},{"g":"(补)纪律处分与监督执纪","items":[{"k":"五种处分与影响","v":"警告、严重警告、撤销党内职务、留党察看、开除党籍。<b>开除党籍</b>是最高处分，五年内不得重新入党；<b>留党察看</b>分一年、二年，最长不超过二年，期间没有表决权、选举权和被选举权，其党内职务自然撤销。","tag":"精华"},{"k":"对党组织的处理","v":"只有<b>改组</b>和<b>解散</b>两种：严重违犯党纪、本身又不能纠正的党组织领导机构予以改组；全体或多数党员严重违犯党纪的党组织予以解散。警告、严重警告只适用于党员。","tag":"重点"},{"k":"监督执纪“四种形态”","v":"红红脸、出出汗成为<b>常态</b>；党纪轻处分、组织调整成为<b>大多数</b>；党纪重处分、重大职务调整的成为<b>少数</b>；严重违纪涉嫌违法立案审查的成为<b>极少数</b>。","tag":"精华"}]}],"dz":[{"g":"一、党的性质与指导思想","items":[{"k":"党的性质","v":"中国共产党是<b>中国工人阶级的先锋队</b>，同时是<b>中国人民和中华民族的先锋队</b>，是中国特色社会主义事业的<b>领导核心</b>，代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。","tag":"精华"},{"k":"党的行动指南","v":"中国共产党以<b>马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想</b>作为自己的行动指南。","tag":"精华"},{"k":"党的最高理想和最终目标","v":"<b>实现共产主义</b>。","tag":"精华"},{"k":"党的初心使命","v":"为<b>中国人民谋幸福</b>，为<b>中华民族谋复兴</b>。","tag":"精华"},{"k":"习近平新时代中国特色社会主义思想的定位","v":"是对马列主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的继承和发展，是<b>当代中国马克思主义、二十一世纪马克思主义</b>，是<b>中华文化和中国精神的时代精华</b>，是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。","tag":"精华"},{"k":"两个结合","v":"坚持把<b>马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合</b>。","tag":"精华"},{"k":"党百年奋斗积累的宝贵历史经验（十个坚持）","v":"坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自主、坚持中国道路、坚持胸怀天下、坚持开拓创新、坚持敢于斗争、坚持统一战线、<b>坚持自我革命</b>。","tag":"重点"},{"k":"我国社会主要矛盾（新时代）","v":"<b>人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾</b>。","tag":"精华"},{"k":"四个尊重","v":"尊重劳动、尊重知识、尊重人才、尊重创造。","tag":"了解"}]},{"g":"二、基本路线与总体布局","items":[{"k":"党在社会主义初级阶段的基本路线","v":"领导和团结全国各族人民，<b>以经济建设为中心</b>，<b>坚持四项基本原则，坚持改革开放</b>（一个中心、两个基本点），自力更生，艰苦创业，为把我国建设成为<b>富强民主文明和谐美丽的社会主义现代化强国</b>而奋斗。","tag":"精华"},{"k":"四项基本原则（立国之本）","v":"坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想。","tag":"精华"},{"k":"改革开放（强国之路）","v":"只有改革开放，才能发展中国、发展社会主义、发展马克思主义。","tag":"重点"},{"k":"五位一体总体布局","v":"统筹推进<b>经济建设、政治建设、文化建设、社会建设、生态文明建设</b>。","tag":"精华"},{"k":"四个全面战略布局","v":"协调推进<b>全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党</b>。","tag":"精华"},{"k":"新时代新征程战略目标","v":"到<b>二〇三五年</b>基本实现社会主义现代化；到<b>本世纪中叶</b>把我国建成社会主义现代化强国。","tag":"精华"},{"k":"新发展理念","v":"<b>创新、协调、绿色、开放、共享</b>。创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要条件，开放是国家繁荣发展的必由之路，共享是中国特色社会主义的本质要求。","tag":"精华"},{"k":"新发展格局","v":"加快构建以<b>国内大循环为主体、国内国际双循环相互促进</b>的新发展格局，推动高质量发展。","tag":"重点"},{"k":"基本经济制度","v":"坚持和完善<b>公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制</b>等基本经济制度。","tag":"了解"},{"k":"三大历史任务","v":"推进现代化建设、完成祖国统一、维护世界和平与促进共同发展。","tag":"了解"},{"k":"伟大建党精神","v":"<b>坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民</b>。（32字）","tag":"精华"}]},{"g":"三、党员（发展对象必考重点）","items":[{"k":"入党基本条件","v":"<b>年满十八岁</b>的中国工人、农民、军人、知识分子和其他社会阶层的先进分子，<b>承认党的纲领和章程</b>，愿意参加党的一个组织并在其中积极工作、执行党的决议和<b>按期交纳党费</b>的，可以申请加入中国共产党。","tag":"精华"},{"k":"党员的八项义务（要点）","v":"①认真学习马列主义等理论，学习党的路线方针政策和决议，学习党的基本知识，学习科学、文化、法律和业务知识，努力提高为人民服务的本领；②贯彻执行党的基本路线和各项方针政策，带头参加改革开放和社会主义现代化建设；③坚持党和人民的利益高于一切，个人利益服从党和人民的利益，吃苦在前，享受在后，克己奉公，多做贡献；④自觉遵守党的纪律，模范遵守国家的法律法规，严格保守党和国家的秘密，执行党的决定，服从组织分配，积极完成党的任务；⑤维护党的团结和统一，对党忠诚老实，言行一致，坚决反对一切派别组织和小集团活动，反对阳奉阴违的两面派行为和一切阴谋诡计；⑥切实开展批评和自我批评，勇于揭露和纠正违反党的原则的言行和工作中的缺点、错误，坚决同消极腐败现象作斗争；⑦密切联系群众，向群众宣传党的主张，遇事同群众商量，及时向党反映群众的意见和要求，维护群众的正当利益；⑧发扬社会主义新风尚，带头实践社会主义核心价值观和社会主义荣辱观，提倡共产主义道德，为了保护国家和人民的利益，在一切困难和危险的时刻挺身而出，英勇斗争，不怕牺牲。","tag":"精华"},{"k":"党员的八项权利（要点）","v":"①参加党的有关会议，阅读党的有关文件，接受党的教育和培训；②在党的会议上和党报党刊上，参加关于党的政策问题的讨论；③对党的工作提出建议和倡议；④在党的会议上有根据地批评党的任何组织和任何党员，向党负责地揭发、检举党的任何组织和任何党员违法乱纪的事实，要求处分违法乱纪的党员，要求罢免或撤换不称职的干部；⑤行使表决权、选举权，有被选举权；⑥在党组织讨论决定对党员的党纪处分或作出鉴定时，本人有权参加和申辩，其他党员可以为他作证和辩护；⑦对党的决议和政策如有不同意见，在坚决执行的前提下，可以声明保留，并且可以把自己的意见向党的上级组织直至中央提出；⑧向党的上级组织直至中央提出请求、申诉和控告，并要求有关组织给以负责的答复。","tag":"重点"},{"k":"预备党员的预备期","v":"预备党员的<b>预备期为一年</b>，从<b>支部大会通过他为预备党员之日</b>算起。","tag":"精华"},{"k":"预备党员的义务和权利","v":"预备党员的义务同正式党员一样；权利除了<b>没有表决权、选举权和被选举权</b>外，也同正式党员一样。","tag":"精华"},{"k":"党龄计算","v":"党员的党龄，从<b>预备期满转为正式党员之日</b>算起。","tag":"精华"},{"k":"入党宣誓与誓词（80字）","v":"预备党员必须面向<b>党旗</b>进行入党宣誓。誓词：我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。","tag":"精华"},{"k":"自行脱党","v":"党员如果没有正当理由，<b>连续六个月</b>不参加党的组织生活，或不交纳党费，或不做党所分配的工作，就被认为是自行脱党。支部大会应当决定除名，并报上级党组织批准。","tag":"重点"},{"k":"退党自由与劝退","v":"党员有退党的自由。党员要求退党，应当经支部大会讨论后宣布除名，并报上级党组织备案。党员缺乏革命意志，不履行党员义务，不符合党员条件，党的支部应当对他进行教育，要求他限期改正；经教育仍无转变的，应当劝他退党。","tag":"了解"}]},{"g":"四、党的组织制度","items":[{"k":"党的根本组织原则","v":"<b>民主集中制</b>——民主基础上的集中和集中指导下的民主相结合。它既是党的根本组织原则，也是群众路线在党的生活中的运用。","tag":"精华"},{"k":"四个服从","v":"党员个人服从党的组织，<b>少数服从多数</b>，下级组织服从上级组织，<b>全党各个组织和全体党员服从党的全国代表大会和中央委员会</b>。","tag":"精华"},{"k":"党的最高领导机关","v":"<b>党的全国代表大会和它所产生的中央委员会</b>。党的地方各级领导机关，是党的地方各级代表大会和它们所产生的委员会。","tag":"重点"},{"k":"党的全国代表大会职权","v":"①听取和审查中央委员会的报告；②听取和审查中央纪律检查委员会的报告；③讨论并决定党的重大问题；④修改党的章程；⑤选举中央委员会；⑥选举中央纪律检查委员会。","tag":"了解"},{"k":"党代会任期与召开","v":"党的全国代表大会<b>每五年举行一次</b>，由中央委员会召集；中央委员会认为有必要，或者有三分之一以上的省一级组织提出要求，可以提前举行。党的地方各级代表大会<b>每五年</b>举行一次。","tag":"重点"},{"k":"党内政治生活基本要求","v":"增强党内政治生活的<b>政治性、时代性、原则性、战斗性</b>；正确开展批评和自我批评，在原则问题上进行思想斗争，坚持真理，修正错误。","tag":"了解"},{"k":"四个意识（党章要求）","v":"牢固树立<b>政治意识、大局意识、核心意识、看齐意识</b>，坚定维护以习近平同志为核心的党中央权威和集中统一领导。","tag":"精华"}]},{"g":"五、党的基层组织","items":[{"k":"基层组织的地位","v":"党的基层组织是党在社会基层组织中的<b>战斗堡垒</b>，是<b>党的全部工作和战斗力的基础</b>。","tag":"重点"},{"k":"基层组织设置的人数标准","v":"凡是有正式党员<b>三人以上</b>的，都应当成立党的基层组织：党员人数<b>一百人以上</b>的，设立党的基层委员会；<b>五十人以上、不足一百人</b>的，设立党的总支部委员会；正式党员<b>三人以上、不足五十人</b>的，设立党的支部委员会。","tag":"了解"},{"k":"支部委员会的设置","v":"党员人数超过七人的党支部，应当设立支部委员会；不足七人的，设书记一人，必要时增设副书记一人。","tag":"了解"},{"k":"基层党组织任期","v":"党的基层委员会每届任期<b>三年至五年</b>，总支部委员会、支部委员会每届任期<b>三年至五年</b>。","tag":"了解"},{"k":"基层组织的基本任务（要点）","v":"①宣传和执行党的路线方针政策及决议；②组织党员认真学习；③对党员进行教育、管理、监督和服务，提高党员素质，增强党性；④密切联系群众，维护群众正当权利和利益；⑤充分发挥党员和群众的积极性创造性，发现培养推荐优秀人才；⑥对要求入党的积极分子进行教育和培养，做好经常性发展党员工作；⑦监督党员干部和其他任何工作人员严格遵守国法政纪；⑧教育党员和群众自觉抵制不良倾向，坚决同违纪违法行为作斗争。","tag":"了解"},{"k":"街道乡镇和村社区党组织","v":"领导本地区的工作和基层社会治理，支持和保证行政组织、经济组织和群众自治组织充分行使职权。","tag":"了解"},{"k":"国有企业党组织","v":"发挥<b>领导作用</b>，把方向、管大局、保落实，依照规定讨论和决定企业重大事项。","tag":"了解"}]},{"g":"六、党的干部","items":[{"k":"党的干部的本质","v":"党的干部是<b>党的事业的骨干</b>，是<b>人民的公仆</b>。","tag":"重点"},{"k":"选拔干部的原则","v":"党按照<b>德才兼备、以德为先</b>的原则选拔干部，坚持<b>五湖四海、任人唯贤</b>，坚持事业为上、公道正派，反对任人唯亲。","tag":"了解"},{"k":"新时代党的组织路线","v":"全面贯彻习近平新时代中国特色社会主义思想，以<b>组织体系建设</b>为重点，着力培养<b>忠诚干净担当</b>的高素质干部，着力集聚爱国奉献的各方面优秀人才，坚持德才兼备、以德为先、任人唯贤，为坚持和加强党的全面领导、坚持和发展中国特色社会主义提供坚强组织保证。","tag":"重点"},{"k":"好干部标准（二十字）","v":"<b>信念坚定、为民服务、勤政务实、敢于担当、清正廉洁</b>。","tag":"重点"}]},{"g":"七、党的纪律与纪律检查机关","items":[{"k":"党的纪律（六大纪律）","v":"党的纪律主要包括<b>政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律</b>。其中<b>政治纪律</b>是最重要、最根本、最关键的纪律。","tag":"精华"},{"k":"五种纪律处分","v":"<b>警告、严重警告、撤销党内职务、留党察看、开除党籍</b>。","tag":"精华"},{"k":"留党察看的规定","v":"留党察看的期限最长<b>不超过二年</b>。党员在留党察看期间<b>没有表决权、选举权和被选举权</b>。留党察看期间确已改正错误的，期满后应当恢复其党员的权利；坚持错误不改的，应当开除党籍。","tag":"重点"},{"k":"最高处分","v":"<b>开除党籍</b>是党内的最高处分。严重触犯刑律的党员必须开除党籍。","tag":"重点"},{"k":"纪律处分的决定与批准","v":"对党员的纪律处分，必须经过<b>支部大会讨论决定</b>，报<b>党的基层委员会批准</b>；如果涉及的问题比较重要或复杂，或给党员以开除党籍的处分，须分别报县团级以上党的委员会批准。特殊情况下，县级和县级以上各级党委和纪委有权直接决定给党员以纪律处分。","tag":"了解"},{"k":"纪律检查机关的双重领导体制","v":"党的中央纪律检查委员会在党的中央委员会领导下进行工作；党的地方各级纪律检查委员会和基层纪律检查委员会在<b>同级党的委员会和上级纪律检查委员会双重领导</b>下进行工作。","tag":"了解"},{"k":"纪委的职责","v":"党的各级纪律检查委员会的职责是<b>监督、执纪、问责</b>。","tag":"了解"},{"k":"纪检监察合署办公","v":"党的中央和地方各级纪律检查委员会同国家监察委员会（各级监察委员会）<b>合署办公</b>。","tag":"了解"}]},{"g":"八、党组·党团关系·党徽党旗","items":[{"k":"党组","v":"在中央和地方国家机关、人民团体、经济组织、文化组织和其他非党组织的领导机关中，可以成立<b>党组</b>。党组发挥<b>把方向、管大局、保落实</b>的领导作用。","tag":"了解"},{"k":"党和共产主义青年团的关系","v":"中国共产党领导中国共产主义青年团。共青团是<b>党的助手和后备军</b>，是党联系青年的桥梁和纽带。团的县级和县级以下各级委员会书记、企业事业单位的团委员会书记，是党员的，可以列席同级党的委员会和常务委员会的会议。","tag":"了解"},{"k":"党徽党旗","v":"党徽为<b>镰刀和锤头</b>组成的图案。党旗为<b>旗面缀有金黄色党徽图案的红旗</b>。党徽党旗是中国共产党的<b>象征和标志</b>。","tag":"了解"},{"k":"二十大修改党章（2022年10月22日通过）要点","v":"①体现习近平新时代中国特色社会主义思想的新发展（中国式现代化、自我革命等写入党章）；②把<b>以中国式现代化全面推进中华民族伟大复兴</b>写入党章；③把发扬斗争精神、增强斗争本领写入党章；④调整充实党的建设总体要求，明确以伟大自我革命引领伟大社会革命；⑤增写“四个意识”“四个自信”“两个维护”有关要求。","tag":"重点"}]},{"g":"九、党的建设六项基本要求（总纲）","items":[{"k":"六项基本要求","v":"①坚持党的<b>基本路线</b>；②坚持<b>解放思想，实事求是，与时俱进，求真务实</b>；③坚持<b>新时代党的组织路线</b>；④坚持<b>全心全意为人民服务</b>（根本宗旨）；⑤坚持<b>民主集中制</b>；⑥坚持<b>从严管党治党</b>。","tag":"重点"},{"k":"党的思想路线","v":"一切从实际出发，理论联系实际，<b>实事求是</b>，在实践中检验真理和发展真理。","tag":"精华"},{"k":"党的最大政治优势与最大危险","v":"我们党的最大政治优势是<b>密切联系群众</b>，党执政后的最大危险是<b>脱离群众</b>。党风问题、党同人民群众联系问题是关系党生死存亡的问题。","tag":"精华"},{"k":"群众路线","v":"一切为了群众，一切依靠群众，<b>从群众中来，到群众中去</b>，把党的正确主张变为群众的自觉行动。","tag":"精华"},{"k":"四个考验 / 四个危险","v":"执政考验、改革开放考验、市场经济考验、外部环境考验；精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险。","tag":"重点"},{"k":"党的建设总体布局","v":"以<b>党的政治建设为统领</b>，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把<b>制度建设</b>贯穿其中，深入推进<b>反腐败斗争</b>。","tag":"重点"},{"k":"党的领导的三个定位","v":"中国共产党的领导是<b>中国特色社会主义最本质的特征</b>，是<b>中国特色社会主义制度的最大优势</b>，党是<b>最高政治领导力量</b>。<b>党政军民学，东西南北中，党是领导一切的</b>。","tag":"重点"},{"k":"执政方式","v":"党必须按照<b>总揽全局、协调各方</b>的原则，在同级各种组织中发挥领导核心作用；坚持<b>科学执政、民主执政、依法执政</b>。","tag":"了解"}]},{"g":"(补)入党誓词·八项义务·八项权利","items":[{"k":"入党誓词（12句80字）","v":"我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，<b>永不叛党</b>。预备党员必须<b>面向党旗</b>宣誓。","tag":"精华"},{"k":"八项义务关键词","v":"学习／“四个意识”“四个自信”“两个维护”先锋模范／<b>吃苦在前、享受在后</b>／纪律首先是政治纪律和政治规矩／对党忠诚老实、言行一致／批评和自我批评／密切联系群众／挺身而出、英勇斗争、不怕牺牲。","tag":"精华"},{"k":"八项权利关键词","v":"参加会议阅读文件受培训／会上党报党刊讨论政策／<b>建议和倡议</b>／有根据地批评、揭发检举、要求处分和罢免／<b>表决权、选举权、被选举权</b>／受处分时参加和申辩／坚决执行前提下<b>声明保留</b>／请求、申诉和控告。","tag":"精华"},{"k":"权利保障","v":"党员的任何一级组织直至中央<b>都无权剥夺</b>党员的权利；预备党员除没有表决权、选举权和被选举权外，其他权利同正式党员一样。","tag":"重点"}]}],"fz":[{"g":"一、总则","items":[{"k":"制定目的与依据","v":"为了<b>规范发展党员工作，保证新发展的党员质量，保持党的先进性和纯洁性</b>，根据《中国共产党章程》和党内有关规定制定。","tag":"重点"},{"k":"细则的构成","v":"共<b>七章四十四条</b>：总则；入党积极分子的确定和培养教育；发展对象的确定和考察；预备党员的接收；预备党员的教育、考察和转正；发展党员工作的领导和纪律；附则。","tag":"重点"},{"k":"发展党员十六字总要求","v":"<b>控制总量、优化结构、提高质量、发挥作用</b>。","tag":"精华"},{"k":"三个坚持","v":"①坚持党章规定的党员标准，<b>始终把政治标准放在首位</b>；②坚持<b>慎重发展、均衡发展</b>，有领导、有计划地进行；③坚持<b>入党自愿原则和个别吸收原则</b>，成熟一个，发展一个。","tag":"精华"},{"k":"两个禁止","v":"<b>禁止突击发展</b>，<b>反对“关门主义”</b>。","tag":"重点"},{"k":"基层党组织的经常性重要工作","v":"把吸收具有<b>马克思主义信仰、共产主义觉悟和中国特色社会主义信念</b>，自觉践行社会主义核心价值观的先进分子入党，作为一项经常性重要工作。","tag":"了解"},{"k":"发展党员五阶段总览","v":"①申请入党（递交申请书）→②入党积极分子的确定和培养教育→③发展对象的确定和考察→④预备党员的接收→⑤预备党员的教育、考察和转正。","tag":"精华"}]},{"g":"二、入党申请与入党积极分子","items":[{"k":"入党申请书的递交对象","v":"入党申请人应当向<b>工作、学习所在单位党组织</b>提出入党申请；没有工作、学习单位或工作、学习单位未建立党组织的，应当向<b>居住地党组织</b>提出入党申请。流动人员还可向单位所在地党组织或单位主管部门党组织、流动党员党组织提出。","tag":"重点"},{"k":"谈话时限（必考）","v":"党组织收到入党申请书后，应当在<b>一个月内</b>派人同入党申请人谈话，了解基本情况。","tag":"精华"},{"k":"入党积极分子的确定程序","v":"在入党申请人中确定入党积极分子，应当采取<b>党员推荐、群团组织推优</b>等方式产生人选，由<b>支部委员会</b>（不设支部委员会的由支部大会）研究决定，并<b>报上级党委备案</b>。","tag":"精华"},{"k":"培养联系人的人数","v":"党组织应当指定<b>一至两名正式党员</b>作入党积极分子的培养联系人。","tag":"重点"},{"k":"培养联系人的四项主要任务","v":"①向入党积极分子介绍党的基本知识；②了解其政治觉悟、道德品质、现实表现和家庭情况等，做好培养教育工作，引导端正入党动机；③及时向党支部汇报入党积极分子情况；④向党支部提出能否将入党积极分子列为发展对象的意见。","tag":"了解"},{"k":"培养教育的方法","v":"吸收听党课、参加党内有关活动、分配一定的社会工作以及集中培训等；进行马列主义、毛泽东思想和中国特色社会主义理论体系教育，党的路线方针政策和党的基本知识教育，党的历史和优良传统、作风教育以及社会主义核心价值观教育。","tag":"了解"},{"k":"考察频次（必考）","v":"党支部<b>每半年</b>对入党积极分子进行一次考察，并记入考察登记表。基层党委每年对入党积极分子队伍状况作一次分析。","tag":"精华"},{"k":"积极分子工作学习变动","v":"入党积极分子工作、学习所在单位（居住地）发生变动，原单位（居住地）党组织应当及时将培养教育等有关材料转交现单位（居住地）党组织；现单位（居住地）党组织应当对有关材料进行认真审查，并接续做好培养教育工作。","tag":"了解"}]},{"g":"三、发展对象的确定和考察","items":[{"k":"发展对象的确定条件（必考）","v":"经过<b>一年以上</b>培养教育和考察、基本具备党员条件的入党积极分子，在听取<b>党小组、培养联系人、党员和群众</b>意见的基础上，<b>支部委员会讨论同意并报上级党委备案</b>后，可列为发展对象。","tag":"精华"},{"k":"入党介绍人（必考）","v":"发展对象应当有<b>两名正式党员</b>作入党介绍人，入党介绍人可以由党组织指定，也可以由发展对象自己约请。<b>受留党察看处分尚未恢复党员权利的党员</b>，不能作入党介绍人。","tag":"精华"},{"k":"入党介绍人的主要任务","v":"①向发展对象解释党的纲领、章程，说明党员的条件、义务和权利；②认真了解发展对象的入党动机、政治觉悟、道德品质、工作经历、现实表现等情况，如实向党组织汇报；③指导发展对象填写《中国共产党入党志愿书》，并认真填写自己的意见；④向支部大会负责地介绍发展对象的情况。","tag":"重点"},{"k":"政治审查的内容（必考）","v":"①对党的理论、路线、方针、政策的态度；②本人的政治历史和在重大政治斗争中的表现；③遵纪守法和遵守社会公德情况；④直系亲属和与本人关系密切的主要社会关系的政治情况。<b>凡是未经政治审查或者政治审查不合格的，不得发展入党。</b>","tag":"精华"},{"k":"政治审查的方法","v":"同本人谈话、查阅有关档案材料、找有关单位和人员了解、函调或者外调。政治审查必须严格、科学、规范，既要严格程序，又不能繁琐化。","tag":"了解"},{"k":"短期集中培训（必考）","v":"基层党委或者县级党委组织部门应当对发展对象进行短期集中培训，<b>时间一般不少于三天（或者不少于二十四个学时）</b>。培训内容主要是党章、《关于党内政治生活的若干准则》等文件。未经培训的，除个别特殊情况外，不能发展入党。","tag":"重点"}]},{"g":"四、预备党员的接收","items":[{"k":"预审制度","v":"党支部应当对发展对象进行政治审查等审查后，经<b>基层党委预审</b>，预审合格的发展对象，由党委发放<b>《中国共产党入党志愿书》</b>。发展对象未来三个月内将离开工作、学习单位的，一般不办理接收预备党员的手续。","tag":"重点"},{"k":"志愿书填写","v":"发展对象应当在<b>支部委员会的指导</b>下填写《中国共产党入党志愿书》，填好后连同学历证书、户籍证明等材料一并交给党支部。","tag":"了解"},{"k":"支部大会讨论接收预备党员的程序（必考）","v":"①发展对象汇报对党的认识、入党动机、本人履历、家庭和主要社会关系情况，以及需要向党组织说明的问题；②入党介绍人介绍发展对象有关情况，并对其能否入党表明意见；③支部委员会报告对发展对象的审查情况；④与会党员对发展对象能否入党进行充分讨论，并采取<b>无记名投票方式</b>进行表决。","tag":"精华"},{"k":"支部大会表决规则（必考）","v":"讨论<b>两个以上</b>的发展对象入党时，必须<b>逐个讨论和表决</b>。<b>有表决权的到会人数必须超过应到会有表决权人数的一半</b>；赞成人数<b>超过应到会有表决权的正式党员的一半</b>，支部大会决议方为有效。因故不能到会的有表决权的正式党员，在支部大会召开前正式向党支部提出书面意见的，应当统计在票数内。","tag":"精华"},{"k":"上级党委审批前谈话","v":"党委审批前，应当指派<b>党委委员或者组织员</b>同发展对象谈话，作进一步的了解，并帮助发展对象提高对党的认识。谈话人应当将谈话情况和自己对发展对象能否入党的意见，如实填写在《中国共产党入党志愿书》上，并向党委汇报。","tag":"重点"},{"k":"党委审批时限（必考）","v":"党委对党支部上报的接收预备党员的决议，应当在<b>三个月内</b>审批。如遇特殊情况可适当延长审批时间，但<b>不得超过六个月</b>。审批<b>两个以上</b>的发展对象入党，必须<b>逐个审议和表决</b>。","tag":"精华"},{"k":"审批权限（必考）","v":"入党必须经过<b>党委审批</b>。党的<b>总支部委员会不能审批预备党员</b>，但应当对支部大会通过接收的预备党员进行审议。临时党组织<b>不能接收、审批预备党员</b>。党委不得越过党支部自行审批接收预备党员。","tag":"重点"},{"k":"审批结果的通知与宣布","v":"党委审批同意接收的预备党员，由党委组织员或者党委负责同志同其谈话，并将审批结果及时通知报批的党支部。党支部应当及时通知本人并在<b>党员大会上宣布</b>。对未被批准入党的，应当通知党支部和本人，做好思想工作。","tag":"了解"},{"k":"预备期起算（必考）","v":"预备党员的<b>预备期为一年</b>，自<b>支部大会通过其为预备党员之日</b>起计算。","tag":"重点"},{"k":"入党宣誓的组织（必考）","v":"预备党员必须面向<b>党旗</b>进行入党宣誓。宣誓仪式一般由<b>基层党委或党支部</b>组织进行。","tag":"重点"}]},{"g":"五、预备党员的教育、考察和转正","items":[{"k":"预备党员的教育考察方式","v":"党组织应当通过党的组织生活、听取本人汇报、个别谈心、集中培训、实践锻炼等方式，对预备党员进行教育和考察。党支部应当及时将上级党委批准的预备党员编入党支部和党小组，使其进一步接受党内生活的锻炼。","tag":"了解"},{"k":"转正申请（必考）","v":"预备党员预备期满，<b>本人应当主动提出书面转正申请</b>。","tag":"重点"},{"k":"转正程序（必考）","v":"①本人提出<b>书面转正申请</b>；②<b>党小组提出意见</b>；③党支部<b>征求党员和群众的意见</b>；④<b>支部委员会审查</b>；⑤支部大会讨论、表决通过；⑥报上级党委审批（审批同样在三个月内）。","tag":"精华"},{"k":"按期转正","v":"预备党员认真履行党员义务、具备党员条件的，应当<b>按期转为正式党员</b>。","tag":"重点"},{"k":"延长预备期（必考）","v":"预备党员需要继续考察和教育的，可以<b>延长一次预备期</b>，延长时间<b>不能少于半年、最长不超过一年</b>。","tag":"精华"},{"k":"取消预备党员资格（必考）","v":"预备党员<b>不履行党员义务、不具备党员条件</b>的，应当<b>取消其预备党员资格</b>。预备党员违犯党纪，情节较重、应当追究党纪责任的，应当取消其预备党员资格。","tag":"精华"},{"k":"转正后的材料处理","v":"预备党员转为正式党员后，党组织应当及时将《中国共产党入党志愿书》、入党申请书、政治审查材料、转正申请书等存入本人人事档案；无人事档案的，建立党员档案保存。","tag":"了解"}]},{"g":"六、发展党员工作的领导和纪律","items":[{"k":"党委的领导责任","v":"各级党委应当把发展党员工作列入<b>重要议事日程</b>，纳入党建工作责任制，作为党建工作述职、评议、考核和党务公开的重要内容。对发展党员工作情况，上级党组织应当定期进行检查。","tag":"了解"},{"k":"工作纪律","v":"①禁止突击发展，反对“关门主义”；②坚持入党自愿原则，不允许搞不正之风、弄虚作假；③对不坚持标准、不履行程序、培养考察失职、审查把关不严的党组织及其负责人、直接责任人，应当进行批评教育，情节较重的给予纪律处分。","tag":"重点"},{"k":"时间链总表（必考）","v":"收到申请书<b>1个月内</b>谈话→积极分子培养教育考察<b>1年以上</b>、每半年一次考察→发展对象短期集中培训<b>不少于3天（24学时）</b>→支部大会逐个讨论、无记名投票表决→党委<b>3个月内</b>审批（特殊情况最长不超过<b>6个月</b>）→预备期<b>1年</b>→延长预备期<b>只能一次、半年至1年</b>。","tag":"精华"}]},{"g":"(补)发展党员关键时限一览","items":[{"k":"五个阶段","v":"①入党申请；②入党积极分子的确定和培养教育；③发展对象的确定和考察；④预备党员的接收；⑤预备党员的教育、考察和转正。","tag":"精华"},{"k":"数字串（从申请到转正）","v":"1个月内谈话→1至2名培养联系人→每半年考察→1年以上培养→公示不少于5个工作日→培训不少于3天（24学时）→2名正式党员介绍→赞成超应到会有表决权正式党员半数→3个月内审批（特殊情况不超6个月）→预备期1年→延长不少于半年、最长不超1年且只能一次→党龄自转正之日算起。","tag":"精华"},{"k":"纪律红线","v":"未经政治审查或政审不合格、未经培训（个别特殊除外）<b>不能发展入党</b>；违反规定吸收入党的<b>不予承认</b>；发展党员工作由<b>党的基层委员会</b>把关。","tag":"重点"}]}],"dsl":[{"g":"一、制定背景与意义","items":[{"k":"审议批准与发布时间","v":"<b>2024年1月18日</b>中共中央政治局常委会会议审议批准，<b>2024年2月5日</b>中共中央发布。","tag":"重点"},{"k":"制定依据与目的","v":"为了推动党史学习教育<b>常态化长效化</b>，推动全党全社会学好党史、用好党史，从党的历史中汲取智慧和力量，弘扬伟大建党精神，传承红色基因，赓续红色血脉，根据<b>《中国共产党章程》</b>制定本条例。","tag":"精华"},{"k":"开展党史学习教育的重要意义","v":"开展党史学习教育，用党的历史教育人、启迪人、感化人、鼓舞人，是<b>牢记党的初心使命、坚定理想信念、推进自我革命的重要途径</b>，是新时代坚持和发展中国特色社会主义、以中国式现代化全面推进中华民族伟大复兴的必然要求。","tag":"了解"},{"k":"条例的框架结构","v":"共<b>六章、三十四条</b>：第一章总则；第二章领导体制和工作职责；第三章党史学习教育的内容；第四章党史学习教育的主要方式；第五章保障和监督；第六章附则。","tag":"精华"}]},{"g":"二、总体要求与主要任务","items":[{"k":"指导思想","v":"坚持以马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想为指导，深刻领悟<b>“两个确立”</b>的决定性意义，增强<b>“四个意识”</b>、坚定<b>“四个自信”</b>、做到<b>“两个维护”</b>。","tag":"重点"},{"k":"四项主要任务（学史四要求，精华）","v":"<b>学史明理、学史增信、学史崇德、学史力行</b>。\n①<b>学史明理</b>：教育引导党员深刻领悟中国共产党为什么能、马克思主义为什么行、中国特色社会主义为什么好等道理；\n②<b>学史增信</b>：增强对马克思主义、共产主义的信仰，对中国特色社会主义的信念，对实现中华民族伟大复兴的信心；\n③<b>学史崇德</b>：涵养高尚道德品质，崇尚对党忠诚的大德、造福人民的公德、严于律己的品德；\n④<b>学史力行</b>：坚持在锤炼党性上力行、在为民服务上力行、在推动发展上力行。","tag":"精华"},{"k":"工作原则","v":"①坚持<b>党的全面领导</b>；②坚持<b>围绕中心、服务大局</b>；③坚持<b>以史鉴今、资政育人</b>；④坚持<b>守正创新、注重实效</b>。","tag":"重点"},{"k":"学习教育的对象","v":"党史学习教育覆盖<b>全体党员</b>，同时面向<b>全社会</b>开展，做到覆盖全党与面向社会相贯通。","tag":"了解"}]},{"g":"三、领导体制和工作职责","items":[{"k":"领导体制","v":"在<b>党中央集中统一领导</b>下，党史学习教育工作由<b>中央宣传思想文化工作领导小组</b>负责统筹协调、整体推进、督促落实。中央宣传部、中央党史和文献研究院按照职责分工负责。","tag":"重点"},{"k":"党委（党组）职责","v":"各级党委（党组）应当<b>履行党史学习教育工作主体责任</b>，纳入年度工作计划，融入日常、抓在经常。基层党组织应当把党史学习教育纳入“三会一课”和主题党日等组织生活。","tag":"了解"},{"k":"三会一课（拓展）","v":"党支部应当组织党员按期参加<b>党员大会、支部委员会会议、党小组会</b>，按期上好<b>党课</b>。","tag":"重点"}]},{"g":"四、党史学习教育的内容","items":[{"k":"内容体系（六方面）","v":"①学习<b>党的创新理论</b>（摆在首位）；②学习<b>党的历史结论</b>和领导同志重要论述；③学习<b>党史基本内容</b>；④学习<b>党的历史经验</b>；⑤学习弘扬<b>伟大建党精神</b>；⑥树立<b>正确党史观</b>。","tag":"重点"},{"k":"摆在首要位置的内容","v":"把学习<b>习近平新时代中国特色社会主义思想</b>摆在首要位置，坚持学党史和悟思想相统一。","tag":"精华"},{"k":"正确党史观与反对错误思潮","v":"坚持辩证唯物主义和历史唯物主义，准确把握党的历史发展的主题主线、主流本质。旗帜鲜明<b>反对和抵制历史虚无主义</b>，反对形式主义、官僚主义，防止“低级红”“高级黑”。","tag":"精华"}]},{"g":"五、主要方式与保障监督","items":[{"k":"两种基本方式","v":"开展党史学习教育主要包括<b>党员自学</b>和<b>组织学习</b>两种方式。组织学习包括理论学习中心组学习、干部教育培训、基层党组织活动、学校思政课等。","tag":"精华"},{"k":"重要形式载体","v":"用好<b>红色资源</b>、重大主题宣传和纪念活动、媒体宣传、基层宣传宣讲等形式；发挥各级党校（行政学院）、干部学院党史课程作用。","tag":"了解"},{"k":"保障措施","v":"加强<b>科研支撑、学科保障、人才保障、纪律要求、经费保障</b>，开展监督检查、评估和奖惩。","tag":"了解"},{"k":"施行日期","v":"条例自<b>2024年2月5日</b>起施行（发布之日起施行）。由中央宣传部、中央党史和文献研究院负责解释。","tag":"重点"}]}],"esd":[{"g":"一、大会概况与主题","items":[{"k":"大会时间与名称","v":"中国共产党第二十次全国代表大会于<b>2022年10月16日至22日</b>在北京举行。习近平代表第十九届中央委员会向大会作题为《<b>高举中国特色社会主义伟大旗帜 为全面建设社会主义现代化国家而团结奋斗</b>》的报告。","tag":"重点"},{"k":"大会主题","v":"<b>高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。</b>","tag":"精华"},{"k":"报告的框架","v":"共<b>十五个部分</b>：①过去五年的工作和新时代十年的伟大变革；②开辟马克思主义中国化时代化新境界；③新时代新征程中国共产党的使命任务；④加快构建新发展格局，着力推动高质量发展；⑤实施科教兴国战略，强化现代化建设人才支撑；⑥发展全过程人民民主，保障人民当家作主；⑦坚持全面依法治国，推进法治中国建设；⑧推进文化自信自强，铸就社会主义文化新辉煌；⑨增进民生福祉，提高人民生活品质；⑩推动绿色发展，促进人与自然和谐共生；⑪推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定；⑫实现建军一百年奋斗目标，开创国防和军队现代化新局面；⑬坚持和完善“一国两制”，推进祖国统一；⑭促进世界和平与发展，推动构建人类命运共同体；⑮坚定不移全面从严治党，深入推进新时代党的建设新的伟大工程。","tag":"了解"}]},{"g":"二、新时代十年伟大变革","items":[{"k":"三件大事","v":"①迎来中国共产党成立<b>一百周年</b>；②中国特色社会主义进入<b>新时代</b>；③完成脱贫攻坚、全面建成小康社会的历史任务，实现<b>第一个百年奋斗目标</b>。","tag":"精华"},{"k":"具有重大现实意义和深远历史意义的三件大事的标志","v":"这是中国共产党和中国人民团结奋斗赢得的历史性胜利，是显示中国特色社会主义强大生命力的胜利，是中华民族发展史册上具有里程碑意义的胜利。","tag":"了解"},{"k":"新时代十年的伟大变革","v":"在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有<b>里程碑意义</b>。十年来经历的三件大事与十六个方面的成就，最根本的原因在于有<b>习近平同志作为党中央的核心、全党的核心掌舵领航</b>，在于有<b>习近平新时代中国特色社会主义思想科学指引</b>。","tag":"了解"},{"k":"两个结合（开辟马克思主义中国化时代化新境界，重点）","v":"只有把<b>马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合</b>，坚持运用辩证唯物主义和历史唯物主义，才能正确回答时代和实践提出的重大问题。","tag":"精华"},{"k":"六个必须坚持","v":"习近平新时代中国特色社会主义思想的世界观和方法论：必须坚持<b>人民至上</b>、必须坚持<b>自信自立</b>、必须坚持<b>守正创新</b>、必须坚持<b>问题导向</b>、必须坚持<b>系统观念</b>、必须坚持<b>胸怀天下</b>。","tag":"精华"},{"k":"三个务必","v":"全党同志务必<b>不忘初心、牢记使命</b>，务必<b>谦虚谨慎、艰苦奋斗</b>，务必<b>敢于斗争、善于斗争</b>，坚定历史自信，增强历史主动。","tag":"精华"},{"k":"两个答案（跳出历史周期率）","v":"经过不懈努力，党找到了自我革命这一跳出治乱兴衰历史周期率的<b>第二个答案</b>（第一个答案是毛泽东提出的“让人民来监督政府”）。","tag":"精华"}]},{"g":"三、中国式现代化（核心必考）","items":[{"k":"中心任务","v":"从现在起，中国共产党的中心任务就是团结带领全国各族人民<b>全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴</b>。","tag":"精华"},{"k":"中国式现代化的五个特征","v":"①<b>人口规模巨大</b>的现代化；②<b>全体人民共同富裕</b>的现代化；③<b>物质文明和精神文明相协调</b>的现代化；④<b>人与自然和谐共生</b>的现代化；⑤<b>走和平发展道路</b>的现代化。","tag":"精华"},{"k":"中国式现代化的本质要求（九条，重点）","v":"坚持<b>中国共产党领导</b>，坚持<b>中国特色社会主义</b>，实现<b>高质量发展</b>，发展<b>全过程人民民主</b>，丰富<b>人民精神世界</b>，实现<b>全体人民共同富裕</b>，促进<b>人与自然和谐共生</b>，推动构建<b>人类命运共同体</b>，创造<b>人类文明新形态</b>。","tag":"精华"},{"k":"两步走战略安排","v":"①从2020年到<b>2035年</b>基本实现社会主义现代化；②从2035年到<b>本世纪中叶</b>把我国建成富强民主文明和谐美丽的社会主义现代化强国。","tag":"精华"},{"k":"2035年主要目标（要点）","v":"经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，达到<b>中等发达国家水平</b>；实现高水平科技自立自强；建成教育强国、科技强国、人才强国、文化强国、体育强国、健康中国；人民生活更加幸福美好；国家安全体系和能力全面加强等。","tag":"重点"},{"k":"前进道路上必须牢牢把握的重大原则（五个必由之路相关）","v":"①坚持和加强<b>党的全面领导</b>；②坚持<b>中国特色社会主义道路</b>；③坚持<b>以人民为中心的发展思想</b>；④坚持<b>深化改革开放</b>；⑤坚持<b>发扬斗争精神</b>。","tag":"重点"},{"k":"五个必由之路","v":"①坚持党的全面领导是坚持和发展中国特色社会主义的<b>必由之路</b>；②中国特色社会主义是实现中华民族伟大复兴的<b>必由之路</b>；③团结奋斗是中国人民创造历史伟业的<b>必由之路</b>；④贯彻新发展理念是新时代我国发展壮大的<b>必由之路</b>；⑤全面从严治党是党永葆生机活力、走好新的赶考之路的<b>必由之路</b>。","tag":"精华"}]},{"g":"四、高质量发展与科教兴国","items":[{"k":"高质量发展是首要任务","v":"<b>高质量发展是全面建设社会主义现代化国家的首要任务</b>。发展是党执政兴国的第一要务。","tag":"精华"},{"k":"新发展格局","v":"坚持以推动高质量发展为主题，把实施扩大内需战略同深化供给侧结构性改革有机结合起来，加快构建<b>以国内大循环为主体、国内国际双循环相互促进</b>的新发展格局。","tag":"重点"},{"k":"三个第一","v":"<b>科技是第一生产力、人才是第一资源、创新是第一动力</b>。","tag":"重点"},{"k":"三大战略","v":"深入实施<b>科教兴国战略、人才强国战略、创新驱动发展战略</b>，开辟发展新领域新赛道，不断塑造发展新动能新优势。","tag":"重点"},{"k":"教育的地位","v":"<b>教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑</b>。","tag":"了解"},{"k":"三个自我（创新型国家）","v":"加快实现<b>高水平科技自立自强</b>，坚决打赢关键核心技术攻坚战。","tag":"了解"}]},{"g":"五、民主法治与文化民生","items":[{"k":"全过程人民民主","v":"全过程人民民主是<b>社会主义民主政治的本质属性</b>，是最广泛、最真实、最管用的民主。发展全过程人民民主，保障人民当家作主。","tag":"精华"},{"k":"全面依法治国的总目标","v":"全面推进国家各方面工作法治化：坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社会一体建设，全面推进科学立法、严格执法、公正司法、全民守法，全面推进国家各方面工作法治化。","tag":"了解"},{"k":"依法治国首要/全面依法治国重点环节","v":"推进<b>科学立法、民主立法、依法立法</b>；法治政府建设是全面依法治国的重点任务和主体工程。","tag":"了解"},{"k":"文化自信","v":"<b>文化自信是更基础、更广泛、更深厚的自信</b>，是一个国家、一个民族发展中更基本、更深沉、更持久的力量。全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路，<b>推进文化自信自强</b>。","tag":"重点"},{"k":"社会主义核心价值观（24字）","v":"<b>富强、民主、文明、和谐</b>（国家层面）；<b>自由、平等、公正、法治</b>（社会层面）；<b>爱国、敬业、诚信、友善</b>（个人层面）。","tag":"重点"},{"k":"民生总的要求","v":"坚持在发展中保障和改善民生，鼓励共同奋斗创造美好生活，不断实现人民对美好生活的向往。采取更多惠民生、暖民心举措，着力解决好人民群众急难愁盼问题。","tag":"了解"},{"k":"就业与分配","v":"实施<b>就业优先战略</b>；坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。","tag":"了解"}]},{"g":"六、绿色·安全·国防·统一·外交","items":[{"k":"两山理念","v":"<b>绿水青山就是金山银山</b>。推动绿色发展，促进人与自然和谐共生，站在人与自然和谐共生的高度谋划发展。","tag":"重点"},{"k":"双碳目标","v":"积极稳妥推进碳达峰碳中和：立足我国能源资源禀赋，坚持先立后破，有计划分步骤实施碳达峰行动，<b>2030年前实现碳达峰、2060年前实现碳中和</b>。","tag":"了解"},{"k":"总体国家安全观","v":"坚持以<b>人民安全为宗旨</b>、以<b>政治安全为根本</b>、以<b>经济安全为基础</b>、以<b>军事科技文化社会安全为保障</b>、以<b>促进国际安全为依托</b>，统筹发展和安全（发展和安全并重），维护重点领域国家安全。","tag":"精华"},{"k":"国家安全体系建设的总体要求","v":"以<b>新安全格局</b>保障<b>新发展格局</b>，完善参与全球安全治理机制，建设更高水平的平安中国。","tag":"了解"},{"k":"建军一百年奋斗目标","v":"确保到<b>2027年</b>实现建军一百年奋斗目标，开创国防和军队现代化新局面。全面加强党的领导和党的建设，全面深化改革，全面加强练兵备战。","tag":"重点"},{"k":"一国两制与祖国统一","v":"“一国两制”是中国特色社会主义的伟大创举，是香港、澳门回归后保持长期繁荣稳定的最佳制度安排。<b>解决台湾问题、实现祖国完全统一</b>是党矢志不渝的历史任务，坚持贯彻新时代党解决台湾问题的总体方略，牢牢把握两岸关系主导权和主动权。","tag":"了解"},{"k":"人类命运共同体与全球倡议","v":"推动构建<b>人类命运共同体</b>；落实<b>全球发展倡议、全球安全倡议、全球文明倡议</b>；弘扬和平、发展、公平、正义、民主、自由的全人类共同价值。","tag":"重点"}]},{"g":"七、全面从严治党与自我革命","items":[{"k":"两个永远在路上","v":"<b>全面从严治党永远在路上，党的自我革命永远在路上</b>。","tag":"重点"},{"k":"党的建设总要求","v":"落实新时代党的建设总要求，健全<b>全面从严治党体系</b>，全面推进党的自我净化、自我完善、自我革新、自我提高，使我们党坚守初心使命，始终成为中国特色社会主义事业的坚强领导核心。","tag":"重点"},{"k":"反腐败斗争","v":"腐败是危害党的生命力和战斗力的最大毒瘤，反腐败是<b>最彻底的自我革命</b>。以<b>零容忍</b>态度反腐惩恶，一体推进<b>不敢腐、不能腐、不想腐</b>，坚决打赢反腐败斗争攻坚战持久战。","tag":"精华"},{"k":"五个必由之路的总括句","v":"这是我们在长期实践中得出的至关紧要的规律性认识，必须倍加珍惜、始终坚持，咬定青山不放松，引领和保障中国特色社会主义巍巍巨轮乘风破浪、行稳致远。","tag":"了解"}]}],"szqh":[{"g":"一、全会概况","items":[{"k":"时间与出席人员","v":"中国共产党第二十届中央委员会第三次全体会议于<b>2024年7月15日至18日</b>在北京举行。出席全会的有中央委员<b>199人</b>，候补中央委员<b>165人</b>。全会由中央政治局主持，中央委员会总书记习近平作了重要讲话。","tag":"重点"},{"k":"全会最重要的成果","v":"审议通过<b>《中共中央关于进一步全面深化改革、推进中国式现代化的决定》</b>。习近平就《决定（讨论稿）》向全会作了说明。","tag":"精华"},{"k":"《决定》的框架","v":"共<b>15个部分、60条</b>，提出<b>300多项</b>重要改革举措，分为三大板块：总论、分论（分领域部署改革任务）、保障措施。","tag":"了解"},{"k":"进一步全面深化改革的重要性","v":"当前和今后一个时期是<b>以中国式现代化全面推进强国建设、民族复兴伟业的关键时期</b>。中国式现代化是在改革开放中不断推进的，也必将在改革开放中开辟广阔前景。面对纷繁复杂的国际国内形势、新一轮科技革命和产业变革、人民群众新期待，必须自觉把<b>改革摆在更加突出位置</b>。","tag":"重点"}]},{"g":"二、总目标与时间表","items":[{"k":"进一步全面深化改革的总目标","v":"<b>继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化</b>。","tag":"精华"},{"k":"到2035年的目标","v":"到二〇三五年，<b>全面建成高水平社会主义市场经济体制</b>，中国特色社会主义制度更加完善，<b>基本实现国家治理体系和治理能力现代化</b>，<b>基本实现社会主义现代化</b>，为到本世纪中叶全面建成社会主义现代化强国奠定坚实基础。","tag":"重点"},{"k":"完成改革任务的时间节点（必考）","v":"到<b>二〇二九年中华人民共和国成立八十周年</b>时，完成本决定提出的改革任务。","tag":"精华"},{"k":"七个聚焦","v":"聚焦<b>构建高水平社会主义市场经济体制</b>，聚焦<b>发展全过程人民民主</b>，聚焦<b>建设社会主义文化强国</b>，聚焦<b>提高人民生活品质</b>，聚焦<b>建设美丽中国</b>，聚焦<b>建设更高水平平安中国</b>，聚焦<b>提高党的领导水平和长期执政能力</b>。","tag":"精华"}]},{"g":"三、重大原则与重点部署","items":[{"k":"六个坚持（重大原则，精华）","v":"①坚持<b>党的全面领导</b>；②坚持<b>以人民为中心</b>；③坚持<b>守正创新</b>；④坚持<b>以制度建设为主线</b>；⑤坚持<b>全面依法治国</b>；⑥坚持<b>系统观念</b>。","tag":"精华"},{"k":"牵引与出发落脚点","v":"以<b>经济体制改革</b>为牵引，以<b>促进社会公平正义、增进人民福祉</b>为出发点和落脚点，更加注重系统集成，更加注重突出重点，更加注重改革实效。","tag":"重点"},{"k":"高质量发展是首要任务","v":"<b>高质量发展是全面建设社会主义现代化国家的首要任务</b>。健全推动经济高质量发展体制机制，发展<b>新质生产力</b>。","tag":"重点"},{"k":"新质生产力（必考）","v":"健全因地制宜发展新质生产力体制机制。新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有<b>高科技、高效能、高质量</b>特征，符合新发展理念的先进生产力质态。特点是创新，关键在质优，本质是先进生产力。","tag":"精华"},{"k":"高水平社会主义市场经济体制","v":"坚持和完善社会主义基本经济制度，构建<b>高水平社会主义市场经济体制</b>。既“放得活”又“管得住”，更好发挥市场机制作用，创造更加公平、更有活力的市场环境。","tag":"重点"},{"k":"教育科技人才体制机制一体改革","v":"统筹推进<b>教育科技人才体制机制一体改革</b>，健全新型举国体制，提升国家创新体系整体效能。","tag":"了解"},{"k":"开放与安全","v":"完善高水平对外开放体制机制；推进国家安全体系和能力现代化，健全社会治理体系；持续深化国防和军队改革；提高党对进一步全面深化改革、推进中国式现代化的领导水平。","tag":"了解"}]}],"ssqh":[{"g":"一、全会概况","items":[{"k":"时间与出席人员","v":"中国共产党第二十届中央委员会第四次全体会议于<b>2025年10月20日至23日</b>在北京举行。出席全会的有中央委员<b>168人</b>，候补中央委员<b>147人</b>。中央纪律检查委员会常务委员会委员和有关方面负责同志列席会议。","tag":"重点"},{"k":"全会最重要的成果","v":"审议通过<b>《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》</b>（“十五五”规划建议）。习近平受中央政治局委托作工作报告，并就《建议（讨论稿）》向全会作了说明。","tag":"精华"},{"k":"《建议》的框架","v":"共<b>15个部分、61条</b>，分三大板块：第一板块总论（第一、二部分），阐述“十四五”重大成就与“十五五”总体要求；第二板块分论（第三至十四部分），分领域部署战略任务；第三板块（第十五部分和结束语），部署坚持和加强党中央集中统一领导等任务。","tag":"了解"},{"k":"会议的历史方位","v":"这次全会是在我国即将胜利完成“十四五”主要目标任务、进入基本实现社会主义现代化<b>夥实基础、全面发力</b>的关键时期召开的一次重要会议；是乘势而上、接续推进中国式现代化建设的又一次<b>总动员、总部署</b>。","tag":"重点"}]},{"g":"二、对形势的判断","items":[{"k":"对“十四五”时期的评价","v":"全会高度评价“十四五”时期我国发展取得的重大成就：“十四五”时期我国发展历程<b>极不寻常、极不平凡</b>。我国经济实力、科技实力、综合国力跃上新台阶，中国式现代化迈出新的坚实步伐，第二个百年奋斗目标新征程实现良好开局，“十四五”即将圆满收官。","tag":"重点"},{"k":"“十五五”时期的历史定位","v":"实现社会主义现代化是一个<b>阶梯式递进、不断发展进步</b>的历史过程。“十五五”时期是基本实现社会主义现代化<b>夥实基础、全面发力的关键时期</b>，在基本实现社会主义现代化进程中具有<b>承前启后</b>的重要地位。","tag":"重点"},{"k":"发展环境的总体判断","v":"我国发展处于<b>战略机遇和风险挑战并存、不确定难预料因素增多</b>的时期。我国经济<b>基础稳、优势多、韧性强、潜能大</b>，长期向好的支撑条件和基本趋势没有变。","tag":"精华"},{"k":"四大优势","v":"中国特色社会主义<b>制度优势</b>、<b>超大规模市场优势</b>、<b>完整产业体系优势</b>、<b>丰富人才资源优势</b>。","tag":"重点"},{"k":"政治要求","v":"全党要深刻领悟<b>“两个确立”</b>的决定性意义，增强<b>“四个意识”</b>、坚定<b>“四个自信”</b>、做到<b>“两个维护”</b>，集中力量办好自己的事，续写经济快速发展和社会长期稳定两大奇迹新篇章。","tag":"重点"}]},{"g":"三、指导方针与主要目标","items":[{"k":"六个坚持（“十五五”经济社会发展原则，精华）","v":"①坚持<b>党的全面领导</b>；②坚持<b>人民至上</b>；③坚持<b>高质量发展</b>；④坚持<b>全面深化改革</b>；⑤坚持<b>有效市场和有为政府相结合</b>；⑥坚持<b>统筹发展和安全</b>。","tag":"精华"},{"k":"七个主要目标","v":"①<b>高质量发展取得显著成效</b>；②<b>科技自立自强水平大幅提高</b>；③<b>进一步全面深化改革取得新突破</b>；④<b>社会文明程度明显提升</b>；⑤<b>人民生活品质不断提高</b>；⑥<b>美丽中国建设取得新的重大进展</b>；⑦<b>国家安全屏障更加牢固</b>。","tag":"重点"},{"k":"2035年远景目标","v":"在“十五五”基础上再奋斗五年，到<b>2035年</b>实现我国经济实力、科技实力、国防实力、综合国力和国际影响力大幅跃升，<b>人均国内生产总值达到中等发达国家水平</b>，人民生活更加幸福美好，<b>基本实现社会主义现代化</b>。","tag":"重点"}]},{"g":"四、战略任务（重点领域）","items":[{"k":"战略任务第一条（必考）","v":"<b>建设现代化产业体系，巩固壮大实体经济根基</b>——摆在战略任务第一位，可从“固本升级、创新育新、扩容提质、强基增效”四方面把握。","tag":"精华"},{"k":"科技自立自强","v":"加快高水平科技自立自强，引领发展新质生产力。加强原始创新，推动科技创新和产业创新深度融合。","tag":"重点"},{"k":"最大短板（必考）","v":"<b>农业农村现代化</b>是需要优先补上的<b>最大短板</b>。把解决好“三农”问题作为全党工作重中之重，加快建设农业强国。","tag":"精华"},{"k":"其他重点任务（要点）","v":"建设强大国内市场、加快构建新发展格局；加快构建高水平社会主义市场经济体制；扩大高水平对外开放；优化区域经济布局；激发全民族文化创新创造活力；加大保障和改善民生力度、扎实推进全体人民共同富裕；加快经济社会发展全面绿色转型、建设美丽中国；推进国家安全体系和能力现代化。","tag":"了解"}]}],"jjgz":[{"g":"一、会议概况与2025年经济工作总结","items":[{"k":"时间与主要议程","v":"中央经济工作会议于<b>2025年12月10日至11日</b>在北京举行。习近平出席并发表重要讲话，总结<b>2025年</b>年经济工作，分析当前经济形势，部署<b>2026年</b>年经济工作。李强作总结讲话。","tag":"重点"},{"k":"2025年经济工作总体评价","v":"今年是很不平凡的一年。我国经济<b>顶压前行、向新向优发展</b>，经济社会发展主要目标将顺利完成，<b>“十四五”即将圆满收官</b>，第二个百年奋斗目标新征程实现良好开局。","tag":"重点"},{"k":"2025年经济成绩单（数字必考）","v":"预计全年经济增长<b>5%左右</b>，经济总量有望达到<b>140万亿元左右</b>，继续位居世界主要经济体前列；前三季度GDP同比增长<b>5.2%</b>；中国仍是全球经济增长最大引擎。","tag":"重点"},{"k":"当前经济形势的挑战","v":"我国经济发展中老问题、新挑战仍然不少：①<b>外部环境变化影响加深</b>；②<b>国内供强需弱矛盾突出</b>；③<b>重点领域风险隐患较多</b>。这些大多是发展中、转型中的问题，经过努力是可以解决的，我国经济长期向好的支撑条件和基本趋势没有改变。","tag":"重点"}]},{"g":"二、五个必须（新的规律性认识，必考核心）","items":[{"k":"五个必须","v":"通过实践，对做好新形势下经济工作又有了新的认识和体会：①必须<b>充分挖掘经济潜能</b>；②必须坚持<b>政策支持和改革创新并举</b>；③必须做到<b>既“放得活”又“管得好”</b>；④必须坚持<b>投资于物和投资于人紧密结合</b>；⑤必须以<b>苦练内功来应对外部挑战</b>。","tag":"重点"},{"k":"两个更好统筹","v":"更好统筹<b>国内经济工作和国际经贸斗争</b>；更好统筹<b>发展和安全</b>。","tag":"重点"}]},{"g":"三、2026年经济工作部署","items":[{"k":"总体要求与政策取向","v":"坚持以习近平新时代中国特色社会主义思想为指导，坚持稳中求进工作总基调，完整准确全面贯彻新发展理念。2026年经济工作在政策取向上，要坚持<b>稳中求进、提质增效</b>，发挥存量政策和增量政策<b>集成效应</b>，加大<b>逆周期和跨周期调节</b>力度，提升宏观经济治理效能。","tag":"重点"},{"k":"财政政策","v":"继续实施<b>更加积极的财政政策</b>：保持必要的财政赤字、债务总规模和支出总量，加强财政科学管理，优化财政支出结构，重视解决地方财政困难，兜牢基层“三保”底线，坚持党政机关过紧日子。","tag":"重点"},{"k":"货币政策","v":"继续实施<b>适度宽松的货币政策</b>：把促进经济稳定增长、物价合理回升作为重要考量，灵活高效运用降准降息等政策工具，保持流动性充裕，保持人民币汇率在合理均衡水平上的基本稳定。","tag":"重点"},{"k":"八项重点任务（八个坚持，重点）","v":"①坚持<b>内需主导</b>，建设强大国内市场（居首）；②坚持<b>创新驱动</b>，加紧培育壮大新动能；③坚持<b>改革攻坚</b>，增强高质量发展动力活力；④坚持<b>对外开放</b>，推动多领域合作共赢；⑤坚持<b>协调发展</b>，促进城乡融合和区域联动；⑥坚持<b>“双碳”引领</b>，推动全面绿色转型；⑦坚持<b>民生为大</b>，努力为人民群众多办实事；⑧坚持<b>守牢底线</b>，积极稳妥化解重点领域风险。","tag":"重点"},{"k":"五个关键着力点","v":"①围绕做强国内大循环，拓展内需增长新空间；②围绕发展新质生产力，推动科技创新和产业创新深度融合；③围绕激发高质量发展的动力活力，坚定不移深化改革扩大开放；④围绕不断增进民生福祉，加大保障和改善民生力度；⑤围绕守牢安全底线，稳妥做好重点领域风险化解。","tag":"重点"},{"k":"2026年的定位","v":"<b>2026年是“十五五”规划开局之年</b>，做好经济工作至关重要，要奋力实现“十五五”良好开局。","tag":"重点"},{"k":"改革重点举措","v":"制定<b>全国统一大市场建设条例</b>，深入整治<b>“内卷式”竞争</b>；制定实施城乡居民增收计划，深入实施提振消费专项行动；打造“购在中国”品牌；深化拓展“人工智能+”。","tag":"了解"}]}],"zwgm":[{"g":"一、自我革命的基本内涵","items":[{"k":"什么是自我革命","v":"勇于<b>自我革命</b>，是我们党<b>最鲜明的品格</b>，也是我们党<b>最大的优势</b>。党的自我革命是党刀刃向内、刮骨疗毒、去腐生肌的自我净化过程，要以伟大自我革命引领伟大社会革命。","tag":"精华"},{"k":"两个答案","v":"跳出治乱兴衰历史周期率：第一个答案是毛泽东提出的“<b>让人民来监督政府</b>”；第二个答案是党的十八大以来给出的“<b>不断推进党的自我革命</b>”。","tag":"精华"},{"k":"四个自我","v":"不断增强<b>自我净化、自我完善、自我革新、自我提高</b>的能力。","tag":"精华"},{"k":"自我革命思想的形成","v":"2024年1月8日，习近平在<b>二十届中央纪委三次全会</b>上发表重要讲话，深刻阐述了党的自我革命的重要思想，系统回答了我们党<b>为什么要自我革命、为什么能自我革命、怎样推进自我革命</b>等重大问题。","tag":"重点"}]},{"g":"二、九个以（实践要求，必考核心）","items":[{"k":"九个以（精华全文）","v":"①以<b>坚持党中央集中统一领导</b>为根本保证；②以<b>引领伟大社会革命</b>为根本目的；③以<b>新时代中国特色社会主义思想</b>为根本遵循；④以<b>跳出历史周期率</b>为战略目标；⑤以<b>解决大党独有难题</b>为主攻方向；⑥以<b>健全全面从严治党体系</b>为有效途径；⑦以<b>锻造坚强组织、建设过硬队伍</b>为重要着力点；⑧以<b>正风肃纪反腐</b>为重要抓手；⑨以<b>自我监督和人民监督相结合</b>为强大动力。","tag":"精华"},{"k":"记忆诀窍（三三三分组）","v":"三个“根本”（保证/目的/遵循）＋两个战略层面（战略目标/主攻方向）＋两个建设层面（有效途径/重要着力点）＋两个治理抓手（重要抓手/强大动力）。","tag":"了解"}]},{"g":"三、大党独有难题与全面从严治党","items":[{"k":"六个如何始终（大党独有难题，重点）","v":"①如何始终<b>不忘初心、牢记使命</b>；②如何始终<b>统一思想、统一意志、统一行动</b>；③如何始终具备<b>强大的执政能力和领导水平</b>；④如何始终保持<b>干事创业精神状态</b>；⑤如何始终能够<b>及时发现和解决自身存在的问题</b>；⑥如何始终保持<b>风清气正的政治生态</b>。","tag":"重点"},{"k":"全面从严治党永远在路上","v":"<b>全面从严治党永远在路上，党的自我革命永远在路上</b>。解决大党独有难题是一个长期而艰巨的过程。","tag":"重点"},{"k":"一体推进三不腐","v":"坚持<b>不敢腐、不能腐、不想腐</b>一体推进，深化标本兼治、系统施治。反腐败斗争取得压倒性胜利并全面巩固，但形势依然严峻复杂，要坚决打赢反腐败斗争攻坚战持久战。","tag":"精华"},{"k":"监督执纪四种形态","v":"①经常开展批评和自我批评、约谈函询，让“红红脸、出出汗”成为常态；②党纪轻处分、组织调整成为大多数；③党纪重处分、重大职务调整的成为少数；④严重违纪涉嫌违法立案审查的成为极少数。","tag":"重点"},{"k":"反腐败斗争要求","v":"在铲除腐败问题产生的<b>土壤和条件</b>上持续发力、纵深推进：加强党对反腐败斗争的集中统一领导、持续保持惩治腐败高压态势、深化改革阻断腐败滋生蔓延、健全反腐败法规制度、加大惩治行贿力度、净化政治生态、加强新时代廉洁文化建设。","tag":"重点"},{"k":"党的自我革命与党的建设的总要求","v":"落实新时代党的建设总要求，健全全面从严治党体系，全面推进党的自我净化、自我完善、自我革新、自我提高，使我们党始终成为中国特色社会主义事业的坚强领导核心。","tag":"重点"}]}],"jcgn":[{"g":"一、核心政治表述（数字系列）","items":[{"k":"两个确立","v":"确立<b>习近平同志党中央的核心、全党的核心地位</b>，确立<b>习近平新时代中国特色社会主义思想的指导地位</b>。","tag":"精华"},{"k":"两个维护","v":"坚决维护<b>习近平总书记党中央的核心、全党的核心地位</b>，坚决维护<b>党中央权威和集中统一领导</b>。","tag":"精华"},{"k":"四个意识","v":"<b>政治意识、大局意识、核心意识、看齐意识</b>。","tag":"精华"},{"k":"四个自信","v":"<b>道路自信、理论自信、制度自信、文化自信</b>。","tag":"精华"},{"k":"两个一百年","v":"到建党一百年时全面建成小康社会（已实现）；到新中国成立一百年时全面建成社会主义现代化强国。","tag":"重点"},{"k":"中国梦","v":"实现<b>中华民族伟大复兴</b>，是中华民族近代以来最伟大的梦想；其基本内涵是<b>国家富强、民族振兴、人民幸福</b>。","tag":"精华"},{"k":"十个明确 / 十四个坚持 / 十三个方面成就","v":"习近平新时代中国特色社会主义思想的核心内容：“十个明确”是理论层面的核心内容，“十四个坚持”是基本方略，“十三个方面成就”是实践成果。","tag":"重点"},{"k":"社会主义核心价值观（24字）","v":"<b>富强、民主、文明、和谐；自由、平等、公正、法治；爱国、敬业、诚信、友善</b>。（国家、社会、个人三层面）","tag":"精华"}]},{"g":"二、党的性质宗旨类","items":[{"k":"党的根本宗旨","v":"<b>全心全意为人民服务</b>。党除了工人阶级和最广大人民群众的利益，没有自己特殊的利益。","tag":"精华"},{"k":"党的最大政治优势与执政后最大危险","v":"最大政治优势是<b>密切联系群众</b>；执政后的最大危险是<b>脱离群众</b>。","tag":"重点"},{"k":"党的三大优良作风","v":"<b>理论联系实际、密切联系群众、批评与自我批评</b>。","tag":"重点"},{"k":"四项基本原则","v":"坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想。","tag":"重点"},{"k":"党的思想路线","v":"一切从实际出发，理论联系实际，<b>实事求是</b>，在实践中检验真理和发展真理。","tag":"重点"},{"k":"党的群众路线","v":"一切为了群众，一切依靠群众，从群众中来，到群众中去。","tag":"重点"}]},{"g":"三、发展理念与战略类","items":[{"k":"新发展理念","v":"<b>创新、协调、绿色、开放、共享</b>。","tag":"重点"},{"k":"高质量发展","v":"高质量发展是全面建设社会主义现代化国家的<b>首要任务</b>；发展是党执政兴国的<b>第一要务</b>。","tag":"精华"},{"k":"新质生产力","v":"特点是<b>创新</b>，关键在<b>质优</b>，本质是<b>先进生产力</b>。由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生。","tag":"重点"},{"k":"全过程人民民主","v":"是社会主义民主政治的<b>本质属性</b>，是最广泛、最真实、最管用的民主。","tag":"精华"},{"k":"总体国家安全观","v":"以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事科技文化社会安全为保障，以促进国际安全为依托。<b>国家安全是民族复兴的根基</b>。","tag":"重点"},{"k":"双碳目标","v":"2030年前碳达峰、2060年前碳中和。","tag":"了解"},{"k":"三大全球倡议","v":"<b>全球发展倡议、全球安全倡议、全球文明倡议</b>。","tag":"精华"},{"k":"全人类共同价值","v":"<b>和平、发展、公平、正义、民主、自由</b>。","tag":"精华"},{"k":"和平共处五项原则","v":"互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。","tag":"了解"}]},{"g":"四、党史重要节点（知识储备）","items":[{"k":"建党与建国","v":"1921年7月中共一大召开（7月23日开幕），中国共产党诞生；党的生日为7月1日。1949年10月1日中华人民共和国成立。","tag":"了解"},{"k":"党史上的三个历史决议","v":"①1945年六届七中全会《关于若干历史问题的决议》；②1981年十一届六中全会《关于建国以来党的若干历史问题的决议》；③2021年十九届六中全会《中共中央关于党的百年奋斗重大成就和历史经验的决议》。","tag":"了解"},{"k":"党的百年奋斗历史经验（十个坚持）","v":"坚持党的领导、坚持人民至上、坚持理论创新、坚持独立自主、坚持中国道路、坚持胸怀天下、坚持开拓创新、坚持敢于斗争、坚持统一战线、坚持自我革命。","tag":"精华"},{"k":"四个伟大","v":"伟大斗争、伟大工程、伟大事业、伟大梦想，其中起决定性作用的是<b>党的建设新的伟大工程</b>。","tag":"了解"},{"k":"伟大建党精神","v":"<b>坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民</b>。这是中国共产党的<b>精神之源</b>。","tag":"重点"},{"k":"中国共产党人的精神谱系","v":"井冈山精神、长征精神、延安精神、抗美援朝精神、“两弹一星”精神、特区精神、抗疫精神、脱贫攻坚精神等。","tag":"了解"}]},{"g":"五、发展对象相关综合知识","items":[{"k":"党员发展各阶段身份称谓","v":"入党申请人→入党积极分子→发展对象→预备党员→正式党员。","tag":"重点"},{"k":"三会一课制度","v":"定期召开<b>支部党员大会</b>（一般每季度召开一次）、<b>支部委员会会议</b>（每月一次）、<b>党小组会</b>（每月一至二次），按时上好<b>党课</b>（每季度至少一次）。","tag":"重点"},{"k":"党的生日与入党志愿书/申请书区别","v":"入党申请书是本人自愿向党组织提出的书面申请；《入党志愿书》是党组织发放、在支部委员会指导下填写的正式入党材料，是党组织审查和接收党员的重要依据。","tag":"了解"},{"k":"发展对象考察期的正确说法","v":"入党积极分子培养教育考察一年以上后方可列为发展对象；预备党员预备期一年。不存在“考察期两年”等说法。","tag":"重点"},{"k":"党费与组织生活","v":"党员应当按期交纳党费；连续六个月不参加组织生活、或不交党费、或不做党分配的工作，被认为自行脱党。","tag":"重点"}]}],"shiwu":[{"g":"一、2026年全国两会概况","items":[{"k":"十四届全国人大四次会议时间与成果","v":"2026年3月5日开幕、3月12日闭幕，审查批准了《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，表决通过<b>生态环境法典、民族团结进步促进法、国家发展规划法</b>三部重要法律，是在“十五五”开局之年召开的重要会议。","tag":"重点"},{"k":"国家发展规划法（重大时政）","v":"2026年3月十四届全国人大四次会议通过，<b>自公布之日起施行</b>，对国家发展规划的编制、审查和批准、实施及其监督程序作出全面系统规定，是我国<b>规划制度建设的重要里程碑</b>，开启法治引领保障国家发展规划战略导向作用新篇章。","tag":"了解"},{"k":"生态环境法典与民族团结进步促进法施行时间","v":"生态环境法典<b>自2026年8月15日起施行</b>；民族团结进步促进法<b>自2026年7月1日起施行</b>。","tag":"了解"},{"k":"审查批准规划的法定程序","v":"形成“<b>党中央全会提出规划建议→国务院编制规划纲要草案→全国人大审查批准后公布实施</b>”的制度安排，把党的主张通过法定程序转化为国家意志。","tag":"了解"}]},{"g":"二、2026年政府工作报告主要预期目标","items":[{"k":"经济增长目标","v":"2026年经济增长<b>4.5%—5%</b>，在实际工作中努力争取更好结果。这一目标既体现稳增长要求，也为调结构、防风险、促改革留出空间，与2035年远景目标相衔接。","tag":"重点"},{"k":"就业与物价目标","v":"城镇调查失业率<b>5.5%左右</b>，城镇新增就业<b>1200万人以上</b>；居民消费价格涨幅<b>2%左右</b>。","tag":"重点"},{"k":"收入与粮食目标","v":"居民收入增长和经济增长同步；粮食产量<b>1.4万亿斤左右</b>；单位国内生产总值二氧化碳排放降低<b>3.8%左右</b>。","tag":"了解"},{"k":"宏观政策基调","v":"实施<b>更加积极有为</b>的宏观政策，继续实施<b>积极的财政政策和适度宽松的货币政策</b>，更强调政策的前瞻性、针对性和协同性。","tag":"重点"},{"k":"重大民生举措","v":"制定实施城乡居民增收计划，城乡居民基础养老金月最低标准<b>再提高20元</b>；安排2500亿元超长期特别国债支持消费品以旧换新；深入实施提振消费专项行动，把建设强大国内市场放在首位。","tag":"重点"}]},{"g":"三、“十五五”规划纲要要点","items":[{"k":"规划纲要定位","v":"“十五五”时期是<b>基本实现社会主义现代化夯实基础、全面发力的关键时期</b>，具有承前启后的重要地位。规划纲要贯穿习近平新时代中国特色社会主义思想，把党中央擘画的宏伟蓝图转化为务实可行的施工图。","tag":"重点"},{"k":"主要指标（20项）","v":"《纲要（草案）》细化为<b>20项主要指标</b>，涵盖经济发展、创新驱动、民生福祉、绿色低碳、安全保障五大方面。","tag":"重点"},{"k":"经济发展目标表述","v":"国内生产总值增长<b>保持在合理区间、各年度视情提出</b>，为到2035年<b>人均国内生产总值比2020年翻一番、达到中等发达国家水平</b>打好基础。","tag":"重点"},{"k":"创新驱动指标","v":"全社会研发经费投入年均增长<b>7%以上</b>；数字经济核心产业增加值占国内生产总值比重达到<b>12.5%</b>。","tag":"重点"},{"k":"绿色低碳目标","v":"单位国内生产总值二氧化碳排放<b>累计降低17%</b>，确保2030年前碳达峰目标如期实现。","tag":"了解"},{"k":"经济社会发展主要目标（纲要）","v":"高质量发展取得显著成效，科技自立自强水平大幅提高，进一步全面深化改革取得新突破，社会文明程度明显提升，人民生活品质不断提高，美丽中国建设取得新的重大进展，国家安全屏障更加巩固。","tag":"重点"}]},{"g":"四、国家发展成就背景（2026报告）","items":[{"k":"重大经济成就","v":"我国经济总量<b>首次突破140万亿元大关</b>，制造业增加值<b>连续16年稳居世界首位</b>；全球创新指数排名跃升。","tag":"重点"},{"k":"“十四五”成就概括","v":"“十四五”时期我国发展历程极不寻常、极不平凡，中国式现代化迈出新的坚实步伐，<b>第二个百年奋斗目标新征程实现良好开局</b>。","tag":"了解"}]}],"kz80":[{"g":"一、纪念大会与阅兵概况","items":[{"k":"纪念大会时间与形式","v":"<b>2025年9月3日</b>，纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会在北京<b>天安门广场</b>隆重举行，举行<b>盛大阅兵仪式</b>，习近平发表重要讲话并检阅受阅部队；61位外国国家元首、政府首脑及国际组织负责人等出席。","tag":"重点"},{"k":"历史意义","v":"中国人民经过<b>14年浴血奋战</b>，彻底打败日本军国主义侵略者，宣告世界反法西斯战争的完全胜利。这是<b>中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点</b>，也是世界发展的一个重大转折点。","tag":"了解"},{"k":"纪念目的","v":"铭记历史、缅怀先烈、珍爱和平、开创未来。","tag":"了解"}]},{"g":"二、重要讲话金句","items":[{"k":"三个“任何时候都要”","v":"任何时候，我们都要<b>弘扬全人类共同价值，坚定捍卫国际公平正义</b>；都要<b>坚持走和平发展道路，坚定守护世界和平安宁，携手构建人类命运共同体</b>；都要<b>以人民之心为心、以天下之利为利，为增进人民福祉而不懈努力</b>。","tag":"重点"},{"k":"核心论断金句","v":"<b>正义的信念不可动摇，和平的期盼不可阻遏，人民的力量不可战胜</b>；一时强弱在于力，千秋胜负在于理；正义、光明、进步必将战胜邪恶、黑暗、反动。","tag":"重点"},{"k":"中国和平发展定位","v":"<b>中国式现代化是走和平发展道路的现代化，中国永远是世界的和平力量、稳定力量、进步力量</b>。","tag":"了解"}]},{"g":"三、伟大抗战精神","items":[{"k":"伟大抗战精神内涵（32字）","v":"<b>天下兴亡、匹夫有责</b>的爱国情怀，<b>视死如归、宁死不屈</b>的民族气节，<b>不畏强暴、血战到底</b>的英雄气概，<b>百折不挠、坚忍不拔</b>的必胜信念。","tag":"精华"},{"k":"民族精神定位","v":"中华民族是<b>不畏强暴、自立自强的伟大民族</b>；中国人民解放军的英勇战斗和世界反法西斯同盟的并肩作战，共同铸就了这一伟大胜利。","tag":"重点"},{"k":"抗战胜利的根本保证","v":"<b>中国共产党</b>在抗日战争中发挥了中流砥柱作用，是领导抗战取得胜利的根本保证。","tag":"了解"}]}],"bxd":[{"g":"一、学习教育概况","items":[{"k":"开展时间与部署","v":"党中央决定，<b>自2025年全国两会后至7月</b>在全党开展深入贯彻中央八项规定精神学习教育，<b>7月底前基本结束</b>。中办印发《关于在全党开展深入贯彻中央八项规定精神学习教育的通知》。","tag":"精华"},{"k":"学习教育目的","v":"贯彻落实党的二十届三中全会部署，<b>巩固拓展学习贯彻习近平新时代中国特色社会主义思想主题教育成果、巩固深化党纪学习教育成果</b>，锲而不舍落实中央八项规定精神，推进作风建设常态化长效化。","tag":"重点"},{"k":"方式方法","v":"坚持聚焦主题、简约务实，<b>不分批次、不划阶段，一体推进学查改</b>，融入日常、抓在经常；运用由风及腐案例加强警示教育。","tag":"重点"}]},{"g":"二、中央八项规定核心内容","items":[{"k":"中央八项规定（2012年12月）","v":"2012年12月4日中央政治局会议通过，主要内容为：<b>改进调查研究、精简会议活动、精简文件简报、规范出访活动、改进警卫工作、改进新闻报道、严格文稿发表、厉行勤俭节约</b>。","tag":"精华"},{"k":"八项规定精神的定位","v":"中央八项规定是<b>切入口和动员令</b>，是新时代全面从严治党的<b>亮丽名片</b>；以制定和落实中央八项规定开局破题，从作风建设切入推进全面从严治党。","tag":"重点"},{"k":"作风与党建的关系","v":"<b>作风问题本质上是党性问题</b>；党的作风是观察党群干群关系、人心向背的晴雨表。密切党群干群关系、巩固党的执政基础，是开展学习教育的必然要求。","tag":"了解"}]},{"g":"三、与全面从严治党","items":[{"k":"作风建设常态化长效化","v":"锲而不舍落实中央八项规定精神，<b>推动党的作风持续向好</b>，以作风建设新成效推动保持党的先进性纯洁性，为进一步全面深化改革、推进中国式现代化提供有力保障。","tag":"重点"},{"k":"“由风及腐”警示教育","v":"深入剖析作风问题背后的腐败隐患，教育引导党员干部<b>锤炼党性、提高思想觉悟</b>，坚决纠治形式主义、官僚主义、享乐主义、奢靡之风。","tag":"了解"},{"k":"学习教育与考试结合点","v":"与《中国共产党纪律处分条例》中涉及作风建设、廉洁纪律、群众纪律的条款结合考查，是入党积极分子培训与测试的重要时政背景。","tag":"了解"}]}],"djsx":[{"g":"一、重大意义与定位","items":[{"k":"全国党建工作座谈会（2026年6月15日）","v":"<b>2026年6月15日</b>，在中国共产党成立<b>105周年</b>之际，全国党建工作座谈会在京召开，对学习贯彻习近平党建思想作出工作部署，正式提出并全面阐述习近平党建思想。","tag":"精华"},{"k":"习近平党建思想的定位","v":"习近平党建思想是习近平新时代中国特色社会主义思想的<b>“党建篇”</b>，为发展马克思主义建党学说作出<b>重大原创性贡献</b>，在马克思主义建党学说发展史和中国共产党党建史上具有<b>里程碑意义</b>。","tag":"精华"},{"k":"回答的重大时代课题","v":"围绕“<b>建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党</b>”这一重大时代课题形成，源自马克思主义科学理论，植根中华优秀传统文化，孕育于新时代全面从严治党的伟大实践。","tag":"重点"},{"k":"权威教材与政治任务","v":"《习近平党建文选》第一卷、第二卷出版发行；学习贯彻习近平党建思想是<b>当前和今后一个时期全党的一项重要政治任务</b>。","tag":"了解"}]},{"g":"二、十四个坚持（核心重点）","items":[{"k":"十四个坚持（习近平党建思想）","v":"①坚持<b>党的领导是中国特色社会主义最本质的特征</b>；②坚持<b>党中央集中统一领导</b>；③坚持<b>全面从严治党</b>；④坚持<b>不忘初心、牢记使命</b>；⑤坚持<b>以党的政治建设为统领</b>；⑥坚持<b>用党的创新理论凝心铸魂</b>；⑦坚持<b>锤炼坚强党性</b>；⑧坚持<b>健全上下贯通、执行有力的组织体系</b>；⑨坚持<b>建设堪当民族复兴重任的高素质干部队伍</b>；⑩坚持<b>推进作风建设常态化长效化</b>；⑪坚持<b>用严明的纪律管全党治全党</b>；⑫坚持<b>一体推进不敢腐不能腐不想腐</b>；⑬坚持<b>制度治党、依规治党</b>；⑭坚持<b>落实管党治党政治责任</b>。","tag":"精华"},{"k":"十四个坚持的地位","v":"是对习近平总书记关于新时代党的建设具有标志性、引领性的新理念新思想新战略的<b>集中概括</b>，深刻阐明党的建设的<b>最高原则、战略方针、价值追求、工作布局、方法路径</b>。","tag":"精华"}]},{"g":"三、相关背景与延伸","items":[{"k":"“窑洞之问”第二个答案五周年","v":"<b>2026年是“窑洞之问”的“第二个答案”提出五周年</b>。第一个答案是毛泽东提出的让人民来监督政府；第二个答案是党的十八大以来给出的<b>不断推进党的自我革命</b>。","tag":"重点"},{"k":"党的建设伟大工程","v":"把党的建设作为一项<b>伟大工程</b>来推进，始终坚持党要管党、从严治党的原则和方针，是<b>立党立国、兴党强国的一大法宝</b>。","tag":"重点"},{"k":"党员规模与组织体系","v":"中国共产党是拥有<b>超过1亿名党员、500多万个基层党组织</b>、领导14亿多人口大国的世界第一大执政党。","tag":"了解"}]}],"fczc":[{"g":"一、高质量发展","items":[{"k":"高质量发展的重要地位","v":"<b>高质量发展是全面建设社会主义现代化国家的首要任务</b>；推动经济实现<b>质的有效提升和量的合理增长</b>。","tag":"精华"},{"k":"2025年经济总体评价","v":"我国经济<b>顶压前行、向新向优发展，展现强大韧性和活力</b>；以高质量发展的确定性应对各种不确定性。","tag":"了解"},{"k":"扩大内需战略基点","v":"坚持<b>扩大内需</b>这个战略基点，深入实施提振消费专项行动，制定实施城乡居民增收计划，从收入端源头筑牢内需根基。","tag":"重点"}]},{"g":"二、新质生产力","items":[{"k":"新质生产力的定义与三要素","v":"新质生产力以<b>全要素生产率大幅提升为核心标志</b>；<b>特点是创新，关键在质优，本质是先进生产力</b>。","tag":"精华"},{"k":"发展新质生产力的要求","v":"<b>因地制宜</b>发展新质生产力；以<b>科技创新引领产业升级</b>，不断催生新质生产力；构建以先进制造业为骨干的现代化产业体系，加快高水平科技自立自强。","tag":"重点"},{"k":"“十五五”新质生产力部署","v":"推进深层次体制改革，形成与新质生产力发展相适应的生产关系；纵深推进全国统一大市场建设，<b>综合整治“内卷式”竞争</b>，健全人工智能等新兴领域监管机制。","tag":"了解"}]},{"g":"三、民营经济与两个毫不动摇","items":[{"k":"两个毫不动摇","v":"<b>毫不动摇巩固和发展公有制经济</b>，<b>毫不动摇鼓励、支持、引导非公有制经济发展</b>。","tag":"重点"},{"k":"民营企业座谈会（2025年2月）","v":"2025年2月召开民营企业座谈会，为促进民营经济<b>高质量发展</b>注入“强心剂”，强调民营经济是推进中国式现代化的生力军。","tag":"了解"},{"k":"民营经济促进法","v":"<b>落实民营经济促进法</b>，构建民营企业参与国家重点项目建设长效机制，推动创新基础设施共享共用。","tag":"重点"}]},{"g":"四、重大战略与工程","items":[{"k":"国际科技创新中心","v":"建设<b>北京（京津冀）、上海（长三角）、粤港澳大湾区</b>国际科技创新中心，打造世界级科技创新策源地，强化企业创新主体地位。","tag":"了解"},{"k":"统筹发展和安全","v":"坚持统筹发展和安全，强化底线思维，有效防范化解各类风险，以<b>新安全格局保障新发展格局</b>。","tag":"重点"},{"k":"“两重”“两新”政策","v":"“两重”指国家重大战略实施和重点领域安全能力建设；“两新”指大规模设备更新和消费品以旧换新。2026年持续优化实施，扩大有效投资、释放消费潜力。","tag":"了解"}]}],"fzqh":[{"g":"一、会议概况与主要成果","items":[{"k":"时间地点","v":"2026年10月26日至29日在北京举行。","tag":"精华"},{"k":"主要议程","v":"听取和讨论习近平受中央政治局委托所作的工作报告，审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。","tag":"精华"},{"k":"重要判断","v":"“十四五”圆满收官，“十五五”开局良好。","tag":"精华"},{"k":"庆祝与部署","v":"隆重庆祝中国共产党成立<b>105周年</b>（2026年7月1日）；开展树立和践行<b>正确政绩观</b>学习教育。","tag":"重点"}]},{"g":"二、主题与“两个答案”","items":[{"k":"会议主题","v":"持之以恒推进全面从严治党、健全全面从严治党体系；<b>健全全面从严治党体系</b>是《决定》的中心线索。","tag":"精华"},{"k":"第一个答案","v":"毛泽东在延安“窑洞对”中给出——<b>让人民来监督政府</b>。","tag":"精华"},{"k":"第二个答案","v":"经过百年奋斗特别是新时代实践，党给出——<b>自我革命</b>。","tag":"精华"},{"k":"两个“永远在路上”","v":"全面从严治党永远在路上，党的自我革命永远在路上。","tag":"重点"},{"k":"反腐败","v":"一体推进<b>不敢腐、不能腐、不想腐</b>；反腐败是最彻底的自我革命。","tag":"重点"}]},{"g":"三、党的建设伟大工程的表述演进","items":[{"k":"伟大的工程","v":"毛泽东1939年在《〈共产党人〉发刊词》中提出。","tag":"了解"},{"k":"党的建设新的伟大工程","v":"党的十四届四中全会首提，党的十五大系统阐述。","tag":"了解"},{"k":"新时代党的建设新的伟大工程","v":"党的十八大以来深入推进。","tag":"了解"}]}],"czjx":[{"g":"一、伟大长征精神五个方面","items":[{"k":"理想信念","v":"把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利。","tag":"精华"},{"k":"不怕牺牲","v":"为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲。","tag":"精华"},{"k":"实事求是","v":"坚持独立自主、实事求是，一切从实际出发。","tag":"精华"},{"k":"团结守纪","v":"顾全大局、严守纪律、紧密团结。","tag":"精华"},{"k":"依靠群众","v":"紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。","tag":"精华"}]},{"g":"二、“五关”与内涵的对应","items":[{"k":"信念关","v":"对应第1条（理想信念）。","tag":"重点"},{"k":"求是关","v":"对应第3条（独立自主、实事求是）。","tag":"重点"},{"k":"团结关","v":"对应第4条（顾全大局、严守纪律、紧密团结）。","tag":"重点"},{"k":"为民关","v":"对应第5条（依靠人民群众）。","tag":"重点"},{"k":"奋斗关","v":"对应第2条（不怕牺牲、艰苦奋斗）。注意五关顺序与内涵顺序并不同步。","tag":"重点"}]},{"g":"三、关键史实与诗词对应","items":[{"k":"起止时间","v":"1934年10月开始战略转移；1936年10月三大主力在<b>甘肃会宁和将台堡</b>会师，长征胜利结束。","tag":"精华"},{"k":"遵义会议","v":"1935年1月召开，事实上确立了毛泽东同志在党中央和红军的领导地位，是党的历史上一个<b>生死攸关的转折点</b>。","tag":"精华"},{"k":"长征数字","v":"途经<b>11个省</b>、翻越<b>18座大山</b>、跨过<b>24条大河</b>。","tag":"重点"},{"k":"湘江战役","v":"1934年底长征初期最惨烈一役，红军由<b>8万余人锐减至3万余人</b>，直接促成遵义会议的召开。","tag":"重点"},{"k":"七律·长征","v":"“金沙水拍云崖暖”指<b>巧渡金沙江</b>；“大渡桥横铁索寒”指<b>飞夺泸定桥</b>。","tag":"精华"},{"k":"当代价值","v":"“每一代人有每一代人的长征路，每一代人都要走好自己的长征路。”（习近平2016年10月21日纪念红军长征胜利80周年大会讲话）","tag":"重点"}]}],"by10":[{"g":"一、节目基本信息","items":[{"k":"制作单位","v":"中央组织部、中央广播电视总台联合制作。","tag":"精华"},{"k":"首播时间","v":"2026年1月20日CCTV-1晚8点档首播。","tag":"精华"},{"k":"展现对象","v":"共<b>5名党员+2个党支部</b>。","tag":"精华"},{"k":"节目形式","v":"典型事迹展示、现场访谈互动、<b>重温入党志愿书</b>等。","tag":"重点"}]},{"g":"二、五名党员事迹","items":[{"k":"茹振钢","v":"河南科技学院教授、小麦育种专家，“麦田守望者”；四十余载深耕育种，育成“矮抗58”等品种，推广面积超<b>4亿亩</b>，“把论文写在田野上”。","tag":"精华"},{"k":"梁建英","v":"中车四方高铁研发专家；面对国外技术封锁，带队攻克空气动力学、噪声控制等世界级难题，中国高铁从“跟跑”“并跑”到“领跑”。","tag":"精华"},{"k":"冷晓琨","v":"青年科技工作者（人形机器人领域），从零起步，致力突破“卡脖子”关键核心技术。","tag":"重点"},{"k":"田野","v":"基层干部，扎根贵州纳雍县推动乡村振兴，把群众急难愁盼放在心上。","tag":"了解"},{"k":"罗胤","v":"北京市东城区司法局副局长；20余年工作经历中<b>15年</b>扎根基层司法所，获“全国人民满意的公务员”等称号。","tag":"重点"}]},{"g":"三、两个先进党支部","items":[{"k":"义乌市天盟实业投资有限公司党支部","v":"“义新欧”班列运营企业党组织，践行“一带一路”倡议的战斗堡垒。","tag":"了解"},{"k":"空军95944部队60分队党支部","v":"军队基层党组织，战斗堡垒作用典型。","tag":"了解"}]}],"zzjs":[{"g":"一、组织制度与组织体系","items":[{"k":"最高领导机关","v":"党的全国代表大会和它所产生的中央委员会。","tag":"精华"},{"k":"根本组织原则","v":"<b>民主集中制</b>——民主基础上的集中和集中指导下的民主相结合。","tag":"精华"},{"k":"四个服从","v":"党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。","tag":"精华"},{"k":"组织体系","v":"党的中央组织、党的地方组织、党的基层组织三级。","tag":"重点"},{"k":"基层组织","v":"凡是有正式党员<b>3人以上</b>的基层单位应当成立；是党在社会基层组织中的<b>战斗堡垒</b>，是党的全部工作和战斗力的基础。","tag":"精华"}]},{"g":"二、组织生活与作风","items":[{"k":"三会一课","v":"
