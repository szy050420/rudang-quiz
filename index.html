<style>
/* ==========================================================================
   入党考试复习搭子 · app.css
   视觉概念：红色档案（学员档案卡 + 朱印 + 描金细线），宣纸底、旗红为记、
   松绿为对。一页只放一处醒目（首页档案卡），其余靠线、留白与字距说话。
   ========================================================================== */

:root {
  /* 墨与纸 */
  --ink: #1A1411;
  --ink-2: #42382F;
  --ink-3: #6E6255;
  --paper: #FAF4E8;
  --paper-2: #F1E6D1;
  --paper-3: #FFFCF4;
  --line: #E1D2B7;
  --line-2: #CBB793;

  /* 记与对 */
  --red: #B31B22;
  --red-deep: #7C1015;
  --red-wash: #F6E4E1;
  --gold: #B98A2B;
  --gold-2: #DCC079;
  --jade: #2C5A4B;
  --jade-wash: #E4EDE8;
  --danger: #A6191D;

  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --r-card: 12px;
  --r-btn: 8px;
  --r-tag: 4px;

  --w: 1080px;
  --pad: 20px;
  --ease: cubic-bezier(.2, .7, .3, 1);
  --nav-h: 62px;
}

[data-theme="dark"] {
  --ink: #F7EFE1;
  --ink-2: #DED1BE;
  --ink-3: #B7A894;
  --paper: #14100E;
  --paper-2: #1F1916;
  --paper-3: #241D19;
  --line: #3A2F27;
  --line-2: #55463A;
  --red: #E2594C;
  --red-deep: #F27C6E;
  --red-wash: #2C1A17;
  --gold: #DDB24C;
  --gold-2: #8C7130;
  --jade: #86B9A7;
  --jade-wash: #17241F;
  --danger: #F08A80;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.68;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

/* 旗红压条：全站唯一一条饱和色，钉住"这是一个党建资料站" */
body::before {
  content: "";
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red-deep), var(--red) 45%, var(--gold) 100%);
  z-index: 90;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; line-height: 1.32; }
h1 { font-size: 28px; letter-spacing: -.01em; }
h2 { font-size: 22px; letter-spacing: -.005em; }
h3 { font-size: 18px; }
p { margin: 0 0 12px; }
a { color: var(--red); text-underline-offset: 3px; }

:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--paper-3); color: var(--ink); padding: 12px 16px; z-index: 100;
}
.skip:focus { left: 8px; top: 8px; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

.icon-btn svg { display: block; }

.frame {
  max-width: var(--w);
  margin: 0 auto;
  padding: 0 var(--pad) calc(var(--nav-h) + 40px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

main { outline: none; padding-top: 8px; flex: 1; }
main:focus, main:focus-visible { outline: none; }

.colophon {
  border-top: 1px solid var(--line);
  margin-top: 56px;
  padding-top: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--ink-3);
}

/* ---------------------------------------------------------------- masthead */
.masthead {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 0 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
/* 描金细线：档案页的分隔 */
.masthead::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -4px;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-2), transparent 70%);
  opacity: .8;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit; flex: 1; }

.medallion {
  flex: 0 0 auto;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: #FFFDF8;
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  overflow: hidden;
  box-shadow: inset 0 0 0 3px #FFFDF8;
}
.medallion img { display: block; width: 100%; height: 100%; object-fit: cover; }

.seal {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border: 2px solid var(--red);
  border-radius: var(--r-tag);
  display: grid; place-items: center;
  color: var(--red);
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1;
}

.brand-text { min-width: 0; }
.brand-text .school {
  display: block;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text .product {
  display: block;
  font-family: var(--serif);
  font-size: 18px;
  letter-spacing: .06em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.masthead-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

.who-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: var(--r-tag);
  font-size: 12px; letter-spacing: .06em; color: var(--ink-2);
  background: transparent;
}
.who-chip b { color: var(--red); font-weight: 600; }

/* ---------------------------------------------------------------- tabbar */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
/* 答题/模考这类专注模式下收掉底栏，把整屏让给题目 */
.tabbar[hidden] { display: none; }
body.in-session .frame { padding-bottom: 40px; }
.tab {
  flex: 1;
  min-height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 0; background: transparent;
  color: var(--ink-3);
  font-family: var(--sans); font-size: 11px; letter-spacing: .16em;
  text-decoration: none;
  cursor: pointer;
  position: relative;
  transition: color 140ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.tab:active { background: var(--paper-2); }
.tab .tab-zh { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; line-height: 1.1; }
.tab .tab-sub { display: none; }
.tab[aria-current="page"] { color: var(--red); }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 34%; right: 34%;
  height: 2px; background: var(--red);
}

/* ---------------------------------------------------------------- headings */
.kicker {
  font-size: 11px; letter-spacing: .22em; color: var(--ink-3);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.kicker::before { content: ""; width: 18px; height: 1px; background: var(--red); flex: 0 0 auto; }
.linkish {
  border: 0; background: transparent; padding: 0; margin-left: 6px;
  font: inherit; letter-spacing: .04em; color: var(--red);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  min-height: 24px;
}

.lede { font-size: 16px; color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.section { margin-top: 44px; }
.section-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.section-head h2 { margin-right: auto; }
.section-head .count { font-size: 12px; letter-spacing: .1em; color: var(--ink-3); }

.rule { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }

/* ---------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 20px;
  border: 1px solid transparent; border-radius: var(--r-btn);
  font-family: var(--sans); font-size: 15px; line-height: 1;
  cursor: pointer;
  transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease), transform 90ms var(--ease);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--red); color: #FFF8F2; border-color: var(--red); }
.btn-primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-quiet {
  min-height: 44px; padding: 0 8px; border: 0; background: transparent;
  color: var(--ink-3); font-family: var(--sans); font-size: 14px;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.btn-quiet:hover { color: var(--ink); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.icon-btn {
  width: 42px; height: 42px; display: grid; place-items: center;
  border: 1px solid var(--line-2); border-radius: var(--r-btn);
  background: transparent; color: var(--ink-2); cursor: pointer;
  font-family: var(--sans); font-size: 13px;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 140ms var(--ease), color 140ms var(--ease);
}
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn:active { background: var(--paper-2); }

/* ---------------------------------------------------------------- tags */
.tag {
  display: inline-flex; align-items: center; justify-content: center;
  height: 21px; padding: 0 6px;
  border: 1px solid var(--line); border-radius: var(--r-tag);
  font-size: 11px; letter-spacing: .08em; line-height: 1;
  color: var(--ink-3);
  white-space: nowrap;
}
.tag-must { border-color: var(--red); color: var(--red); }
.tag-high { border-color: var(--ink-3); color: var(--ink-2); }
.tag-know { border-color: var(--line); color: var(--ink-3); }
.tag-gold { border-color: var(--gold); color: var(--gold); }
.tag-solid { background: var(--red); border-color: var(--red); color: #FFF8F2; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chip {
  min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line-2); border-radius: var(--r-tag);
  background: transparent; color: var(--ink-2);
  font-family: var(--sans); font-size: 14px; letter-spacing: .04em;
  cursor: pointer;
  transition: border-color 140ms var(--ease), color 140ms var(--ease), background 140ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { border-color: var(--red); color: var(--red); background: var(--red-wash); }

/* ---------------------------------------------------------------- hero */
.hero { padding: 28px 0 8px; }
.hero h1 { font-size: 32px; line-height: 1.26; margin-bottom: 12px; max-width: 20ch; letter-spacing: -.015em; }
.hero .lede { margin-bottom: 0; }

.home-today { margin-top: 34px; }

@media (min-width: 900px) {
  .home-top {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 56px;
    align-items: start;
  }
  .home-today { margin-top: 40px; }
}

/* ---------------------------------------------------------------- 学员档案 */
.record {
  position: relative;
  margin-top: 20px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 0;
  overflow: hidden;
}
/* 档案卡左上角的红色书脊标签 */
.record-tag {
  position: absolute; top: 0; left: 0;
  background: var(--red); color: #FFF8F2;
  font-size: 10px; letter-spacing: .3em;
  padding: 5px 12px 5px 14px;
  border-bottom-right-radius: var(--r-tag);
}
.record-body { padding: 30px 22px 22px; display: flex; gap: 22px; align-items: center; }
.record-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.record-field { min-width: 0; }
.record-field .k {
  display: block;
  font-size: 10px; letter-spacing: .22em; color: var(--ink-3);
  padding-bottom: 4px; border-bottom: 1px solid var(--line);
  margin-bottom: 6px;
}
.record-field .v { font-family: var(--serif); font-size: 22px; line-height: 1.2; }
.record-field .v small { font-family: var(--sans); font-size: 11px; color: var(--ink-3); letter-spacing: .06em; margin-left: 4px; }
.record-foot {
  border-top: 1px dashed var(--line-2);
  padding: 10px 22px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-3); letter-spacing: .04em;
}
.record-foot .spacer { flex: 1; }

/* 朱印：进度以印章的形态出现，而不是一个通用进度环 */
.stamp {
  flex: 0 0 auto;
  width: 84px; height: 84px;
  border: 2px solid var(--red);
  border-radius: 50%;
  display: grid; place-items: center;
  position: relative;
  color: var(--red);
  transform: rotate(-4deg);
}
.stamp::after {
  content: ""; position: absolute; inset: 5px;
  border: 1px solid currentColor; border-radius: 50%; opacity: .4;
}
.stamp svg { display: block; position: relative; z-index: 1; }
.ring-bg { stroke: var(--line-2); }
.ring-fg { stroke: var(--red); transition: stroke-dashoffset 400ms var(--ease); }
.ring-text { font-family: var(--sans); font-size: 11px; fill: var(--red); font-weight: 600; }

/* ---------------------------------------------------------------- identity */
.identity {
  display: grid; grid-template-columns: 1fr; gap: 14px;
  margin-top: 28px;
}
.identity-card {
  text-align: left;
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 22px;
  min-height: 168px;
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer;
  transition: border-color 180ms var(--ease), background 180ms var(--ease), transform 120ms var(--ease);
  font-family: var(--sans); color: var(--ink);
}
.identity-card:hover { border-color: var(--red); background: var(--paper-3); transform: translateY(-2px); }
.identity-card .no { font-size: 11px; letter-spacing: .24em; color: var(--gold); }
.identity-card .name { font-family: var(--serif); font-size: 26px; letter-spacing: .02em; }
.identity-card .desc { font-size: 14px; color: var(--ink-2); line-height: 1.65; flex: 1; }
.identity-card .meta { display: flex; gap: 12px; font-size: 12px; color: var(--ink-3); padding-top: 6px; border-top: 1px solid var(--line); }
.identity-mark { display: flex; align-items: center; gap: 16px; margin: 8px 0 4px; }
.identity-mark img { width: 64px; height: 64px; border-radius: 50%; background: #FFFDF8; border: 1px solid var(--line-2); object-fit: cover; }
.identity-mark .t { font-size: 12px; letter-spacing: .14em; color: var(--ink-3); }

/* ---------------------------------------------------------------- today list */
.today {
  margin-top: 32px;
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 2px 20px;
}
.today-row {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0;
  font-family: var(--sans); color: var(--ink); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.today-row:last-child { border-bottom: 0; }
.today-row:active .today-title { color: var(--red); }
.today-row:hover .today-title { color: var(--red); }
.today-no {
  flex: 0 0 26px; font-family: var(--serif); font-size: 13px; color: var(--gold);
  letter-spacing: .04em;
}
.today-main { flex: 1; min-width: 0; }
.today-title { font-size: 16px; margin-bottom: 2px; transition: color 140ms var(--ease); }
.today-sub { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.today-go { flex: 0 0 auto; font-size: 13px; color: var(--red); letter-spacing: .04em; }

.statline {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 18px 0 4px;
}
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat b { font-family: var(--serif); font-size: 26px; font-weight: 600; }
.stat span { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }

.ring { flex: 0 0 auto; }
.ring svg { display: block; }

/* ---------------------------------------------------------------- rows */
.list { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 15px 0;
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--ink);
  font-family: var(--sans); text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.row:hover .row-title, .row:active .row-title { color: var(--red); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; line-height: 1.45; transition: color 140ms var(--ease); }
.row-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.row-meta { flex: 0 0 auto; font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }
.row-arrow { flex: 0 0 auto; color: var(--ink-3); font-size: 13px; }

.plain-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.plain-row .body { flex: 1; min-width: 0; }

/* 模块行的重点率细条 */
.weight-bar { height: 2px; background: var(--line); margin-top: 8px; max-width: 180px; }
.weight-bar i { display: block; height: 2px; background: var(--gold); }

/* ---------------------------------------------------------------- stages */
.stage {
  display: flex; gap: 16px;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}
.stage-no {
  flex: 0 0 62px;
  font-family: var(--serif); font-size: 12px; color: var(--red);
  letter-spacing: .1em;
  padding-top: 3px;
  white-space: nowrap;
}
.stage-body { flex: 1; min-width: 0; }
.stage-body h3 { margin-bottom: 6px; }
.stage-mods { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* ---------------------------------------------------------------- points / cards */
.pt-group { margin-bottom: 30px; }
.pt-group h3 {
  font-size: 16px; margin-bottom: 8px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.pt-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.pt-item:last-child { border-bottom: 0; }
.pt-k { font-size: 14px; color: var(--ink-2); flex: 0 0 34%; }
.pt-v { font-size: 14px; color: var(--ink); flex: 1; font-family: var(--sans); }
.pt-v b {
  font-weight: 600; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--red);
  text-decoration-thickness: 1px; text-underline-offset: 3px;
}

.mcards { display: grid; grid-template-columns: 1fr; gap: 12px; }
.mcard {
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  padding: 16px;
  background: var(--paper-3);
  font-family: var(--sans); color: var(--ink); text-align: left;
  cursor: pointer; width: 100%;
  transition: border-color 140ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.mcard:hover { border-color: var(--ink-3); }
.mcard .face { font-size: 15px; }
.mcard .flip-hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; letter-spacing: .06em; }
.mcard-back {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: 14px; color: var(--ink-2);
}
.mcard .meta { display: flex; gap: 6px; margin-top: 8px; }

/* ---------------------------------------------------------------- 主观题 */
.subj {
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 18px 20px;
  margin-bottom: 14px;
}
.subj-q { font-family: var(--serif); font-size: 18px; line-height: 1.55; margin-bottom: 10px; }
.subj-pts { margin: 0 0 12px; padding: 0; list-style: none; counter-reset: sp; }
.subj-pts li {
  counter-increment: sp;
  font-size: 14px; color: var(--ink-2);
  padding: 5px 0 5px 26px; position: relative;
  border-bottom: 1px dashed var(--line);
}
.subj-pts li:last-child { border-bottom: 0; }
.subj-pts li::before {
  content: counter(sp);
  position: absolute; left: 0; top: 6px;
  width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--gold); color: var(--gold);
  font-size: 10px; display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.subj-ans {
  border-left: 2px solid var(--red);
  padding: 2px 0 2px 16px;
  font-size: 15px; line-height: 1.85; color: var(--ink);
  white-space: pre-wrap;
}
.subj-tip {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--ink-3);
}
.subj-tip b { color: var(--gold); font-weight: 600; letter-spacing: .06em; }
.subj-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.subj-toggle {
  min-height: 40px; padding: 0 14px; margin-top: 12px;
  border: 1px solid var(--red); border-radius: var(--r-btn);
  background: transparent; color: var(--red);
  font-family: var(--sans); font-size: 14px; cursor: pointer;
}
.subj-toggle[aria-expanded="true"] { background: var(--red); color: #FFF8F2; }

/* ---------------------------------------------------------------- runner */
.runner-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 3px; z-index: 10;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.runner-progress { flex: 1; min-width: 0; }
.runner-progress .bar { height: 2px; background: var(--line); margin-top: 8px; }
.runner-progress .bar i { display: block; height: 2px; background: var(--red); width: 0; transition: width 220ms var(--ease); }
.runner-count { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }

.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 26px 0 12px; }
.qstem { font-size: 19px; line-height: 1.65; margin: 0 0 24px; font-weight: 500; }
.qnote { font-size: 13px; color: var(--ink-3); margin: -12px 0 20px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; min-height: 54px;
  padding: 14px 16px;
  border: 1px solid var(--line-2); border-radius: var(--r-btn);
  background: var(--paper-3); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.55; text-align: left;
  cursor: pointer;
  transition: border-color 120ms var(--ease), background 120ms var(--ease), transform 90ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.opt:hover { border-color: var(--ink-3); }
.opt:active { transform: scale(.994); }
.opt .key {
  flex: 0 0 24px; height: 24px;
  border: 1px solid var(--line-2); border-radius: var(--r-tag);
  display: grid; place-items: center;
  font-size: 12px; color: var(--ink-3);
}
.opt.is-picked { border-color: var(--red); background: var(--red-wash); }
.opt.is-picked .key { border-color: var(--red); color: var(--red); }
.opt.is-ok { border-color: var(--jade); background: var(--jade-wash); }
.opt.is-ok .key { border-color: var(--jade); color: var(--jade); }
.opt.is-no { border-color: var(--danger); background: var(--red-wash); }
.opt.is-no .key { border-color: var(--danger); color: var(--danger); }
.opt .mk { margin-left: auto; font-size: 12px; letter-spacing: .06em; flex: 0 0 auto; align-self: center; }
.opt .txt { flex: 1 1 auto; min-width: 0; }
.opt[disabled] { cursor: default; }

.judge-row { display: flex; gap: 12px; }
.judge-row .opt { flex: 1; justify-content: center; }
.judge-row .opt .key { display: none; }

.fill-input {
  width: 100%; min-height: 54px; padding: 12px 16px;
  border: 1px solid var(--line-2); border-radius: var(--r-btn);
  background: var(--paper-3); color: var(--ink);
  font-family: var(--sans); font-size: 16px;
  line-height: 1.7;
}
.fill-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }

.feedback { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }
.verdict { font-size: 14px; letter-spacing: .06em; margin-bottom: 8px; }
.verdict.ok { color: var(--jade); }
.verdict.no { color: var(--danger); }
.explain { font-size: 14px; color: var(--ink-2); line-height: 1.8; }
.explain .src { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-3); }

.self-eval { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

.runner-foot {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
}
.runner-foot .spacer { flex: 1; }
.kbd-hint { font-size: 12px; color: var(--ink-3); }

/* ---------------------------------------------------------------- result */
.score {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--serif);
  margin: 8px 0 4px;
}
.score b { font-size: 56px; line-height: 1; font-weight: 600; }
.score span { font-size: 14px; color: var(--ink-3); }

.review-item {
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
.review-q { font-size: 15px; margin-bottom: 8px; }
.review-line { font-size: 13px; color: var(--ink-3); }
.review-line b { color: var(--ink-2); font-weight: 500; }
.review-item.no .review-q::before { content: "✕ "; color: var(--danger); }
.review-item.ok .review-q::before { content: "✓ "; color: var(--jade); }

/* ---------------------------------------------------------------- toast / modal */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 8px);
  max-width: calc(100vw - 40px);
  background: var(--ink); color: var(--paper);

  z-index: 60;
}

  display: grid; place-items: center;
  padding: 24px;
}
.modal[hidden] { display: none; }

  border: 1px solid var(--line-2); border-radius: var(--r-card);
  padding: 24px;
}
.modal-title { font-size: 20px; margin-bottom: 8px; }
.modal-body { font-size: 14px; color: var(--ink-2); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- empty */
.empty {
  border: 1px dashed var(--line-2); border-radius: var(--r-card);
  padding: 36px 24px; text-align: center; color: var(--ink-3);
  background: var(--paper-3);
}
.empty p { margin-bottom: 16px; }

/* ---------------------------------------------------------------- 身份页 / 主观题 */
.identity-hero .identity-mark { margin-bottom: 20px; }
.identity-hero h1 { max-width: 22ch; }
.subj-list { margin-top: 20px; }
.subj-tips {
  margin: 16px 0 0; padding-left: 18px;
  font-size: 13px; color: var(--ink-3); line-height: 1.85;
}
.subj-tips li::marker { color: var(--gold); }

/* 小屏：页头只留两个图标按钮，身份在首页与底栏切换 */
@media (max-width: 719px) {
  .who-chip { display: none; }
  .masthead-actions { gap: 6px; }

  .record-field .v { font-size: 19px; }
  .tab { letter-spacing: .1em; }
}

/* ---------------------------------------------------------------- desktop */
@media (min-width: 720px) {

  .mcards { grid-template-columns: 1fr 1fr; }
  .pt-k { flex-basis: 30%; }
  h1 { font-size: 32px; }
  h2 { font-size: 24px; }
  .record-body { padding: 34px 28px 24px; }
}

@media (min-width: 900px) {
  :root { --pad: 40px; --nav-h: 0px; }
  .frame { padding-bottom: 48px; }
  .masthead { padding: 22px 0 16px; }
  .brand-text .product { font-size: 20px; }
  .tabbar {
    position: static;
    border-top: 0; border-bottom: 1px solid var(--line);
    justify-content: flex-start;
    gap: 2px;
    padding: 0;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .tab {
    flex: 0 0 auto;
    min-height: 52px;
    flex-direction: row; gap: 8px;
    padding: 0 16px;
    font-size: 13px;
  }
  .tab .tab-zh { font-size: 15px; }
  .tab .tab-sub {
    display: inline;
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--ink-3);
  }
  .tab[aria-current="page"] .tab-sub { color: var(--red); opacity: .7; }
  .tab[aria-current="page"]::before {
    top: auto; bottom: -1px; left: 10px; right: 10px; height: 2px;
  }
  .toast { bottom: 32px; }
  .stage { padding: 26px 0; }
  .hero { padding: 52px 0 8px; }
  .runner-head { top: 0; }
}

/* ---------------------------------------------------------------- motion / contrast */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .btn:active, .opt:active, .identity-card:hover { transform: none; }
}

@media (prefers-contrast: more) {
  :root { --line: #9C8B70; --line-2: #7A6A52; --ink-3: #4E453A; }
  .row, .today-row, .plain-row { border-bottom-width: 1px; }
}

@media print {
  .tabbar, .masthead, .toast, .modal, .runner-foot { display: none; }
  body::before { display: none; }
}

由、平等、公正、法治”属于（）层面。","o":["国家","社会","个人","公民"],"a":1,"e":"国家：富强民主文明和谐；社会：自由平等公正法治；个人：爱国敬业诚信友善。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_b7c2ecef","m":"jcgn","t":"single","q":"新质生产力的本质是（）。","o":["高科技","先进生产力","新产业","新动能"],"a":1,"e":"特点是创新，关键在质优，本质是先进生产力。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_59c78cc9","m":"jcgn","t":"single","q":"中国特色社会主义进入新时代，这是我国发展新的（）。","o":["发展阶段","历史方位","主要矛盾","战略机遇期"],"a":1,"e":"新时代是我国发展新的历史方位。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_45f2a9ee","m":"jcgn","t":"judge","q":"“两个维护”是指坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","a":true,"e":"正确。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_02da73de","m":"jcgn","t":"judge","q":"“四个意识”包括政治意识、大局意识、核心意识、纪律意识。","a":false,"e":"是政治、大局、核心、看齐意识。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_13f760ea","m":"jcgn","t":"judge","q":"伟大建党精神是中国共产党的精神之源。","a":true,"e":"正确。32字伟大建党精神。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_a920e376","m":"jcgn","t":"judge","q":"新发展理念是指创新、协调、绿色、开放、共享。","a":true,"e":"正确，五大发展理念。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_b2eb5cab","m":"jcgn","t":"judge","q":"党的百年奋斗历史经验“十个坚持”中包括“坚持自我革命”。","a":true,"e":"正确，自我革命是十条历史经验之一。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_32e9a5cf","m":"jcgn","t":"judge","q":"“十个明确”是习近平新时代中国特色社会主义思想的核心内容之一。","a":true,"e":"核心内容：十个明确＋十四个坚持＋十三个方面成就。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_14cbba03","m":"jcgn","t":"judge","q":"和平共处五项原则包括互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。","a":true,"e":"正确。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_2e4058ca","m":"jcgn","t":"judge","q":"三会一课中的“一课”指党课。","a":true,"e":"支部党员大会、支部委员会、党小组会＋党课。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_b90a904e","m":"jcgn","t":"multi","q":"党的百年奋斗历史经验包括（）。","o":["坚持党的领导","坚持人民至上","坚持敢于斗争","坚持自我革命"],"a":[0,1,2,3],"e":"十个坚持中的四项。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_0fba6245","m":"jcgn","t":"multi","q":"社会主义核心价值观社会层面的价值取向包括（）。","o":["自由","平等","公正","法治"],"a":[0,1,2,3],"e":"社会层面：自由、平等、公正、法治。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_e6bcf95a","m":"jcgn","t":"fill","q":"“两个确立”：确立习近平同志党中央的核心、全党的核心地位，确立________的指导地位。","a":"习近平新时代中国特色社会主义思想","e":"两个确立。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_03eaf29a","m":"jcgn","t":"fill","q":"伟大建党精神：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、________。","a":"不负人民","e":"32字伟大建党精神。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_b773e9bc","m":"jcgn","t":"fill","q":"入党申请人→入党积极分子→________→预备党员→正式党员。","a":"发展对象","e":"发展党员五阶段身份链条。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_dz_ae6833b0","m":"dz","t":"short","q":"简述申请加入中国共产党的基本条件。","a":"年满十八岁的中国工人、农民、军人、知识分子和其他社会阶层的先进分子，承认党的纲领和章程，愿意参加党的一个组织并在其中积极工作、执行党的决议和按期交纳党费的，可以申请加入中国共产党。","e":"要点：①年满十八岁；②先进分子；③承认党的纲领和章程；④参加党的一个组织并积极工作；⑤执行党的决议；⑥按期交纳党费。","lv":1,"freq":"must","obj":["active","develop"],"h":"H1"},{"id":"q_dz_1b4335e4","m":"dz","t":"short","q":"请完整默写入党誓词（80字）。","a":"我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。","e":"逐句核对，一字不差为满分；漏句、错字酌情扣分。此题几乎必考。","lv":1,"freq":"must","obj":["active","develop"],"h":"H1"},{"id":"q_dz_1f7f2455","m":"dz","t":"short","q":"关于入党宣誓，党章有哪些规定？","a":"预备党员必须面向党旗进行入党宣誓。誓词共80字（全文见上一题）。宣誓是对预备党员进行教育的一种形式，表示党员自愿承担政治责任、对党忠诚。","e":"要点：①主体是预备党员；②面向党旗；③誓词内容。","lv":1,"freq":"must","obj":["active","develop"],"h":"H1"},{"id":"q_fz_b801a507","m":"fz","t":"short","q":"简述发展党员工作的十六字总要求。","a":"控制总量、优化结构、提高质量、发挥作用。","e":"十六个字，缺一不可。注意与三个坚持、两个禁止区分。","lv":1,"freq":"must","obj":["active","develop"],"h":"H2"},{"id":"q_fz_0ceaa2c7","m":"fz","t":"short","q":"简述发展党员工作的三个坚持。","a":"①坚持党章规定的党员标准，始终把政治标准放在首位；②坚持慎重发展、均衡发展，有领导、有计划地进行；③坚持入党自愿原则和个别吸收原则，成熟一个，发展一个。","e":"要点：①政治标准首位；②慎重发展、均衡发展；③自愿原则、个别吸收原则，成熟一个发展一个。","lv":1,"freq":"must","obj":["active","develop"],"h":"H2"},{"id":"q_fz_1ed9bba0","m":"fz","t":"short","q":"发展党员工作中的两个禁止（反对）是什么？","a":"禁止突击发展，反对关门主义。","e":"八个字。突击发展指为完成任务降低标准匆忙发展；关门主义指把符合条件的人拒之门外。","lv":2,"freq":"high","obj":["active","develop"],"h":"H2"},{"id":"q_fz_8f78c116","m":"fz","t":"short","q":"简述入党积极分子的确定程序与培养教育的主要方式。","a":"确定程序：在入党申请人中确定入党积极分子，应当采取党员推荐、群团组织推优等方式产生人选，由支部委员会（不设支部委员会的由支部大会）研究决定，并报上级党委备案。培养教育方式：党组织指定一至两名正式党员作培养联系人；吸收听党课、参加党内有关活动、分配一定的社会工作以及集中培训等。党支部每半年对入党积极分子进行一次考察。","e":"要点：①党员推荐、群团组织推优；②支委会研究决定；③报上级党委备案；④一至两名正式党员作培养联系人；⑤每半年考察一次。","lv":2,"freq":"high","obj":["active","develop"],"h":"H2"},{"id":"q_fz_4de56007","m":"fz","t":"short","q":"入党积极分子经过多长时间的培养教育和考察，方可列为发展对象？对发展对象的确定程序有何规定？","a":"入党积极分子经过一年以上的培养教育和考察，在听取党小组、培养联系人、党员和群众意见的基础上，支部委员会讨论同意并报上级党委备案后，可列为发展对象。","e":"要点：①一年以上；②听取党小组、培养联系人、党员和群众意见；③支部委员会讨论同意；④报上级党委备案。","lv":1,"freq":"must","obj":["active","develop"],"h":"H3"},{"id":"q_fz_fd892abb","m":"fz","t":"short","q":"简述对发展对象进行政治审查的主要内容。","a":"①对党的理论、路线、方针、政策的态度；②本人的政治历史和在重大政治斗争中的表现；③遵纪守法和遵守社会公德情况；④直系亲属和与本人关系密切的主要社会关系的政治情况。凡是未经政治审查或者政治审查不合格的，不得发展入党。","e":"四个方面+结论句（未经政审或政审不合格不得发展入党）。结论句常单独出判断题。","lv":1,"freq":"must","obj":["active","develop"],"h":"H3"},{"id":"q_fz_475861ed","m":"fz","t":"short","q":"简述发展对象短期集中培训的规定。","a":"基层党委或者县级党委组织部门应当对发展对象进行短期集中培训，时间一般不少于三天（或者不少于二十四个学时）。培训内容主要是党章、《关于党内政治生活的若干准则》等文件。未经培训的，除个别特殊情况外，不能发展入党。","e":"要点：①主体：基层党委或县级党委组织部门；②不少于三天或24个学时；③内容：党章、《准则》等；④未经培训原则上不能发展。","lv":2,"freq":"high","obj":["active","develop"],"h":"H3"},{"id":"q_fz_4262f1b1","m":"fz","t":"short","q":"关于入党介绍人，发展党员工作细则有哪些规定？","a":"发展对象应当有两名正式党员作入党介绍人。入党介绍人可以由党组织指定，也可以由发展对象自己约请。受留党察看处分尚未恢复党员权利的党员，不能作入党介绍人。入党介绍人的主要任务：①向发展对象解释党的纲领、章程；②认真了解发展对象的入党动机、政治觉悟、道德品质、工作经历、现实表现等情况，如实向党组织汇报；③指导发展对象填写《中国共产党入党志愿书》，并认真填写自己的意见；④向党支部负责地介绍发展对象的情况。","e":"要点：①两名正式党员；②指定或约请均可；③受留党察看处分未恢复权利者不能担任。","lv":1,"freq":"must","obj":["active","develop"],"h":"H3"},{"id":"q_fz_0c1d973c","m":"fz","t":"short","q":"简述支部大会讨论接收预备党员的主要程序。","a":"①发展对象汇报对党的认识、入党动机、本人履历、家庭和主要社会关系情况，以及需要向党组织说明的问题；②入党介绍人介绍发展对象有关情况，并对其能否入党表明意见；③支部委员会报告对发展对象的审查情况；④与会党员对发展对象能否入党进行充分讨论，并采取无记名投票方式进行表决。赞成人数超过应到会有表决权的正式党员的半数，方可通过。","e":"四个步骤+表决规则（无记名投票、超过应到会人数半数）。逐个讨论表决，不能合并。","lv":1,"freq":"must","obj":["active","develop"],"h":"H4"},{"id":"q_fz_bb1bcb0e","m":"fz","t":"short","q":"党委对党支部上报的接收预备党员的决议，审批上有何规定？","a":"党委对党支部上报的接收预备党员的决议，应当在三个月内审批。如遇特殊情况可适当延长审批时间，但不得超过六个月。党委审批时必须集体讨论、逐个审议表决。党总支不能审批预备党员。临时党组织不能接收、审批预备党员。","e":"要点：①三个月内审批；②特殊情况最长不超过六个月；③集体讨论逐个表决；④党总支、临时党组织不能审批。","lv":2,"freq":"high","obj":["active","develop"],"h":"H4"},{"id":"q_dz_6bdeb79c","m":"dz","t":"short","q":"预备党员的预备期如何起算？预备期满后应如何办理转正手续？","a":"预备党员的预备期为一年，从支部大会通过他为预备党员之日算起。转正手续：①本人提出书面转正申请；②党小组提出意见；③党支部征求党员和群众的意见；④支部委员会审查；⑤支部大会讨论、表决通过；⑥报上级党委审批（审批时间同样为三个月内）。","e":"要点：预备期一年、从支部大会通过之日算起；转正六步程序。转正申请须在预备期满时主动提出。","lv":1,"freq":"must","obj":["active","develop"],"h":"H4"},{"id":"q_fz_d5ba4546","m":"fz","t":"short","q":"预备党员预备期满后，党组织可作出哪些处理？","a":"①认真履行党员义务、具备党员条件的，应当按期转为正式党员；②需要继续考察和教育的，可以延长一次预备期，延长时间不能少于半年、最长不超过一年；③不履行党员义务、不具备党员条件的，应当取消其预备党员资格。","e":"三种处理：按期转正、延长预备期（一次，半年至一年）、取消资格。注意：延长预备期只能一次。","lv":2,"freq":"high","obj":["active","develop"],"h":"H4"},{"id":"q_fz_41870093","m":"fz","t":"short","q":"预备党员在预备期间违犯党纪的，应如何处理？","a":"应当根据情节轻重，给予相应的处理：情节较轻、尚可保留预备党员资格的，应当进行批评教育或延长预备期；情节较重的，应当取消其预备党员资格。（预备党员的党龄从预备期满转为正式党员之日算起。）","e":"要点：按情节轻重区分处理，不是一律取消资格——这是常见判断题陷阱。","lv":2,"freq":"high","obj":["active","develop"],"h":"H4"},{"id":"q_dz_c3f908f3","m":"dz","t":"short","q":"简述党员的八项义务（要点）。","a":"①认真学习党的理论和知识，提高为人民服务的本领；②贯彻执行党的基本路线和方针政策，带头参加改革开放和社会主义现代化建设；③坚持党和人民的利益高于一切，吃苦在前、享受在后，克己奉公、多做贡献；④自觉遵守党的纪律，模范遵守国家法律法规，严格保守党和国家的秘密；⑤维护党的团结和统一，对党忠诚老实，言行一致；⑥切实开展批评和自我批评，坚决同消极腐败现象作斗争；⑦密切联系群众，维护群众的正当利益；⑧发扬社会主义新风尚，带头实践社会主义核心价值观，在困难和危险时刻挺身而出，英勇斗争，不怕牺牲。","e":"八条主线：学习、贯彻执行、利益、纪律、团结忠诚、批评自我批评、联系群众、新风尚牺牲精神。记忆口诀：学、行、利、纪、诚、批、群、范。","lv":2,"freq":"high","obj":["active","develop"],"h":"H5"},{"id":"q_dz_16a578bb","m":"dz","t":"short","q":"简述党员的八项权利（要点）。","a":"①参加党的有关会议，阅读党的有关文件，接受党的教育和培训；②在党的会议上和党报党刊上，参加关于党的政策问题的讨论；③对党的工作提出建议和倡议；④有根据地批评党的任何组织和任何党员，揭发、检举违法乱纪事实；⑤行使表决权、选举权，有被选举权；⑥党组织讨论决定对本人的党纪处分或鉴定时，有权参加和申辩；⑦对党的决议和政策有不同意见，在坚决执行的前提下可以声明保留，并可向上级组织直至中央提出；⑧向党的上级组织直至中央提出请求、申诉和控告。","e":"八条主线：参会培训、讨论、建议倡议、批评检举、表决选举被选举、申辩、保留意见、请求申诉控告。","lv":2,"freq":"high","obj":["active","develop"],"h":"H5"},{"id":"q_dz_f5dcea80","m":"dz","t":"short","q":"预备党员的义务和权利与正式党员有何异同？","a":"义务方面：预备党员的义务同正式党员一样。权利方面：预备党员的权利除了没有表决权、选举权和被选举权外，也同正式党员一样。","e":"义务完全相同；权利三项受限：表决权、选举权、被选举权。此对比是高频考点。","lv":2,"freq":"high","obj":["active","develop"],"h":"H5"},{"id":"q_dz_abd65e54","m":"dz","t":"short","q":"什么是自行脱党？如何处理？","a":"党员如果没有正当理由，连续六个月不参加党的组织生活，或者不交纳党费，或者不做党所分配的工作，就被认为是自行脱党。支部大会应当决定把这样的党员除名，并报上级党组织批准。","e":"要点：①无正当理由；②连续六个月；③三种情形（不参加组织生活/不交党费/不做分配工作）；④支部大会决定除名+报上级批准。","lv":2,"freq":"high","obj":["active","develop"],"h":"H5"},{"id":"q_dz_a5f6a043","m":"dz","t":"short","q":"简述中国共产党的性质。","a":"中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，是中国特色社会主义事业的领导核心，代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。","e":"两个先锋队+一个领导核心+三个代表。这是党章第一条，必须一字不差。","lv":1,"freq":"must","obj":["active","develop"],"h":"H6"},{"id":"q_dz_63d06f26","m":"dz","t":"short","q":"中国共产党以什么作为自己的行动指南？","a":"中国共产党以马克思列宁主义、毛泽东思想、邓小平理论、三个代表重要思想、科学发展观、习近平新时代中国特色社会主义思想作为自己的行动指南。","e":"六个组成部分按历史顺序排列，顺序不能错、不能漏。","lv":1,"freq":"must","obj":["active","develop"],"h":"H6"},{"id":"q_dz_228919e8","m":"dz","t":"short","q":"简述党在社会主义初级阶段的基本路线。","a":"领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。概括为：一个中心、两个基本点。","e":"要点：①一个中心：以经济建设为中心；②两个基本点：坚持四项基本原则（立国之本）、坚持改革开放（强国之路）；③目标：富强民主文明和谐美丽的社会主义现代化强国（五个修饰词）。","lv":1,"freq":"must","obj":["active","develop"],"h":"H6"},{"id":"q_dz_44643f3f","m":"dz","t":"short","q":"简述党的根本宗旨，以及党同人民群众关系的基本观点。","a":"党的根本宗旨是全心全意为人民服务。党除了工人阶级和最广大人民群众的利益，没有自己特殊的利益。我们党的最大政治优势是密切联系群众，党执政后的最大危险是脱离群众。群众路线：一切为了群众，一切依靠群众，从群众中来，到群众中去。党的初心使命：为中国人民谋幸福、为中华民族谋复兴。","e":"要点：①根本宗旨；②最大政治优势/最大危险对比；③群众路线；④初心使命。","lv":1,"freq":"must","obj":["active","develop"],"h":"H6"},{"id":"q_dz_4775b2b6","m":"dz","t":"short","q":"什么是民主集中制？简述四个服从。","a":"民主集中制是民主基础上的集中和集中指导下的民主相结合。它既是党的根本组织原则，也是群众路线在党的生活中的运用。四个服从：党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。","e":"要点：①定义（民主+集中相结合）；②根本组织原则定位；③四个服从完整表述（最后一个最长最关键）。","lv":1,"freq":"must","obj":["active","develop"],"h":"H7"},{"id":"q_dz_ba61e58a","m":"dz","t":"short","q":"简述党的基层组织设置的人数标准。","a":"凡是有正式党员三人以上的，都应当成立党的基层组织。党员人数一百人以上的，设立党的基层委员会；五十人以上、不足一百人的，设立党的总支部委员会；正式党员三人以上、不足五十人的，设立党的支部委员会。党员人数超过七人的党支部，应当设立支部委员会；不足七人的，设书记一人，必要时增设副书记一人。","e":"数字阶梯：3人成组织；3-50支部；50-100总支部；100以上基层党委；7人以上设支委会。数字类高频题。","lv":2,"freq":"high","obj":["active","develop"],"h":"H7"},{"id":"q_dz_576cb957","m":"dz","t":"short","q":"简述党的基层组织的基本任务（要点）。","a":"①宣传和执行党的路线方针政策及决议；②组织党员认真学习；③对党员进行教育、管理、监督和服务；④密切联系群众，维护群众正当权利和利益；⑤充分发挥党员和群众的积极性创造性，发现培养推荐优秀人才；⑥对要求入党的积极分子进行教育和培养，做好经常性发展党员工作；⑦监督党员干部和其他任何工作人员严格遵守国法政纪；⑧教育党员和群众自觉抵制不良倾向，坚决同违纪违法行为作斗争。","e":"八项任务主线：宣传执行、组织学习、教育管理监督服务、联系群众、发挥积极性、培养积极分子、监督、教育抵制斗争。","lv":2,"freq":"high","obj":["active","develop"],"h":"H7"},{"id":"q_dz_df97ca6f","m":"dz","t":"short","q":"党的纪律主要包括哪六种？其中最根本的是什么？","a":"党的纪律主要包括政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。其中政治纪律是最重要、最根本、最关键的纪律，遵守党的政治纪律是遵守党的全部纪律的基础。","e":"六大纪律+政治纪律的定位。顺序：政组廉群工生。","lv":1,"freq":"must","obj":["active","develop"],"h":"H8"},{"id":"q_dz_aa67ce28","m":"dz","t":"short","q":"简述党的纪律处分的种类及最高处分的规定。","a":"党的纪律处分有五种：警告、严重警告、撤销党内职务、留党察看、开除党籍。开除党籍是党内的最高处分。各级党组织在决定或批准开除党员党籍的时候，应当全面研究有关的材料和意见，采取十分慎重的态度。严重触犯刑律的党员必须开除党籍。","e":"五种处分按轻重排序不能乱；最高处分=开除党籍；严重触犯刑律必须开除党籍。","lv":1,"freq":"must","obj":["active","develop"],"h":"H8"},{"id":"q_dz_4d2cb3dc","m":"dz","t":"short","q":"关于留党察看处分，党章有哪些规定？","a":"留党察看的期限最长不超过二年。党员在留党察看期间没有表决权、选举权和被选举权。留党察看期间确已改正错误的，期满后应当恢复其党员的权利；坚持错误不改的，应当开除党籍。","e":"要点：①最长不超过二年；②期间三项权利（表决、选举、被选举）受限；③期满两种走向：恢复权利或开除党籍。","lv":2,"freq":"high","obj":["active","develop"],"h":"H8"},{"id":"q_dz_25fe4eeb","m":"dz","t":"multi","q":"四个服从包括（）。","o":["党员个人服从党的组织","少数服从多数","下级组织服从上级组织","全党各个组织和全体党员服从党的全国代表大会和中央委员会"],"a":[0,1,2,3],"e":"四个服从是民主集中制的重要内容。","lv":1,"freq":"must","obj":["active","develop"],"h":"H7"},{"id":"q_dsl_e446612b","m":"dsl","t":"short","q":"简述党史学习教育工作的四项主要任务。","a":"学史明理、学史增信、学史崇德、学史力行。①学史明理：深刻领悟中国共产党为什么能、马克思主义为什么行、中国特色社会主义为什么好等道理；②学史增信：增强对马克思主义、共产主义的信仰，对中国特色社会主义的信念，对实现中华民族伟大复兴的信心；③学史崇德：涵养高尚道德品质，崇尚对党忠诚的大德、造福人民的公德、严于律己的品德；④学史力行：坚持在锤炼党性上力行、在为民服务上力行、在推动发展上力行。","e":"总起八字+四条各自内涵。八字诀是第一得分点。","lv":1,"freq":"must","obj":["active","develop"],"h":"H9"},{"id":"q_dsl_a434a747","m":"dsl","t":"short","q":"简述《党史学习教育工作条例》的基本框架与施行时间。","a":"《党史学习教育工作条例》共六章三十四条，2024年1月18日中央政治局常委会会议批准，2024年2月5日中共中央发布施行。条例明确党史学习教育的领导体制、工作职责、内容方式、阵地建设、队伍建设、保障监督等，推动党史学习教育常态化长效化。","e":"要点：①六章三十四条；②2024年2月5日发布施行；③常态化长效化制度保障。","lv":2,"freq":"high","obj":["active","develop"],"h":"H9"},{"id":"q_dsl_08eba9c7","m":"dsl","t":"short","q":"党史学习教育应坚持哪些原则？","a":"坚持党的全面领导，坚持围绕中心、服务大局，坚持以史为鉴、资政育人，坚持守正创新、注重实效，坚持统筹协调、形成合力。（核心要义：用党的奋斗历程和伟大成就鼓舞斗志、明确方向，用党的光荣传统和优良作风坚定信念、凝聚力量，用党的实践创造和历史经验启迪智慧、砥砺品格。）","e":"原则表述+党史学习教育的重要意义（三个用）。","lv":2,"freq":"high","obj":["active","develop"],"h":"H9"},{"id":"q_dsl_352a82a5","m":"dsl","t":"judge","q":"树立正确党史观，必须旗帜鲜明反对历史虚无主义。","a":true,"e":"正确。要警惕和反对历史虚无主义等错误思潮。","lv":1,"freq":"must","obj":["active","develop"],"h":"H9"},{"id":"q_dsl_b8c4edd1","m":"dsl","t":"single","q":"树立正确的党史观，应当坚持用（）把握党的历史。","o":["形而上学观点","辩证唯物主义和历史唯物主义","主观唯心主义","英雄史观"],"a":1,"e":"要坚持辩证唯物主义和历史唯物主义，准确把握党的历史发展的主题主线、主流本质。","lv":2,"freq":"high","obj":["active","develop"],"h":"H9"},{"id":"q_esd_1b817a80","m":"esd","t":"short","q":"简述新时代新征程中国共产党的中心任务。","a":"从现在起，中国共产党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","e":"一个中心任务三个关键短语：团结带领全国各族人民、全面建成社会主义现代化强国+第二个百年奋斗目标、以中国式现代化全面推进中华民族伟大复兴。必须完整背诵。","lv":1,"freq":"must","obj":["active","develop"],"h":"H10"},{"id":"q_esd_1e2b2912","m":"esd","t":"short","q":"简述中国式现代化的中国特色（五个方面）。","a":"中国式现代化是人口规模巨大的现代化，是全体人民共同富裕的现代化，是物质文明和精神文明相协调的现代化，是人与自然和谐共生的现代化，是走和平发展道路的现代化。","e":"五个特色：人口规模巨大、共同富裕、两个文明协调、人与自然和谐共生、和平发展。常与本质要求（九条）对比出题。","lv":1,"freq":"must","obj":["active","develop"],"h":"H10"},{"id":"q_esd_130f7122","m":"esd","t":"short","q":"简述全面建设社会主义现代化国家的战略安排。","a":"总的战略安排是分两步走：①从2020年到2035年基本实现社会主义现代化；②从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。","e":"两步走的时间节点（2035、本世纪中叶）+每步的目标表述。","lv":1,"freq":"must","obj":["active","develop"],"h":"H10"},{"id":"q_esd_d895b82f","m":"esd","t":"short","q":"简述三个务必的内容。","a":"全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必敢于斗争、善于斗争，坚定历史自信，增强历史主动。","e":"三个务必：初心使命、谦虚谨慎艰苦奋斗、敢于斗争善于斗争。二十大报告开宗明义的重大论断。","lv":2,"freq":"high","obj":["active","develop"],"h":"H10"},{"id":"q_esd_fc4d2011","m":"esd","t":"short","q":"简述两个结合的内涵。","a":"坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。只有把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，坚持运用辩证唯物主义和历史唯物主义，才能正确回答时代和实践提出的重大问题。","e":"两个对象：中国具体实际、中华优秀传统文化。这是习近平新时代中国特色社会主义思想的世界观方法论核心。","lv":1,"freq":"must","obj":["active","develop"],"h":"H10"},{"id":"q_esd_bd4999cb","m":"esd","t":"multi","q":"中国式现代化的显著特色包括（）。","o":["人口规模巨大","全体人民共同富裕","物质文明和精神文明相协调","人与自然和谐共生"],"a":[0,1,2,3],"e":"五个特征：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。","lv":1,"freq":"must","obj":["active","develop"],"h":"H10"},{"id":"q_szqh_022d38f8","m":"szqh","t":"short","q":"简述进一步全面深化改革的总目标。","a":"继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。到二〇三五年，全面建成高水平社会主义市场经济体制，中国特色社会主义制度更加完善，基本实现国家治理体系和治理能力现代化，基本实现社会主义现代化，为到本世纪中叶全面建成社会主义现代化强国奠定坚实基础。","e":"总目标两句话；时间节点：2029年完成本决定提出的改革任务（与2035目标衔接）。","lv":1,"freq":"must","obj":["develop"],"h":"H11"},{"id":"q_szqh_847e96eb","m":"szqh","t":"short","q":"简述七个聚焦的内容。","a":"聚焦构建高水平社会主义市场经济体制，聚焦发展全过程人民民主，聚焦建设社会主义文化强国，聚焦提高人民生活品质，聚焦建设美丽中国，聚焦建设更高水平平安中国，聚焦提高党的领导水平和长期执政能力。","e":"七个聚焦分别对应经济、政治、文化、民生、生态、安全、党的领导七大领域，记忆时可按领域归类。","lv":2,"freq":"high","obj":["develop"],"h":"H11"},{"id":"q_szqh_29b26155","m":"szqh","t":"short","q":"进一步全面深化改革必须贯彻哪些重大原则（六个坚持）？","a":"①坚持党的全面领导；②坚持以人民为中心；③坚持守正创新；④坚持以制度建设为主线；⑤坚持全面依法治国；⑥坚持系统观念。","e":"六个坚持。注意与四中全会六个坚持（党的全面领导/人民至上/高质量发展/全面深化改革/有效市场有为政府/统筹发展和安全）区分，两者表述不同。","lv":1,"freq":"must","obj":["develop"],"h":"H11"},{"id":"q_ssqh_98e8baec","m":"ssqh","t":"short","q":"简述二十届四中全会关于十五五时期经济社会发展必须坚持的原则（六个坚持）。","a":"①坚持党的全面领导；②坚持人民至上；③坚持高质量发展；④坚持全面深化改革；⑤坚持有效市场和有为政府相结合；⑥坚持统筹发展和安全。","e":"六个坚持。易与三中全会六个坚持混淆：此处为人民至上、高质量发展、有效市场+有为政府、统筹发展和安全。","lv":1,"freq":"must","obj":["develop"],"h":"H12"},{"id":"q_ssqh_992dfcec","m":"ssqh","t":"short","q":"简述十五五时期经济社会发展的主要目标（要点）。","a":"①高质量发展取得显著成效，科技自立自强水平大幅提高；②进一步全面深化改革取得新突破；③社会文明程度明显提升；④人民生活品质不断提高；⑤美丽中国建设取得新的重大进展；⑥国家安全屏障更加巩固。经济建设方面：经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，达到中等发达国家水平。","e":"六大目标主线：高质量发展、改革开放、文明程度、生活品质、美丽中国、国家安全。加分点：人均GDP达到中等发达国家水平。","lv":2,"freq":"high","obj":["develop"],"h":"H12"},{"id":"q_ssqh_e485fdd2","m":"ssqh","t":"short","q":"简述2035年远景目标的核心表述。","a":"在十五五发展的基础上再奋斗五年，到2035年实现我国经济实力、科技实力、国防实力、综合国力和国际影响力大幅跃升，人均国内生产总值达到中等发达国家水平，人民生活更加幸福美好，基本实现社会主义现代化。","e":"五个实力（经济、科技、国防、综合国力、国际影响力）+人均GDP中等发达国家水平+基本实现社会主义现代化。","lv":2,"freq":"high","obj":["develop"],"h":"H12"},{"id":"q_jjgz_7ab5b978","m":"jjgz","t":"short","q":"简述2025年中央经济工作会议总结的五个必须。","a":"①必须充分挖掘经济潜能；②必须坚持政策支持和改革创新并举；③必须做到既放得活又管得好；④必须坚持投资于物和投资于人紧密结合；⑤必须以苦练内功来应对外部挑战。","e":"五个必须是做好新形势下经济工作的规律性认识，逐条背诵。","lv":3,"freq":"know","obj":["develop"],"h":"H13"},{"id":"q_jjgz_43ac9451","m":"jjgz","t":"short","q":"简述2026年经济工作的八项重点任务（八个坚持）。","a":"①坚持内需主导，建设强大国内市场（居首）；②坚持创新驱动，加紧培育壮大新动能；③坚持改革攻坚，增强高质量发展动力活力；④坚持对外开放，推动多领域合作共赢；⑤坚持协调发展，促进城乡融合和区域联动；⑥坚持双碳引领，推动全面绿色转型；⑦坚持民生为大，努力为人民群众多办实事；⑧坚持守牢底线，积极稳妥化解重点领域风险。","e":"八个坚持主线：内需、创新、改革、开放、协调、双碳、民生、底线。内需主导居首是关键记忆点。","lv":3,"freq":"know","obj":["develop"],"h":"H13"},{"id":"q_jjgz_94c1bda0","m":"jjgz","t":"short","q":"简述2026年经济工作的总体要求和宏观政策取向。","a":"坚持稳中求进工作总基调，完整准确全面贯彻新发展理念，加快构建新发展格局，扎实推动高质量发展。政策取向是稳中求进、提质增效。实施更加积极的财政政策和适度宽松的货币政策。更好统筹发展和安全，更好统筹有效市场和有为政府。2026年是十五五开局之年，要推动经济持续回升向好。","e":"要点：①总基调稳中求进；②政策取向稳中求进、提质增效；③更加积极财政+适度宽松货币；④两个更好统筹。","lv":3,"freq":"know","obj":["develop"],"h":"H13"},{"id":"q_zwgm_2db54ab9","m":"zwgm","t":"short","q":"简述跳出治乱兴衰历史周期率的两个答案。","a":"第一个答案是毛泽东提出的让人民来监督政府（只有让人民来监督政府，政府才不敢松懈）；第二个答案是党的十八大以来给出的不断推进党的自我革命。经过不懈努力，党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案，确保党永远不变质、不变色、不变味。","e":"两个答案的提出者与内容必须对应准确。自我革命是第二个答案。","lv":2,"freq":"high","obj":["active","develop"],"h":"H14"},{"id":"q_zwgm_d47869b2","m":"zwgm","t":"short","q":"简述九个以的实践要求。","a":"①以坚持党中央集中统一领导为根本保证；②以引领伟大社会革命为根本目的；③以新时代中国特色社会主义思想为根本遵循；④以跳出历史周期率为战略目标；⑤以解决大党独有难题为主攻方向；⑥以健全全面从严治党体系为有效途径；⑦以锻造坚强组织、建设过硬队伍为重要着力点；⑧以正风肃纪反腐为重要抓手；⑨以自我监督和人民监督相结合为强大动力。","e":"九个以=九个以X为Y结构：根本保证/根本目的/根本遵循/战略目标/主攻方向/有效途径/重要着力点/重要抓手/强大动力。","lv":2,"freq":"high","obj":["active","develop"],"h":"H14"},{"id":"q_zwgm_57d59eb1","m":"zwgm","t":"short","q":"简述四个自我。","a":"不断增强自我净化、自我完善、自我革新、自我提高的能力，依靠党自身力量发现问题、纠正偏差、推动创新，实现执政能力整体性提升的动态过程。","e":"四个自我：净化、完善、革新、提高。顺序固定。","lv":2,"freq":"high","obj":["active","develop"],"h":"H14"},{"id":"q_jcgn_26c05b1e","m":"jcgn","t":"short","q":"简述两个确立的内涵及其决定性意义。","a":"两个确立：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。决定性意义：对新时代党和国家事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。","e":"两个确立的内容+决定性意义。这是新时代最重要的政治成果。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_8ec7b4f3","m":"jcgn","t":"short","q":"简述四个意识、四个自信、两个维护的具体内容。","a":"四个意识：政治意识、大局意识、核心意识、看齐意识。四个自信：道路自信、理论自信、制度自信、文化自信。两个维护：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。","e":"三组概念必须成套背诵，经常混合出题。","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_jcgn_3d5882de","m":"jcgn","t":"short","q":"简述伟大建党精神。","a":"坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。这是中国共产党的精神之源。","e":"32字四组短语。常考填空与简答，是中国共产党人精神谱系的源头.","lv":2,"freq":"high","obj":["active"],"h":"H15"},{"id":"q_shiwu_96947fa1","m":"shiwu","t":"single","q":"2026年政府工作报告提出的经济增长预期目标是（）。","o":["5%左右","4.5%—5%，在实际工作中努力争取更好结果","5.5%以上","4%左右"],"a":1,"e":"2026年经济增长目标为4.5%—5%，在实际工作中努力争取更好结果。","lv":2,"freq":"high","obj":["develop"],"h":"H16"},{"id":"q_shiwu_161f3387","m":"shiwu","t":"single","q":"2026年3月十四届全国人大四次会议批准的重要文件是（）。","o":["“十四五”规划纲要","“十五五”规划纲要","“十六五”规划建议","2035年远景目标"],"a":1,"e":"十四届全国人大四次会议审查批准了“十五五”规划纲要。","lv":3,"freq":"know","obj":["develop"],"h":"H16"},{"id":"q_shiwu_3d482743","m":"shiwu","t":"single","q":"《国家发展规划法》自（）起施行。","o":["2026年7月1日","2026年8月15日","公布之日","2027年1月1日"],"a":2,"e":"国家发展规划法自公布之日起施行。","lv":3,"freq":"know","obj":["develop"],"h":"H16"},{"id":"q_shiwu_3aa79114","m":"shiwu","t":"judge","q":"2026年是我国“十五五”开局之年。","a":true,"e":"2026年是“十五五”开局之年，也是中国共产党成立105周年。","lv":3,"freq":"know","obj":["develop"],"h":"H16"},{"id":"q_shiwu_7c52a0d9","m":"shiwu","t":"judge","q":"《生态环境法典》自2026年7月1日起施行。","a":false,"e":"生态环境法典自2026年8月15日起施行；民族团结进步促进法自2026年7月1日起施行。","lv":3,"freq":"know","obj":["devel fill","q":"党的二十届五中全会提出，开展树立和践行____学习教育。","a":["正确政绩观"],"e":"五中全会部署开展树立和践行正确政绩观学习教育。“为民造福是最大政绩”是这一学习教育的核心命题，可与《榜样10》中罗胤、田野的为民事迹联合命题。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"q_fzqh_07","m":"fzqh","t":"multi","q":"党在百年奋斗中找到的跳出治乱兴衰历史周期率的“两个答案”是（）。","o":["让人民来监督政府","自我革命","全面从严治党","民主集中制"],"a":[0,1],"e":"“两个答案”：第一个是毛泽东在延安“窑洞对”中给出的“让人民来监督政府”；第二个是经过百年奋斗特别是新时代实践给出的“自我革命”。五中全会重申并升华了这一表述。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_fzqh_08","m":"fzqh","t":"single","q":"“让人民来监督政府”这一答案，出自毛泽东与黄炎培的（）。","o":["延安“窑洞对”","西柏坡“赶考”","遵义会议","党的七大"],"a":0,"e":"1945年毛泽东在延安与黄炎培谈话，回答如何跳出“其兴也勃焉、其亡也忽焉”的历史周期率，提出“让人民来监督政府”，史称“窑洞对”，即第一个答案。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"q_fzqh_09","m":"fzqh","t":"single","q":"党找到的跳出历史周期率的第二个答案是（）。","o":["自我革命","发展经济","依法治国","统一战线"],"a":0,"e":"第二个答案是自我革命，是经过百年奋斗特别是新时代实践给出的。习近平总书记指出，勇于自我革命是中国共产党区别于其他政党的显著标志。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_fzqh_10","m":"fzqh","t":"judge","q":"党的二十届五中全会的主题是持之以恒推进全面从严治党、健全全面从严治党体系。","a":true,"e":"五中全会主题聚焦全面从严治党，全会审议通过的《决定》以持之以恒推进全面从严治党为总题目，健全全面从严治党体系是贯穿其中的中心线索。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_fzqh_11","m":"fzqh","t":"multi","q":"关于党的建设“伟大工程”表述的演进，下列说法正确的有（）。","o":["“伟大的工程”由毛泽东1939年在《〈共产党人〉发刊词》中提出","“党的建设新的伟大工程”由党的十四届四中全会首次提出","“新时代党的建设新的伟大工程”是党的十八大以来深入推进的","“新时代党的建设新的伟大工程”由党的十七大首次提出"],"a":[0,1,2],"e":"演进链条：毛泽东1939年《〈共产党人〉发刊词》提出“伟大的工程”→党的十四届四中全会首提、党的十五大系统阐述“党的建设新的伟大工程”→党的十八大以来深入推进“新时代党的建设新的伟大工程”。十七大首次提出之说错误。","lv":3,"freq":"know","obj":["develop","active"]},{"id":"q_fzqh_12","m":"fzqh","t":"single","q":"“两个永远在路上”指的是（）。","o":["全面从严治党永远在路上，党的自我革命永远在路上","改革开放永远在路上，乡村振兴永远在路上","作风建设永远在路上，反腐败永远在路上","理论创新永远在路上，制度建设永远在路上"],"a":0,"e":"“两个永远在路上”：全面从严治党永远在路上，党的自我革命永远在路上。这是新时代管党治党的重要论断，与“两个答案”配套记忆。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"q_fzqh_13","m":"fzqh","t":"judge","q":"习近平总书记指出，反腐败是最彻底的自我革命。","a":true,"e":"反腐败是最彻底的自我革命，这是习近平总书记关于党的自我革命重要思想的重要内容。实践中坚持一体推进不敢腐、不能腐、不想腐。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"q_fzqh_14","m":"fzqh","t":"single","q":"新时代反腐败斗争坚持一体推进“三不腐”，即（）。","o":["不敢腐、不能腐、不想腐","不愿腐、不敢腐、不必腐","不敢腐、不能腐、不准腐","不想腐、不易腐、不姑息"],"a":0,"e":"一体推进不敢腐、不能腐、不想腐，是反腐败斗争的基本方针和新时代全面从严治党的重要方略，三者相互依存、相互促进。","lv":3,"freq":"know","obj":["develop","active"]},{"id":"q_fzqh_15","m":"fzqh","t":"short","q":"简述党的二十届五中全会的主要成果与重要判断。","a":"2026年10月26日至29日在北京召开，听取和讨论习近平受中央政治局委托所作的工作报告，审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》；作出“十四五”圆满收官、“十五五”开局良好的重要判断；隆重庆祝中国共产党成立105周年，部署开展树立和践行正确政绩观学习教育；重申“让人民来监督政府”和“自我革命”两个答案。","e":"答题四要素：时间地点、通过文件、重要判断、庆祝与学习教育部署；再补“两个答案”与全面从严治党主题即可拿满。注意文件名称不能写成“十五五规划建议”。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_fzqh_16","m":"fzqh","t":"single","q":"党的二十届五中全会听取和讨论了（）受中央政治局委托所作的工作报告。","o":["习近平","中央书记处","中央纪律检查委员会","国务院"],"a":0,"e":"全会听取和讨论了习近平受中央政治局委托所作的工作报告，这是历次中央全会的标准表述，报告人不是中央书记处、中央纪委或国务院。","lv":3,"freq":"know","obj":["develop","active"]},{"id":"q_fzqh_17","m":"fzqh","t":"fill","q":"党在革命、建设、改革中先后把党的建设作为“____”“新的伟大工程”。","a":["伟大的工程"],"e":"党的建设伟大工程的表述链条为“伟大的工程”（毛泽东1939年提出）、“党的建设新的伟大工程”（十四届四中全会首提）、“新时代党的建设新的伟大工程”。","lv":3,"freq":"know","obj":["develop","active"]},{"id":"q_fzqh_18","m":"fzqh","t":"multi","q":"关于党的二十届五中全会及其《决定》，下列说法正确的有（）。","o":["主题聚焦持之以恒推进全面从严治党","健全全面从严治党体系是《决定》的中心线索","全会提出开展树立和践行正确政绩观学习教育","《决定》提出到2029年完成本决定提出的改革任务"],"a":[0,1,2],"e":"前三项均出自五中全会公报。“到2029年新中国成立80周年时完成本决定提出的改革任务”是二十届三中全会《决定》的目标，属于张冠李戴的常见干扰项。","lv":2,"freq":"high","obj":["develop","active"]},{"id":"q_czjx_01","m":"czjx","t":"single","q":"中央红军开始长征（战略转移）的时间是（）。","o":["1933年10月","1934年10月","1935年1月","1936年10月"],"a":1,"e":"1934年10月，中央红军开始战略转移，踏上长征路。1935年1月是遵义会议，1936年10月是三大主力会师、长征胜利结束。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_02","m":"czjx","t":"single","q":"1935年1月召开的（），是党的历史上一个生死攸关的转折点。","o":["遵义会议","古田会议","八七会议","瓦窑堡会议"],"a":0,"e":"遵义会议于1935年1月召开，事实上确立了毛泽东同志在党中央和红军的领导地位，是党的历史上一个生死攸关的转折点，标志着党在政治上开始走向成熟。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_03","m":"czjx","t":"judge","q":"遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位。","a":true,"e":"遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位，开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位。注意表述是“事实上确立”，不是“正式选举产生”。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_04","m":"czjx","t":"single","q":"1936年10月，红军三大主力会师、长征胜利结束的地点是（）。","o":["甘肃会宁和将台堡","陕西吴起镇","贵州遵义","江西瑞金"],"a":0,"e":"1936年10月，红一、红二、红四方面军在甘肃会宁和将台堡会师，标志着长征胜利结束。吴起镇是1935年10月中央红军到达陕北的落脚点，不是三大主力会师地。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_05","m":"czjx","t":"fill","q":"红军长征途经____个省。","a":["11","十一"],"e":"长征途经11个省，翻越18座大山，跨过24条大河。三个数字常一起考，注意不要记成“18省、11座大山”。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_06","m":"czjx","t":"fill","q":"红军长征翻越18座大山，跨过____条大河。","a":["24","二十四"],"e":"长征翻越18座大山、跨过24条大河、途经11个省。常说“万水千山”，具体数字以11省、18山、24河为准。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_07","m":"czjx","t":"single","q":"湘江战役后，中央红军由8万余人锐减至（）。","o":["2万余人","3万余人","5万余人","6万余人"],"a":1,"e":"湘江战役是1934年底长征初期最惨烈的一役，红军由8万余人锐减至3万余人。这一惨重代价使党内对“左”倾错误的怀疑和不满达到顶点。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_08","m":"czjx","t":"single","q":"湘江战役的重大历史影响是（）。","o":["直接促成了遵义会议的召开","宣告长征胜利结束","确立了毛泽东思想为党的指导思想","促成了西安事变的和平解决"],"a":0,"e":"湘江战役后，党内对“左”倾错误的怀疑和不满达到顶点，直接促成了1935年1月遵义会议的召开。这是“湘江战役→遵义会议”的因果链，电影《血战湘江》党课常考。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_09","m":"czjx","t":"single","q":"《七律·长征》中“大渡桥横铁索寒”写的是（）。","o":["飞夺泸定桥","巧渡金沙江","四渡赤水","攻克腊子口"],"a":0,"e":"“大渡桥横铁索寒”指飞夺泸定桥：红军22名突击队员冒着火力攀铁索夺桥。“铁索寒”既是实景，也写出战斗的惊险。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_10","m":"czjx","t":"single","q":"《七律·长征》中“金沙水拍云崖暖”写的是（）。","o":["巧渡金沙江","飞夺泸定桥","强渡大渡河","翻越夹金山"],"a":0,"e":"“金沙水拍云崖暖”指巧渡金沙江：红军巧渡成功跳出敌军包围圈，故着一“暖”字；“大渡桥横铁索寒”指飞夺泸定桥，一暖一寒形成对照。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_11","m":"czjx","t":"multi","q":"下列属于伟大长征精神内涵的有（）。","o":["把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念","为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲","坚持独立自主、实事求是，一切从实际出发","敢闯敢试、敢为人先，勇于突破一切陈规"],"a":[0,1,2],"e":"伟大长征精神五条内涵：①坚定理想信念、坚信正义事业必胜；②不怕艰难险阻、不惜付出一切牺牲；③坚持独立自主、实事求是；④顾全大局、严守纪律、紧密团结；⑤依靠群众、同群众生死相依、艰苦奋斗。“敢闯敢试”不属于长征精神原文表述。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_12","m":"czjx","t":"single","q":"长征精神“五关”中的“求是关”，对应五条内涵的第（）条。","o":["第1条","第2条","第3条","第4条"],"a":2,"e":"五关对应关系：信念关←第1条（理想信念）；求是关←第3条（独立自主、实事求是）；团结关←第4条（顾全大局、紧密团结）；为民关←第5条（依靠群众）；奋斗关←第2条（不怕牺牲、艰苦奋斗）。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_13","m":"czjx","t":"single","q":"长征精神“五关”中的“为民关”，对应五条内涵的第（）条。","o":["第2条","第3条","第4条","第5条"],"a":3,"e":"为民关对应第5条“紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗”。记法：为民在最后一条，团结在其前一条。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_14","m":"czjx","t":"judge","q":"长征精神“五关”中的“奋斗关”，对应“不怕任何艰难险阻、不惜付出一切牺牲”的精神。","a":true,"e":"奋斗关对应第2条“为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神”。五关顺序为信念、求是、团结、为民、奋斗，而内涵顺序中“不怕牺牲”是第2条，二者不是一一对齐的，需特别记忆。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"q_czjx_15","m":"czjx","t":"fill","q":"习近平总书记指出：“每一代人有每一代人的____，每一代人都要走好自己的____。”","a":["长征路"],"e":"“每一代人有每一代人的长征路，每一代人都要走好自己的长征路。”这是长征精神当代价值的核心表述，论述题结尾可直接引用。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_16","m":"czjx","t":"short","q":"简述伟大长征精神的五个方面内涵。","a":"①把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利；②为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲；③坚持独立自主、实事求是，一切从实际出发；④顾全大局、严守纪律、紧密团结；⑤紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。","e":"出自习近平2016年10月21日在纪念红军长征胜利80周年大会上的讲话。按“信念—牺牲—求是—团结—为民”五个关键词记忆，答题时每条先写关键词再展开。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_czjx_17","m":"czjx","t":"single","q":"系统概括伟大长征精神五个方面内涵的讲话，出自（）。","o":["2016年10月21日纪念红军长征胜利80周年大会","2016年7月1日庆祝中国共产党成立95周年大会","2021年7月1日庆祝中国共产党成立100周年大会","2016年10月纪念孙中山先生诞辰150周年大会"],"a":0,"e":"2016年10月21日，习近平总书记在纪念红军长征胜利80周年大会上系统概括了伟大长征精神五个方面的内涵，并指出长征精神是中国共产党人和红军将士用生命和热血铸就的。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_czjx_18","m":"czjx","t":"multi","q":"关于红军长征的史实，下列说法正确的有（）。","o":["1934年10月中央红军开始战略转移","遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位","1936年10月红一、红二、红四方面军在甘肃会宁和将台堡会师","长征途经18个省，翻越11座大山"],"a":[0,1,2],"e":"前三项均正确。第四项把数字记反了：长征途经11个省、翻越18座大山、跨过24条大河。数字题最容易在“省/山/河”之间错位。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_by10_01","m":"by10","t":"single","q":"《榜样10》专题节目由（）联合制作。","o":["中央组织部、中央广播电视总台","中央宣传部、新华社","中央纪委国家监委、人民日报社","中央统战部、光明日报社"],"a":0,"e":"《榜样10》由中央组织部、中央广播电视总台联合制作，是《榜样》系列节目的第十部，属于党员教育的权威教材。","lv":1,"freq":"must","obj":["active"]},{"id":"q_by10_02","m":"by10","t":"single","q":"《榜样10》首播的时间和平台是（）。","o":["2026年1月20日 CCTV-1晚8点档","2026年1月20日 CCTV-13","2025年12月20日 CCTV-1","2026年7月1日 CCTV-1"],"a":0,"e":"《榜样10》于2026年1月20日在CCTV-1晚8点档首播。首播时间与平台常作为时政细节题出现，注意不是2025年、也不是“七·一”播出。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_03","m":"by10","t":"judge","q":"《榜样10》集中展现了5名党员和2个党支部的先进事迹。","a":true,"e":"《榜样10》集中展现5名党员和2个党支部忠实践行党的创新理论的突出事迹，通过典型事迹展示、现场访谈互动、重温入党志愿书等形式呈现。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_04","m":"by10","t":"fill","q":"《榜样10》通过典型事迹展示、现场访谈互动、____等形式展现先进典型。","a":["重温入党志愿书"],"e":"“重温入党志愿书”是《榜样10》的重要节目形式，直接扣住“初心”主题，也是入党考试论述题最容易借力的情感落点。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_05","m":"by10","t":"single","q":"《榜样10》中被称为“麦田守望者”、育成“矮抗58”等小麦品种的是（）。","o":["茹振钢","梁建英","冷晓琨","田野"],"a":0,"e":"茹振钢是河南科技学院教授、小麦育种专家，四十余载深耕小麦育种，育成“矮抗58”等品种，践行“把论文写在田野上”，守护国家粮食安全。","lv":1,"freq":"must","obj":["active"]},{"id":"q_by10_06","m":"by10","t":"single","q":"茹振钢育成的小麦品种推广面积超过（）。","o":["4千万亩","1亿亩","4亿亩","10亿亩"],"a":2,"e":"茹振钢育成的“矮抗58”等品种推广面积超过4亿亩。数字是这类人物题的高频考点，注意“4亿亩”不是“4千万亩”。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_07","m":"by10","t":"single","q":"《榜样10》中带队攻克空气动力学、噪声控制等世界级难题的高铁研发专家是（）。","o":["梁建英","茹振钢","罗胤","冷晓琨"],"a":0,"e":"梁建英是中车四方高铁研发专家，面对国外技术封锁，带队攻克空气动力学、噪声控制等世界级难题，推动中国高铁从“跟跑”“并跑”到“领跑”。","lv":1,"freq":"must","obj":["active"]},{"id":"q_by10_08","m":"by10","t":"single","q":"《榜样10》中从零起步投身人形机器人前沿、致力突破“卡脖子”关键核心技术的青年科技工作者是（）。","o":["冷晓琨","梁建英","田野","茹振钢"],"a":0,"e":"冷晓琨是人形机器人领域的青年科技工作者，从零起步投身前沿研究，致力突破“卡脖子”关键核心技术，体现青年科技工作者的担当。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_09","m":"by10","t":"single","q":"《榜样10》中扎根贵州纳雍县推动乡村振兴的基层干部是（）。","o":["田野","罗胤","冷晓琨","梁建英"],"a":0,"e":"田野是基层干部，扎根贵州纳雍县推动乡村振兴，把群众急难愁盼放在心上，是“为民造福是最大政绩”的生动注脚。","lv":3,"freq":"know","obj":["active"]},{"id":"q_by10_10","m":"by10","t":"single","q":"《榜样10》中的罗胤，其身份和事迹是（）。","o":["北京市东城区司法局副局长，20余年中15年扎根基层司法所","贵州省纳雍县驻村第一书记，推动乡村振兴","中车四方高铁研发专家，攻克噪声控制难题","河南科技学院教授，从事小麦育种"],"a":0,"e":"罗胤任北京市东城区司法局副局长，20余年工作经历中15年扎根基层司法所，用法律的温情守护群众，获“全国人民满意的公务员”等称号。注意“20余年”与“15年”不可混为一谈。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_11","m":"by10","t":"single","q":"《榜样10》中义乌市天盟实业投资有限公司党支部，是（）运营企业的党组织。","o":["“义新欧”班列","中欧班列（成都）","西部陆海新通道","远洋集装箱航运"],"a":0,"e":"义乌市天盟实业投资有限公司党支部是“义新欧”班列运营企业的党组织，践行“一带一路”倡议，发挥战斗堡垒作用。","lv":3,"freq":"know","obj":["active"]},{"id":"q_by10_12","m":"by10","t":"multi","q":"下列属于《榜样10》所展现先进典型的有（）。","o":["茹振钢","梁建英","罗胤","黄文秀"],"a":[0,1,2],"e":"《榜样10》展现的是茹振钢、梁建英、冷晓琨、田野、罗胤5名党员和义乌天盟党支部、空军95944部队60分队党支部2个党支部。黄文秀是“时代楷模”，不属于《榜样10》人物。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_13","m":"by10","t":"judge","q":"罗胤20余年的工作经历全部在基层司法所度过。","a":false,"e":"罗胤20余年工作经历中15年扎根基层司法所，并非全部。这一“20余年/15年”的细节最容易在判断题中被改写，需精确记忆。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_14","m":"by10","t":"short","q":"结合《榜样10》中的典型事迹，谈谈榜样精神对入党积极分子的启示。","a":"榜样们岗位不同，但共同点是坚守初心、攻坚克难、创先争优、无私奉献，是伟大建党精神在新时代的具体化身，彰显基层党组织战斗堡垒作用和党员先锋模范作用。如茹振钢四十余载深耕小麦育种、守护国家粮食安全，梁建英攻克高铁世界级难题、推动科技自立自强。作为入党积极分子，应把个人理想融入国家发展大局，在学业、志愿服务和社会实践中向榜样看齐，把榜样精神内化于心、外化于行。","e":"论述题三段式：①总起——概括共同精神特质并点出伟大建党精神、战斗堡垒与先锋模范作用；②展开——选1至2位人物具体谈，最稳妥是茹振钢（粮食安全）+梁建英（科技自立自强），再补“重温入党志愿书”的初心触动；③落到自身——结合学生身份谈学业、志愿服务与思想入党。","lv":2,"freq":"high","obj":["active"]},{"id":"q_by10_15","m":"by10","t":"multi","q":"关于《榜样10》专题节目，下列说法正确的有（）。","o":["由中央组织部、中央广播电视总台联合制作","2026年1月20日在CCTV-1首播","共展现5名党员和2个党支部","只展现军队系统的先进典型"],"a":[0,1,2],"e":"前三项正确。《榜样10》展现对象涵盖高校科研人员、企业研发专家、基层干部、司法行政干部、基层党组织和军队基层党组织，并非只展现军队系统。","lv":2,"freq":"high","obj":["active"]},{"id":"q_zzjs_01","m":"zzjs","t":"single","q":"下列关于党的最高领导机关的说法，正确的是（）。","o":["中央政治局及其常务委员会","中央委员会总书记","党的全国代表大会和它所产生的中央委员会","中央书记处"],"a":2,"e":"党章规定，党的最高领导机关是党的全国代表大会和它所产生的中央委员会。中央政治局、中央书记处是中央委员会的常设与办事机构，不是最高领导机关。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_02","m":"zzjs","t":"single","q":"党的根本组织原则是（）。","o":["民主集中制","集体领导制","个人分工负责制","少数服从多数"],"a":0,"e":"民主集中制是党的根本组织原则，是民主基础上的集中和集中指导下的民主相结合。“少数服从多数”只是“四个服从”之一，不能等同于根本组织原则。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_03","m":"zzjs","t":"multi","q":"下列属于党的组织生活形式的有（）。","o":["三会一课","主题党日","民主评议党员","经济形势分析会"],"a":[0,1,2],"e":"党的组织生活是党内政治生活的重要内容，形式包括“三会一课”、主题党日、组织生活会、民主评议党员、谈心谈话等。“经济形势分析会”属于业务工作会议，不是党的组织生活形式。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_04","m":"zzjs","t":"single","q":"民主集中制的准确含义是（）。","o":["民主基础上的集中和集中指导下的民主相结合","先民主、后集中的两阶段工作方法","集中指导下的民主，民主基础上的集中","充分发扬民主，最后由领导拍板"],"a":0,"e":"民主集中制是民主基础上的集中和集中指导下的民主相结合，是党的根本组织原则，也是群众路线在党的生活中的运用。它是一项制度，不是简单的“先民主后集中”工作方法。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_zzjs_05","m":"zzjs","t":"single","q":"凡是有正式党员（）以上的基层单位，应当成立党的基层组织。","o":["2人","3人","5人","7人"],"a":1,"e":"党章规定，凡是有正式党员3人以上的基层单位，都应当成立党的基层组织。注意是“正式党员”，预备党员不计入。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_06","m":"zzjs","t":"fill","q":"党的基层组织是党在社会基层组织中的____，是党的全部工作和战斗力的基础。","a":["战斗堡垒"],"e":"党的基层组织是党在社会基层组织中的战斗堡垒，是党的全部工作和战斗力的基础。这一定位常与“3人以上应当成立”合并出题。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_07","m":"zzjs","t":"single","q":"下列不属于“三会一课”内容的是（）。","o":["支部党员大会","支部委员会会议","党小组会","民主生活会"],"a":3,"e":"“三会一课”指支部党员大会、支部委员会会议、党小组会和按时上好党课。民主生活会是县以上党和国家机关党员领导干部的党内政治生活形式，不属于“三会一课”。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_zzjs_08","m":"zzjs","t":"judge","q":"“三会一课”中的“一课”指按时上好党课。","a":true,"e":"“三会一课”：支部党员大会、支部委员会会议、党小组会，按时上好党课。“一课”即党课，是党员教育的基本形式，不能漏掉“按时”二字。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_zzjs_09","m":"zzjs","t":"judge","q":"党员领导干部只需参加党委（党组）的组织生活，不必参加所在党支部或党小组的组织生活。","a":false,"e":"党员领导干部既要参加党委（党组）的组织生活，还应当参加所在党支部或者党小组的组织生活，这就是“双重组织生活”，任何党员都不能有例外。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_zzjs_10","m":"zzjs","t":"multi","q":"党的三大优良作风包括（）。","o":["理论联系实际","密切联系群众","批评和自我批评","艰苦奋斗"],"a":[0,1,2],"e":"三大优良作风由党的七大概括：理论联系实际、密切联系群众、批评和自我批评。艰苦奋斗是党的优良传统，但不在“三大作风”之列。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_11","m":"zzjs","t":"single","q":"党的三大优良作风是由党的（）概括的。","o":["七大","八大","十一届三中全会","十四大"],"a":0,"e":"1945年党的七大总结概括了理论联系实际、密切联系群众、批评和自我批评三大优良作风，与“三大法宝”（统一战线、武装斗争、党的建设）同为七大的重要理论贡献。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_zzjs_12","m":"zzjs","t":"single","q":"作为新时代改进作风的切入口和动员令，中央八项规定出台的时间是（）。","o":["2013年12月","2012年12月","2014年10月","2017年10月"],"a":1,"e":"中央八项规定于2012年12月出台，是新时代改进作风的切入口和动员令。2025年开展了深入贯彻中央八项规定精神学习教育。注意与2023年12月修订《纪律处分条例》区分。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_13","m":"zzjs","t":"single","q":"党的六大纪律中，最重要、最根本、最关键的纪律是（）。","o":["政治纪律","组织纪律","廉洁纪律","工作纪律"],"a":0,"e":"政治纪律是最重要、最根本、最关键的纪律，遵守政治纪律是遵守党的全部纪律的重要基础。它是维护党的团结统一的根本保证。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_14","m":"zzjs","t":"single","q":"下列不属于党的纪律处分种类的是（）。","o":["警告","记过","留党察看","开除党籍"],"a":1,"e":"党的纪律处分五种：警告、严重警告、撤销党内职务、留党察看、开除党籍。“记过”是行政机关公务员处分种类，不是党纪处分，属于典型混淆项。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_zzjs_15","m":"zzjs","t":"single","q":"留党察看的最长期限是（）。","o":["一年","一年半","二年","三年"],"a":2,"e":"留党察看期限一般为一年，最长不超过二年。留党察看期间没有表决权、选举权和被选举权；确已改正错误的恢复党员权利，坚持不改的应当开除党籍。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_16","m":"zzjs","t":"single","q":"对党员的纪律处分，必须经过（）讨论决定，报党的基层委员会批准。","o":["支部大会","支部委员会","党小组会","上级党委常委会"],"a":0,"e":"对党员的纪律处分，必须经过支部大会讨论决定，报党的基层委员会批准。注意是“支部大会”而非“支部委员会”，后者只是党支部的日常工作机构。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_17","m":"zzjs","t":"fill","q":"党的纪律处分五种：警告、严重警告、撤销党内职务、____、开除党籍。","a":["留党察看"],"e":"五种处分由轻到重：警告、严重警告、撤销党内职务、留党察看、开除党籍。开除党籍是最重处分，五年内不得重新入党。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_18","m":"zzjs","t":"short","q":"简述民主集中制“四个服从”的内容。","a":"党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。","e":"四个服从由小到大递进：个人→组织、少数→多数、下级→上级、全党→全国代表大会和中央委员会。核心是全党服从中央，这是党的最高政治原则和根本政治规矩。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_zzjs_19","m":"zzjs","t":"single","q":"党的组织体系包括（）。","o":["党的中央组织、党的地方组织、党的基层组织","党的中央组织、党的基层组织、党的小组","党的全国代表大会、中央委员会、中央政治局","党的领导机关、派出机关、基层组织"],"a":0,"e":"党的组织体系分为党的中央组织、党的地方组织、党的基层组织三级。基层组织是党在社会基层组织中的战斗堡垒，是党的全部工作和战斗力的基础。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_xd6_01","m":"xd6","t":"single","q":"经党中央批准、公开使用的“六大思想”中，提出时间最早的是（）。","o":["习近平经济思想","习近平生态文明思想","习近平强军思想","习近平外交思想"],"a":2,"e":"六大思想按时间排序为强军思想（2017）、经济思想（2017.12）、生态文明思想（2018.5）、外交思想（2018.6）、法治思想（2020.11）、文化思想（2023.10）。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_xd6_02","m":"xd6","t":"single","q":"习近平经济思想首次明确是在（）。","o":["2017年10月党的十九大","2018年5月全国生态环境保护大会","2017年12月中央经济工作会议","2020年11月中央全面依法治国工作会议"],"a":2,"e":"2017年12月中央经济工作会议首次明确习近平经济思想，其核心要义包括新发展理念、新发展格局、高质量发展等。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_xd6_03","m":"xd6","t":"single","q":"习近平生态文明思想正式提出于（）。","o":["2018年5月全国生态环境保护大会","2018年6月中央外事工作会议","2017年12月中央经济工作会议","2019年10月党的十九届四中全会"],"a":0,"e":"2018年5月全国生态环境保护大会正式提出习近平生态文明思想，强调绿水青山就是金山银山、人与自然和谐共生。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_xd6_04","m":"xd6","t":"single","q":"习近平外交思想正式提出于（）。","o":["2018年6月中央外事工作会议","2018年5月全国生态环境保护大会","2017年12月中央经济工作会议","2020年11月中央全面依法治国工作会议"],"a":0,"e":"2018年6月中央外事工作会议正式提出习近平外交思想，核心是推动构建人类命运共同体，形成“十个坚持”。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_xd6_05","m":"xd6","t":"single","q":"习近平法治思想正式提出于（）。","o":["2018年6月中央外事工作会议","2020年11月中央全面依法治国工作会议","2021年11月党的十九届六中全会","2022年10月党的二十大"],"a":1,"e":"2020年11月中央全面依法治国工作会议正式提出习近平法治思想，核心要义概括为“十一个坚持”。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_xd6_06","m":"xd6","t":"single","q":"习近平文化思想正式提出并系统阐述是在（）。","o":["2021年7月庆祝中国共产党成立100周年大会","2022年10月党的二十大","2023年10月全国宣传思想文化工作会议","2024年7月党的二十届三中全会"],"a":2,"e":"2023年10月全国宣传思想文化工作会议正式提出并系统阐述习近平文化思想，其鲜明特质是“明体达用、体用贯通”。","lv":1,"freq":"must","obj":["develop","active"]},{"id":"q_xd6_07","m":"xd6","t":"multi","q":"下列属于经党中央批准公开使用的“六大思想”的有（）。","o":["习近平强军思想","习近平经济思想","习近平生态文明思想","习近平外交思想","习近平关于党的建设的重要思想","习近平文 ）。","o":["经常开展批评和自我批评、约谈函询，让“红红脸、出出汗”成为常态","党纪轻处分、组织调整成为违纪处理的大多数","党纪重处分、重大职务调整的成为少数","严重违纪涉嫌违法立案审查的成为极少数"],"a":[0,1,2,3],"e":"四种形态由“常态、大多数、少数、极少数”构成，体现抓早抓小、防微杜渐，第一种形态是基础。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_jjjc_03","m":"jjjc","t":"single","q":"留党察看处分分为（）。","o":["留党察看一年、留党察看二年","留党察看半年、留党察看一年","留党察看一年、留党察看三年","留党察看二年、留党察看三年"],"a":0,"e":"留党察看处分分为留党察看一年、留党察看二年，最长不超过二年，期间没有表决权、选举权和被选举权。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_jjjc_04","m":"jjjc","t":"judge","q":"党员受到留党察看处分，其党内职务自然撤销。","a":true,"e":"《纪律处分条例》规定，党员受到留党察看处分，其党内职务自然撤销，期满后符合条件才恢复党员权利。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_jjjc_05","m":"jjjc","t":"single","q":"对于严重违犯党纪、本身又不能纠正的党组织领导机构，应当（）。","o":["予以改组","予以解散","责令作出检查","通报批评"],"a":0,"e":"条例规定：严重违犯党纪、本身又不能纠正的党组织领导机构予以改组；全体或多数党员严重违犯党纪的党组织予以解散。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_jjjc_06","m":"jjjc","t":"judge","q":"通报批评属于党的纪律处分种类之一。","a":false,"e":"党的纪律处分只有警告、严重警告、撤销党内职务、留党察看、开除党籍五种，通报批评不是纪律处分。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_jjjc_07","m":"jjjc","t":"single","q":"党的五种纪律处分中，重于严重警告、轻于留党察看的是（）。","o":["警告","撤销党内职务","开除党籍","降级"],"a":1,"e":"五种处分由轻到重为警告、严重警告、撤销党内职务、留党察看、开除党籍，撤销党内职务居于中间。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_jjjc_08","m":"jjjc","t":"judge","q":"对党员的纪律处分，必须经过支部大会讨论决定，报党的基层委员会批准。","a":true,"e":"党章规定，对党员的纪律处分必须经支部大会讨论决定，报党的基层委员会批准；重要或复杂案件还应报相应纪委审查。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_jjjc_09","m":"jjjc","t":"single","q":"党员在留党察看期间确有悔改表现，期满后应当（）。","o":["自动转为正式党员","重新办理入党手续","恢复其党员权利","由本人申请重新入党"],"a":2,"e":"留党察看期满，确有悔改表现的，按期恢复其党员权利；坚持不改或又发现违纪的，应当开除党籍。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"q_jjjc_10","m":"jjjc","t":"fill","q":"党的六大纪律是政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律和____。","a":["生活纪律"],"e":"六大纪律为政治、组织、廉洁、群众、工作、生活纪律，其中政治纪律是最重要、最根本、最关键的纪律。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"q_jjjc_11","m":"jjjc","t":"fill","q":"党的纪律处分有五种：警告、严重警告、撤销党内职务、留党察看和____。","a":["开除党籍"],"e":"五种处分由轻到重依次为警告、严重警告、撤销党内职务、留党察看、开除党籍，开除党籍是党内最高处分。","lv":1,"freq":"must","obj":["active","develop"]}],"cards":[{"id":"c_jjjc_750991df","m":"jjjc","f":"党的六大纪律有哪些？","b":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_b792497b","m":"jjjc","f":"《纪律处分条例》最新版本何时施行？","b":"2023年12月印发新修订的《条例》，自2024年1月1日起施行。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_f0a8e8ea","m":"jjjc","f":"对党员的纪律处分有哪五种？","b":"警告、严重警告、撤销党内职务、留党察看、开除党籍。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_d820715f","m":"jjjc","f":"留党察看期限多长？","b":"一般为一年，最长不超过两年；期间没有表决权、选举权和被选举权。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jjjc_3504bb43","m":"jjjc","f":"开除党籍有什么后果？","b":"最重处分；五年内不得重新入党，也不得推荐担任相当或更高党外职务。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jjjc_7278502f","m":"jjjc","f":"党内法规有哪七种名称？","b":"党章、准则、条例、规定、办法、规则、细则。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jjjc_c649eda0","m":"jjjc","f":"党内法规体系“1+4”布局指什么？","b":"以党章为根本，包括党的组织法规、党的领导法规、党的自身建设法规、党的监督保障法规四个板块。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_e4e13117","m":"jjjc","f":"政治纪律处于什么地位？","b":"党最根本、最重要的纪律，是维护党的团结统一的根本保证。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_68aafa4c","m":"jjjc","f":"党章在党内法规体系中地位如何？","b":"最根本的党内法规，是制定其他党内法规的基础和依据，是管党治党的总规矩。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_jjjc_8b682b63","m":"jjjc","f":"党的纪律处分应坚持哪些原则？","b":"党要管党从严治党、党纪面前一律平等、实事求是、民主集中制、惩前毖后治病救人。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jjjc_e9f73b15","m":"jjjc","f":"对党组织的纪律处分有哪些？","b":"改组、解散。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_jjjc_f0899d7e","m":"jjjc","f":"党内法规的定义是什么？","b":"党的中央组织等制定的、体现党的统一意志、规范党的领导和党的建设活动、依靠党的纪律保证实施的专门规章制度。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_jjjc_fab05435","m":"jjjc","f":"依规治党要求形成什么样的体系？","b":"覆盖党的领导和党的建设各方面的党内法规制度体系，实现制度治党、依规治党。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_jjjc_c5b073d1","m":"jjjc","f":"哪两项是党内政治生活与党内监督的重要法规？","b":"《关于新形势下党内政治生活的若干准则》《中国共产党党内监督条例》。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dz_2d2ab3b9","m":"dz","f":"党的性质是什么？（两个先锋队）","b":"中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，是中国特色社会主义事业的领导核心，代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_d3e6cd90","m":"dz","f":"党的行动指南（指导思想）是什么？","b":"马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_5927bc32","m":"dz","f":"党的最高理想和最终目标？","b":"实现共产主义。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_9af18bc9","m":"dz","f":"党的初心使命？","b":"为中国人民谋幸福，为中华民族谋复兴。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_2618a080","m":"dz","f":"申请入党的基本条件？","b":"年满十八岁的中国工人、农民、军人、知识分子和其他社会阶层的先进分子，承认党的纲领和章程，愿意参加党的一个组织并在其中积极工作、执行党的决议和按期交纳党费。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_df190b3d","m":"dz","f":"预备党员的预备期多长？从何时算起？","b":"预备期一年，从支部大会通过他为预备党员之日算起。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_7414fe6d","m":"dz","f":"预备党员与正式党员在权利义务上的区别？","b":"义务完全相同；权利上预备党员没有表决权、选举权和被选举权，其他权利相同。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_bf943ddf","m":"dz","f":"党员的党龄从何时算起？","b":"从预备期满转为正式党员之日算起。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_5ca46add","m":"dz","f":"党员自行脱党“连续六个月”的三种情形？","b":"连续六个月不参加党的组织生活、或不交纳党费、或不做党所分配的工作，就被认为是自行脱党。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_e7e5b46a","m":"dz","f":"党的根本组织原则？","b":"民主集中制——民主基础上的集中和集中指导下的民主相结合。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_b90ffe6c","m":"dz","f":"四个服从的内容？","b":"党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_e4ed710b","m":"dz","f":"党的最高领导机关？","b":"党的全国代表大会和它所产生的中央委员会。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_2dedb584","m":"dz","f":"党的基层组织设置的三档人数标准？","b":"正式党员3人以上不足50人→支部委员会；50人以上不足100人→总支部委员会；100人以上→基层委员会。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dz_cb2fc069","m":"dz","f":"党的基层组织是什么？地位如何？","b":"党的基层组织是党在社会基层组织中的战斗堡垒，是党的全部工作和战斗力的基础。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_ad3e0468","m":"dz","f":"党的六项纪律？其中最重要的是？","b":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律；政治纪律是最重要、最根本、最关键的纪律。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_86b39d6a","m":"dz","f":"党的纪律处分有哪五种？","b":"警告、严重警告、撤销党内职务、留党察看、开除党籍（最高处分）。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_657be0cf","m":"dz","f":"留党察看的最长期限与权利限制？","b":"最长不超过二年；留党察看期间没有表决权、选举权和被选举权。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_d51da86b","m":"dz","f":"党在社会主义初级阶段的基本路线？","b":"领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_25b33e5f","m":"dz","f":"四项基本原则是？它是？","b":"坚持社会主义道路、坚持人民民主专政、坚持中国共产党的领导、坚持马克思列宁主义毛泽东思想；是我们的立国之本。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_140f0c93","m":"dz","f":"五位一体、四个全面分别指？","b":"五位一体：经济建设、政治建设、文化建设、社会建设、生态文明建设；四个全面：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_741250f5","m":"dz","f":"党的最大政治优势和最大危险？","b":"最大政治优势是密切联系群众；执政后的最大危险是脱离群众。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_66fff4f2","m":"dz","f":"党的建设必须坚决实现的六项基本要求？","b":"①坚持党的基本路线；②坚持解放思想、实事求是、与时俱进、求真务实；③坚持新时代党的组织路线；④坚持全心全意为人民服务；⑤坚持民主集中制；⑥坚持从严管党治党。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_ce098fc0","m":"dz","f":"四个考验、四个危险？","b":"考验：执政、改革开放、市场经济、外部环境；危险：精神懈怠、能力不足、脱离群众、消极腐败。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_fc79bdf6","m":"dz","f":"新时代我国社会主要矛盾？","b":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_d19bc1e7","m":"dz","f":"伟大建党精神（32字）？","b":"坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_08e30a97","m":"dz","f":"党徽、党旗分别是什么？","b":"党徽为镰刀和锤头组成的图案；党旗为旗面缀有金黄色党徽图案的红旗；党徽党旗是中国共产党的象征和标志。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dz_5dc66df4","m":"dz","f":"共青团与党的关系？","b":"中国共产党领导中国共产主义青年团；共青团是党的助手和后备军，是党联系青年的桥梁和纽带。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dz_ab22d25f","m":"dz","f":"党的全国代表大会每几年举行一次？由谁召集？","b":"每五年举行一次，由中央委员会召集。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_14d59601","m":"dz","f":"新时代新征程的战略目标（两步走）？","b":"到2035年基本实现社会主义现代化；到本世纪中叶把我国建成社会主义现代化强国。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_dz_52cb986b","m":"dz","f":"新时代党的组织路线的主要内容？","b":"全面贯彻习近平新时代中国特色社会主义思想，以组织体系建设为重点，着力培养忠诚干净担当的高素质干部，着力集聚爱国奉献的各方面优秀人才，坚持德才兼备、以德为先、任人唯贤。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_1314b656","m":"dz","f":"党的领导的三个定位+一句总括？","b":"中国共产党的领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势，党是最高政治领导力量；党政军民学，东西南北中，党是领导一切的。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_54f583cb","m":"dz","f":"党按照什么原则选拔干部？好干部标准是什么？","b":"按照德才兼备、以德为先的原则选拔干部，坚持五湖四海、任人唯贤；好干部标准：信念坚定、为民服务、勤政务实、敢于担当、清正廉洁。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dz_2c820806","m":"dz","f":"纪委的双重领导体制与三项职责？","b":"地方各级纪委在同级党委和上级纪委双重领导下工作；职责：监督、执纪、问责。","lv":3,"freq":"know","obj":["active","develop"]},{"id":"c_dz_98e83233","m":"dz","f":"党员的八项义务中，第一条是什么？","b":"认真学习马克思列宁主义等理论，学习党的路线方针政策和决议，学习党的基本知识，学习科学文化法律和业务知识，努力提高为人民服务的本领。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_dz_9d4b9ea5","m":"dz","f":"党员八项权利中，哪三项是最基本的政治权利？","b":"参加党的有关会议、阅读党的有关文件、接受党的教育和培训；以及行使表决权、选举权、有被选举权（第5项）。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_b2e3acf9","m":"fz","f":"发展党员工作的十六字总要求？","b":"控制总量、优化结构、提高质量、发挥作用。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_83b711b4","m":"fz","f":"发展党员工作的三个坚持？","b":"①坚持党章规定的党员标准，始终把政治标准放在首位；②坚持慎重发展、均衡发展，有领导有计划地进行；③坚持入党自愿原则和个别吸收原则，成熟一个，发展一个。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_2cd946c4","m":"fz","f":"两个禁止？","b":"禁止突击发展，反对“关门主义”。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_1c892682","m":"fz","f":"党组织收到入党申请书后多久内谈话？","b":"一个月内派人同入党申请人谈话，了解基本情况。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_cfe86a2c","m":"fz","f":"入党积极分子如何确定？","b":"采取党员推荐、群团组织推优等方式产生人选，由支部委员会（不设支部委员会的由支部大会）研究决定，并报上级党委备案。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_7e9f1de4","m":"fz","f":"培养联系人由几名什么党员担任？四项任务？","b":"一至两名正式党员；任务：①介绍党的基本知识；②了解情况引导端正入党动机；③及时向党支部汇报；④提出能否列为发展对象的意见。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_50f8ac89","m":"fz","f":"对入党积极分子多久考察一次？","b":"党支部每半年对入党积极分子进行一次考察。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_61e05374","m":"fz","f":"列为发展对象需经过多长时间的培养教育考察？","b":"经过一年以上培养教育和考察、基本具备党员条件的入党积极分子，听取党小组、培养联系人、党员和群众意见，支部委员会讨论同意并报上级党委备案后，可列为发展对象。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_1be56b86","m":"fz","f":"入党介绍人的人数与资格限制？","b":"两名正式党员（可党组织指定或发展对象约请）；受留党察看处分尚未恢复党员权利的党员不能作入党介绍人。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_20bc0dd1","m":"fz","f":"政治审查的内容包括哪四个方面？","b":"①对党的理论路线方针政策的态度；②本人的政治历史和在重大政治斗争中的表现；③遵纪守法和遵守社会公德情况；④直系亲属和与本人关系密切的主要社会关系的政治情况。未经政审或政审不合格的，不得发展入党。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_17b650a8","m":"fz","f":"发展对象短期集中培训的时长要求？","b":"时间一般不少于三天（或不少于二十四个学时）；未经培训的，除个别特殊情况外，不能发展入党。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_629e10a3","m":"fz","f":"支部大会讨论接收预备党员的四个程序步骤？","b":"①发展对象汇报对党的认识、入党动机等；②入党介绍人介绍情况并表明意见；③支部委员会报告审查情况；④与会党员充分讨论，采取无记名投票方式表决。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_0bcb7515","m":"fz","f":"支部大会表决通过接收预备党员的规则？","b":"讨论两个以上发展对象必须逐个讨论和表决；有表决权的到会人数须超过应到会有表决权人数的一半；赞成人数须超过应到会有表决权的正式党员的一半。","lv":1,"freq":"must","obj":["active","develop"]},{"id":"c_fz_d66d5bd6","m":"fz","f":"上级党委审批接收预备党员的时限？","b":"应当在三个月内审批；如遇特殊情况可适当延长，但不得超过六个月；两个以上发展对象必须逐个审议和表决。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_22a312ba","m":"fz","f":"哪些党组织不能审批预备党员？","b":"党的总支部委员会不能审批预备党员（但应当对支部大会通过接收的预备党员进行审议）；临时党组织不能接收、审批预备党员。","lv":2,"freq":"high","obj":["active","develop"]},{"id":"c_fz_13911f6a","m":"fz","f":"预备党员转正的程序？","b":"①本人主动提出书面转正申请；②党小组提出意见；③党支部征
