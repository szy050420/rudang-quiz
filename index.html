<style>
/* ==========================================================================
   入党考试复习搭子 · app.css
   视觉概念：红色档案（学员档案卡 + 朱印 + 描金细线），宣纸底、旗红为记、
   松绿为对。一页只放一处醒目（首页档案卡），其余靠线、留白与字距说话。
   ========================================================================== */

:root {
  /* 墨与纸 */
  --ink: #1A1411;
  --ink-2: #42382F;
  --ink-3: #6E6255;
  --paper: #FAF4E8;
  --paper-2: #F1E6D1;
  --paper-3: #FFFCF4;
  --line: #E1D2B7;
  --line-2: #CBB793;

  /* 记与对 */
  --red: #B31B22;
  --red-deep: #7C1015;
  --red-wash: #F6E4E1;
  --gold: #B98A2B;
  --gold-2: #DCC079;
  --jade: #2C5A4B;
  --jade-wash: #E4EDE8;
  --danger: #A6191D;

  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --r-card: 12px;
  --r-btn: 8px;
  --r-tag: 4px;

  --w: 1080px;
  --pad: 20px;
  --ease: cubic-bezier(.2, .7, .3, 1);
  --nav-h: 62px;
}

[data-theme="dark"] {
  --ink: #F7EFE1;
  --ink-2: #DED1BE;
  --ink-3: #B7A894;
  --paper: #14100E;
  --paper-2: #1F1916;
  --paper-3: #241D19;
  --line: #3A2F27;
  --line-2: #55463A;
  --red: #E2594C;
  --red-deep: #F27C6E;
  --red-wash: #2C1A17;
  --gold: #DDB24C;
  --gold-2: #8C7130;
  --jade: #86B9A7;
  --jade-wash: #17241F;
  --danger: #F08A80;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.68;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

/* 旗红压条：全站唯一一条饱和色，钉住"这是一个党建资料站" */
body::before {
  content: "";
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red-deep), var(--red) 45%, var(--gold) 100%);
  z-index: 90;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; line-height: 1.32; }
h1 { font-size: 28px; letter-spacing: -.01em; }
h2 { font-size: 22px; letter-spacing: -.005em; }
h3 { font-size: 18px; }
p { margin: 0 0 12px; }
a { color: var(--red); text-underline-offset: 3px; }

:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--paper-3); color: var(--ink); padding: 12px 16px; z-index: 100;
}
.skip:focus { left: 8px; top: 8px; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

.icon-btn svg { display: block; }

.frame {
  max-width: var(--w);
  margin: 0 auto;
  padding: 0 var(--pad) calc(var(--nav-h) + 40px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

main { outline: none; padding-top: 8px; flex: 1; }
main:focus, main:focus-visible { outline: none; }

.colophon {
  border-top: 1px solid var(--line);
  margin-top: 56px;
  padding-top: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--ink-3);
}

/* ---------------------------------------------------------------- masthead */
.masthead {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 0 14px;
  border-bottom: 1px solid var(--line);
  position: relative;
}
/* 描金细线：档案页的分隔 */
.masthead::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -4px;
  height: 1px;
  background: linear-gradient(90deg, var(--gold-2), transparent 70%);
  opacity: .8;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit; flex: 1; }

.medallion {
  flex: 0 0 auto;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: #FFFDF8;
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  overflow: hidden;
  box-shadow: inset 0 0 0 3px #FFFDF8;
}
.medallion img { display: block; width: 100%; height: 100%; object-fit: cover; }

.seal {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  border: 2px solid var(--red);
  border-radius: var(--r-tag);
  display: grid; place-items: center;
  color: var(--red);
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1;
}

.brand-text { min-width: 0; }
.brand-text .school {
  display: block;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text .product {
  display: block;
  font-family: var(--serif);
  font-size: 18px;
  letter-spacing: .06em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.masthead-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

.who-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: var(--r-tag);
  font-size: 12px; letter-spacing: .06em; color: var(--ink-2);
  background: transparent;
}
.who-chip b { color: var(--red); font-weight: 600; }

/* ---------------------------------------------------------------- tabbar */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
/* 答题/模考这类专注模式下收掉底栏，把整屏让给题目 */
.tabbar[hidden] { display: none; }
body.in-session .frame { padding-bottom: 40px; }
.tab {
  flex: 1;
  min-height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 0; background: transparent;
  color: var(--ink-3);
  font-family: var(--sans); font-size: 11px; letter-spacing: .16em;
  text-decoration: none;
  cursor: pointer;
  position: relative;
  transition: color 140ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.tab:active { background: var(--paper-2); }
.tab .tab-zh { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; line-height: 1.1; }
.tab .tab-sub { display: none; }
.tab[aria-current="page"] { color: var(--red); }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 34%; right: 34%;
  height: 2px; background: var(--red);
}

/* ---------------------------------------------------------------- headings */
.kicker {
  font-size: 11px; letter-spacing: .22em; color: var(--ink-3);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.kicker::before { content: ""; width: 18px; height: 1px; background: var(--red); flex: 0 0 auto; }
.linkish {
  border: 0; background: transparent; padding: 0; margin-left: 6px;
  font: inherit; letter-spacing: .04em; color: var(--red);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  min-height: 24px;
}

.lede { font-size: 16px; color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.section { margin-top: 44px; }
.section-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.section-head h2 { margin-right: auto; }
.section-head .count { font-size: 12px; letter-spacing: .1em; color: var(--ink-3); }

.rule { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }

/* ---------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 20px;
  border: 1px solid transparent; border-radius: var(--r-btn);
  font-family: var(--sans); font-size: 15px; line-height: 1;
  cursor: pointer;
  transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease), transform 90ms var(--ease);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--red); color: #FFF8F2; border-color: var(--red); }
.btn-primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-quiet {
  min-height: 44px; padding: 0 8px; border: 0; background: transparent;
  color: var(--ink-3); font-family: var(--sans); font-size: 14px;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.btn-quiet:hover { color: var(--ink); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.icon-btn {
  width: 42px; height: 42px; display: grid; place-items: center;
  border: 1px solid var(--line-2); border-radius: var(--r-btn);
  background: transparent; color: var(--ink-2); cursor: pointer;
  font-family: var(--sans); font-size: 13px;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 140ms var(--ease), color 140ms var(--ease);
}
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn:active { background: var(--paper-2); }

/* ---------------------------------------------------------------- tags */
.tag {
  display: inline-flex; align-items: center; justify-content: center;
  height: 21px; padding: 0 6px;
  border: 1px solid var(--line); border-radius: var(--r-tag);
  font-size: 11px; letter-spacing: .08em; line-height: 1;
  color: var(--ink-3);
  white-space: nowrap;
}
.tag-must { border-color: var(--red); color: var(--red); }
.tag-high { border-color: var(--ink-3); color: var(--ink-2); }
.tag-know { border-color: var(--line); color: var(--ink-3); }
.tag-gold { border-color: var(--gold); color: var(--gold); }
.tag-solid { background: var(--red); border-color: var(--red); color: #FFF8F2; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chip {
  min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line-2); border-radius: var(--r-tag);
  background: transparent; color: var(--ink-2);
  font-family: var(--sans); font-size: 14px; letter-spacing: .04em;
  cursor: pointer;
  transition: border-color 140ms var(--ease), color 140ms var(--ease), background 140ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { border-color: var(--red); color: var(--red); background: var(--red-wash); }

/* ---------------------------------------------------------------- hero */
.hero { padding: 28px 0 8px; }
.hero h1 { font-size: 32px; line-height: 1.26; margin-bottom: 12px; max-width: 20ch; letter-spacing: -.015em; }
.hero .lede { margin-bottom: 0; }

.home-today { margin-top: 34px; }

@media (min-width: 900px) {
  .home-top {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 56px;
    align-items: start;
  }
  .home-today { margin-top: 40px; }
}

/* ---------------------------------------------------------------- 学员档案 */
.record {
  position: relative;
  margin-top: 20px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 0;
  overflow: hidden;
}
/* 档案卡左上角的红色书脊标签 */
.record-tag {
  position: absolute; top: 0; left: 0;
  background: var(--red); color: #FFF8F2;
  font-size: 10px; letter-spacing: .3em;
  padding: 5px 12px 5px 14px;
  border-bottom-right-radius: var(--r-tag);
}
.record-body { padding: 30px 22px 22px; display: flex; gap: 22px; align-items: center; }
.record-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.record-field { min-width: 0; }
.record-field .k {
  display: block;
  font-size: 10px; letter-spacing: .22em; color: var(--ink-3);
  padding-bottom: 4px; border-bottom: 1px solid var(--line);
  margin-bottom: 6px;
}
.record-field .v { font-family: var(--serif); font-size: 22px; line-height: 1.2; }
.record-field .v small { font-family: var(--sans); font-size: 11px; color: var(--ink-3); letter-spacing: .06em; margin-left: 4px; }
.record-foot {
  border-top: 1px dashed var(--line-2);
  padding: 10px 22px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 12px; color: var(--ink-3); letter-spacing: .04em;
}
.record-foot .spacer { flex: 1; }

/* 朱印：进度以印章的形态出现，而不是一个通用进度环 */
.stamp {
  flex: 0 0 auto;
  width: 84px; height: 84px;
  border: 2px solid var(--red);
  border-radius: 50%;
  display: grid; place-items: center;
  position: relative;
  color: var(--red);
  transform: rotate(-4deg);
}
.stamp::after {
  content: ""; position: absolute; inset: 5px;
  border: 1px solid currentColor; border-radius: 50%; opacity: .4;
}
.stamp svg { display: block; position: relative; z-index: 1; }
.ring-bg { stroke: var(--line-2); }
.ring-fg { stroke: var(--red); transition: stroke-dashoffset 400ms var(--ease); }
.ring-text { font-family: var(--sans); font-size: 11px; fill: var(--red); font-weight: 600; }

/* ---------------------------------------------------------------- identity */
.identity {
  display: grid; grid-template-columns: 1fr; gap: 14px;
  margin-top: 28px;
}
.identity-card {
  text-align: left;
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 22px;
  min-height: 168px;
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer;
  transition: border-color 180ms var(--ease), background 180ms var(--ease), transform 120ms var(--ease);
  font-family: var(--sans); color: var(--ink);
}
.identity-card:hover { border-color: var(--red); background: var(--paper-3); transform: translateY(-2px); }
.identity-card .no { font-size: 11px; letter-spacing: .24em; color: var(--gold); }
.identity-card .name { font-family: var(--serif); font-size: 26px; letter-spacing: .02em; }
.identity-card .desc { font-size: 14px; color: var(--ink-2); line-height: 1.65; flex: 1; }
.identity-card .meta { display: flex; gap: 12px; font-size: 12px; color: var(--ink-3); padding-top: 6px; border-top: 1px solid var(--line); }
.identity-mark { display: flex; align-items: center; gap: 16px; margin: 8px 0 4px; }
.identity-mark img { width: 64px; height: 64px; border-radius: 50%; background: #FFFDF8; border: 1px solid var(--line-2); object-fit: cover; }
.identity-mark .t { font-size: 12px; letter-spacing: .14em; color: var(--ink-3); }

/* ---------------------------------------------------------------- today list */
.today {
  margin-top: 32px;
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 2px 20px;
}
.today-row {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0;
  font-family: var(--sans); color: var(--ink); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.today-row:last-child { border-bottom: 0; }
.today-row:active .today-title { color: var(--red); }
.today-row:hover .today-title { color: var(--red); }
.today-no {
  flex: 0 0 26px; font-family: var(--serif); font-size: 13px; color: var(--gold);
  letter-spacing: .04em;
}
.today-main { flex: 1; min-width: 0; }
.today-title { font-size: 16px; margin-bottom: 2px; transition: color 140ms var(--ease); }
.today-sub { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.today-go { flex: 0 0 auto; font-size: 13px; color: var(--red); letter-spacing: .04em; }

.statline {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 18px 0 4px;
}
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat b { font-family: var(--serif); font-size: 26px; font-weight: 600; }
.stat span { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }

.ring { flex: 0 0 auto; }
.ring svg { display: block; }

/* ---------------------------------------------------------------- rows */
.list { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 15px 0;
  border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--ink);
  font-family: var(--sans); text-align: left;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.row:hover .row-title, .row:active .row-title { color: var(--red); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; line-height: 1.45; transition: color 140ms var(--ease); }
.row-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.row-meta { flex: 0 0 auto; font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }
.row-arrow { flex: 0 0 auto; color: var(--ink-3); font-size: 13px; }

.plain-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.plain-row .body { flex: 1; min-width: 0; }

/* 模块行的重点率细条 */
.weight-bar { height: 2px; background: var(--line); margin-top: 8px; max-width: 180px; }
.weight-bar i { display: block; height: 2px; background: var(--gold); }

/* ---------------------------------------------------------------- stages */
.stage {
  display: flex; gap: 16px;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
}
.stage-no {
  flex: 0 0 62px;
  font-family: var(--serif); font-size: 12px; color: var(--red);
  letter-spacing: .1em;
  padding-top: 3px;
  white-space: nowrap;
}
.stage-body { flex: 1; min-width: 0; }
.stage-body h3 { margin-bottom: 6px; }
.stage-mods { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* ---------------------------------------------------------------- points / cards */
.pt-group { margin-bottom: 30px; }
.pt-group h3 {
  font-size: 16px; margin-bottom: 8px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.pt-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.pt-item:last-child { border-bottom: 0; }
.pt-k { font-size: 14px; color: var(--ink-2); flex: 0 0 34%; }
.pt-v { font-size: 14px; color: var(--ink); flex: 1; font-family: var(--sans); }
.pt-v b {
  font-weight: 600; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--red);
  text-decoration-thickness: 1px; text-underline-offset: 3px;
}
/* 窄屏：两列会让释义挤成一条竖线，改成上下排 */
@media (max-width: 479px) {
  .pt-item { flex-direction: column; gap: 4px; }
  .pt-k { flex: 0 0 auto; font-size: 13px; letter-spacing: .04em; color: var(--ink-3); }
  .pt-v { font-size: 14px; line-height: 1.8; }
}

.mcards { display: grid; grid-template-columns: 1fr; gap: 12px; }
.mcard {
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  padding: 16px;
  background: var(--paper-3);
  font-family: var(--sans); color: var(--ink); text-align: left;
  cursor: pointer; width: 100%;
  transition: border-color 140ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.mcard:hover { border-color: var(--ink-3); }
.mcard .face { font-size: 15px; }
.mcard .flip-hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; letter-spacing: .06em; }
.mcard-back {
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: 14px; color: var(--ink-2);
}
.mcard .meta { display: flex; gap: 6px; margin-top: 8px; }

/* ---------------------------------------------------------------- 主观题 */
.subj {
  border: 1px solid var(--line-2); border-radius: var(--r-card);
  background: var(--paper-3);
  padding: 18px 20px;
  margin-bottom: 14px;
}
.subj-q { font-family: var(--serif); font-size: 18px; line-height: 1.55; margin-bottom: 10px; }
.subj-pts { margin: 0 0 12px; padding: 0; list-style: none; counter-reset: sp; }
.subj-pts li {
  counter-increment: sp;
  font-size: 14px; color: var(--ink-2);
  padding: 5px 0 5px 26px; position: relative;
  border-bottom: 1px dashed var(--line);
}
.subj-pts li:last-child { border-bottom: 0; }
.subj-pts li::before {
  content: counter(sp);
  position: absolute; left: 0; top: 6px;
  width: 18px; height: 18px; border-radius: 50%;
  border: 1px solid var(--gold); color: var(--gold);
  font-size: 10px; display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.subj-ans {
  border-left: 2px solid var(--red);
  padding: 2px 0 2px 16px;
  font-size: 15px; line-height: 1.85; color: var(--ink);
  white-space: pre-wrap;
}
.subj-tip {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--ink-3);
}
.subj-tip b { color: var(--gold); font-weight: 600; letter-spacing: .06em; }
.subj-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.subj-toggle {
  min-height: 40px; padding: 0 14px; margin-top: 12px;
  border: 1px solid var(--red); border-radius: var(--r-btn);
  background: transparent; color: var(--red);
  font-family: var(--sans); font-size: 14px; cursor: pointer;
}
.subj-toggle[aria-expanded="true"] { background: var(--red); color: #FFF8F2; }

/* ---------------------------------------------------------------- runner */
.runner-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 3px; z-index: 10;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.runner-progress { flex: 1; min-width: 0; }
.runner-progress .bar { height: 2px; background: var(--line); margin-top: 8px; }
.runner-progress .bar i { display: block; height: 2px; background: var(--red); width: 0; transition: width 220ms var(--ease); }
.runner-count { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }

.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 26px 0 12px; }
.qstem { font-size: 19px; line-height: 1.65; margin: 0 0 24px; font-weight: 500; }
.qnote { font-size: 13px; color: var(--ink-3); margin: -12px 0 20px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; min-height: 54px;
  padding: 14px 16px;
  border: 1px solid var(--line-2); border-radius: var(--r-btn);
  background: var(--paper-3); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.55; text-align: left;
  cursor: pointer;
  transition: border-color 120ms var(--ease), background 120ms var(--ease), transform 90ms var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.opt:hover { border-color: var(--ink-3); }
.opt:active { transform: scale(.994); }
.opt .key {
  flex: 0 0 24px; height: 24px;
  border: 1px solid var(--line-2); border-radius: var(--r-tag);
  display: grid; place-items: center;
  font-size: 12px; color: var(--ink-3);
}
.opt.is-picked { border-color: var(--red); background: var(--red-wash); }
.opt.is-picked .key { border-color: var(--red); color: var(--red); }
.opt.is-ok { border-color: var(--jade); background: var(--jade-wash); }
.opt.is-ok .key { border-color: var(--jade); color: var(--jade); }
.opt.is-no { border-color: var(--danger); background: var(--red-wash); }
.opt.is-no .key { border-color: var(--danger); color: var(--danger); }
.opt .mk { margin-left: auto; font-size: 12px; letter-spacing: .06em; flex: 0 0 auto; align-self: center; }
.opt .txt { flex: 1 1 auto; min-width: 0; }
.opt[disabled] { cursor: default; }

.judge-row { display: flex; gap: 12px; }
.judge-row .opt { flex: 1; justify-content: center; }
.judge-row .opt .key { display: none; }

.fill-input {
  width: 100%; min-height: 54px; padding: 12px 16px;
  border: 1px solid var(--line-2); border-radius: var(--r-btn);
  background: var(--paper-3); color: var(--ink);
  font-family: var(--sans); font-size: 16px;
  line-height: 1.7;
}
.fill-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }

.feedback { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }
.verdict { font-size: 14px; letter-spacing: .06em; margin-bottom: 8px; }
.verdict.ok { color: var(--jade); }
.verdict.no { color: var(--danger); }
.explain { font-size: 14px; color: var(--ink-2); line-height: 1.8; }
.explain .src { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-3); }

.self-eval { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

.runner-foot {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
}
.runner-foot .spacer { flex: 1; }
.kbd-hint { font-size: 12px; color: var(--ink-3); }

/* ---------------------------------------------------------------- result */
.score {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--serif);
  margin: 8px 0 4px;
}
.score b { font-size: 56px; line-height: 1; font-weight: 600; }
.score span { font-size: 14px; color: var(--ink-3); }

.review-item {
  padding: 16px 0; border-bottom: 1px solid var(--line);
}
.review-q { font-size: 15px; margin-bottom: 8px; }
.review-line { font-size: 13px; color: var(--ink-3); }
.review-line b { color: var(--ink-2); font-weight: 500; }

<script>
window.__BANK_V__ = "3.0.0-c864b6c8";
(async function () {
"use strict";
/**
 * store.js — 本地进度。所有键带版本前缀，清空只清自己的键。
 */
const KEY = 'rdks.v2';
const DEFAULT = {
  who: null,          // 'active' | 'develop'
  theme: 'light',     // 'light' | 'dark'
  seen: {},           // qid -> { n, ok, at }
  wrong: {},          // qid -> { n, at }
  selfEval: {},       // qid -> 'know' | 'fuzzy' | 'no'
  days: [],           // ['2026-11-09', ...]
  last: null,         // 继续上次：{ mode, moduleId, ids, i, answers }
  exams: [],          // [{ at, total, right }]
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { ...DEFAULT };
    const saved = JSON.parse(raw);
    return {
      ...DEFAULT,
      ...saved,
      seen: saved.seen || {},
      wrong: saved.wrong || {},
      selfEval: saved.selfEval || {},
      days: Array.isArray(saved.days) ? saved.days : [],
      exams: Array.isArray(saved.exams) ? saved.exams : [],
    };
  } catch (e) {
    return { ...DEFAULT };
  }
}

function save(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    /* 隐私模式或配额满：静默失败，不影响答题 */
  }
}

function reset() {
  try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
}

function today() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/** 记录今天学习过：连续天数 = 从今天往前相邻的天数 */
function touchDay(state) {
  const t = today();
  if (state.days.includes(t)) return state.days.length;
  state.days.push(t);
  state.days.sort();
  if (state.days.length > 120) state.days = state.days.slice(-120);
  return streak(state.days, t);
}

function streak(days) {
  if (!days.length) return 0;
  const t = today();
  const set = new Set(days);
  if (!set.has(t)) return 0;
  let n = 0;
  const d = new Date();
  for (;;) {
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (!set.has(key)) break;
    n += 1;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ==========================================================================
   入党考试复习搭子 v2 · app.js
   纯静态、无框架、原生 ES module。数据只读 ./data/bank.json，进度写 localStorage。
   路由：#/ #/learn #/learn/:mid #/practice #/exam #/wrong #/search?q=
   ========================================================================== */


const WHO = { active: '入党积极分子', develop: '发展对象' };
const TYPE = { single: '单选题', multi: '多选题', judge: '判断题', fill: '填空题', short: '简答题' };
const LV = { 1: { t: '必考', c: 'tag-must' }, 2: { t: '重点', c: 'tag-high' }, 3: { t: '拓展', c: 'tag-know' } };
const CAT = { lj: '党的基本理论', zc: '方针政策', sz: '时事政治', rd: '入党相关知识' };

/* ---------------------------------------------------------------- 题库装载
   两种形态共用一份代码：
   · 单文件版：题库内联在 #bank-data 里，直接解析；
   · 分离版：题库单独请求，顺便把下载进度报给首屏占位。
   分离版能让页面壳先出来，弱网下不至于对着白屏等半分钟。 */
const BANK_SRC = './data/bank.json' + (window.__BANK_V__ ? '?v=' + window.__BANK_V__ : '');

function bootBar(frac) {
  const bar = document.getElementById('boot-bar');
  if (!bar) return;
  const pct = Math.max(0, Math.min(1, frac || 0));
  const fill = bar.querySelector('i');
  if (fill) fill.style.width = (pct * 100).toFixed(1) + '%';
  bar.setAttribute('aria-valuenow', String(Math.round(pct * 100)));
}

function bootText(t) {
  const sub = document.getElementById('boot-sub');
  if (sub) sub.textContent = t;
}

function bootFail(msg) {
  const hint = document.getElementById('boot-hint');
  const bar = document.getElementById('boot-bar');
  const btn = document.querySelector('.boot-retry');
  if (bar) bar.remove();
  bootText('题库没加载下来。');
  if (hint) hint.textContent = msg || '多半是网络断了，重试一次通常就好。';
  if (btn) {
    btn.hidden = false;
    // 走到这里 app.js 已经抛错，页面级点击代理还没绑上，所以直接挂在本按钮上
    btn.onclick = () => location.reload();
  }
}

/* 单次请求：45 秒超时，边下边报进度 */
function fetchBank() {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', BANK_SRC, true);
    xhr.responseType = 'text';
    xhr.timeout = 45000;
    xhr.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const frac = e.loaded / e.total;
      bootBar(frac);
      bootText('正在加载题库… ' + Math.round(frac * 100) + '%');
    };
    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300) {
        reject(new Error('题库请求失败（HTTP ' + xhr.status + '）'));
        return;
      }
      try { resolve(JSON.parse(xhr.responseText)); }
      catch (err) { reject(new Error('题库格式损坏，刷新一次试试')); }
    };
    xhr.onerror = () => reject(new Error('网络中断，检查一下网络再试'));
    xhr.ontimeout = () => reject(new Error('等了 45 秒还没下来，网络太慢了'));
    xhr.send();
  });
}

async function loadBank() {
  const inline = document.getElementById('bank-data');
  if (inline) {
    try { return JSON.parse(inline.textContent); }
    catch (err) { throw new Error('题库 JSON 解析失败'); }
  }
  // 弱网下第一次容易断在半路，静默重试一次再认输
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      return await fetchBank();
    } catch (err) {
      if (attempt === 2) throw err;
      bootBar(0);
      bootText('下载中断了，正在重试…');
      await new Promise((r) => setTimeout(r, 800));
    }
  }
}

let bank;
try {
  bank = await loadBank();
  bootBar(1);
} catch (err) {
  bootFail(err && err.message);
  throw err;
}

const MOD = new Map(bank.modules.map((m) => [m.id, m]));
const QBY = new Map(bank.questions.map((q) => [q.id, q]));

const poolOf = (who = state.who) => bank.questions.filter((q) => Array.isArray(q.obj) && q.obj.includes(who));

/* ---------------------------------------------------------------- helpers */

/** 站内二次确认，替掉 window.confirm */
function confirmBox(title, body, okText = '确认') {
  return new Promise((resolve) => {
    const modal = $('#modal');
    const prev = document.activeElement;
    $('#modal-title').textContent = title;
    $('#modal-body').textContent = body;
    $('[data-act="modal-ok"]', modal).textContent = okText;
    modal.hidden = false;
    $('[data-act="modal-cancel"]', modal).focus();

    const done = (val) => {
      modal.hidden = true;
      modal.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
      resolve(val);
    };
    const onClick = (e) => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'modal-ok') done(true);
      else if (act === 'modal-cancel') done(false);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
    };
    modal.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
  });
}

function ring(frac, label) {
  const r = 20;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, frac)));
  return `<div class="ring" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle class="ring-bg" cx="26" cy="26" r="${r}" fill="none" stroke-width="3"/>
      <circle class="ring-fg" cx="26" cy="26" r="${r}" fill="none" stroke-width="3"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 26 26)"/>
      <text class="ring-text" x="26" y="30" text-anchor="middle">${esc(label)}</text>
    </svg>
  </div>`;
}

/* ---------------------------------------------------------------- home */
function viewHome() {
  if (!state.who) return viewIdentity();

  const pool = bank.questions.filter(relevant);
  const seen = pool.filter((q) => state.seen[q.id]).length;
  const wrongN = Object.keys(state.wrong).filter((id) => QBY.has(id)).length;
  const days = streak(state.days);
  const pct = pool.length ? seen / pool.length : 0;
  const last = state.last && state.last.ids?.length ? state.last : null;
  const lastQ = last ? QBY.get(last.ids[last.i]) : null;
  const todo = Math.max(0, pool.length - seen);
  const subjN = subjOf().length;

  const rows = [];
  if (lastQ) {
    rows.push(`<button class="today-row" data-act="resume">
      <span class="today-no">01</span>
      <span class="today-main">
        <span class="today-title" style="display:block">继续上次</span>
        <span class="today-sub">${esc(modName(lastQ.m))} · 第 ${last.i + 1} / ${last.ids.length} 题</span>
      </span>
      <span class="today-go">接着做</span>
    </button>`);
  } else {
    const mustN = pool.filter((q) => q.lv === 1).length;
    rows.push(`<button class="today-row" data-act="start-lv" data-lv="1">
      <span class="today-no">01</span>
      <span class="today-main">
        <span class="today-title" style="display:block">从必考核心开始</span>
        <span class="today-sub">按模块顺序，先做 ${mustN} 道必考题</span>
      </span>
      <span class="today-go">开始</span>
    </button>`);
  }
  rows.push(`<button class="today-row" data-act="go-wrong">
    <span class="today-no">02</span>
    <span class="today-main">
      <span class="today-title" style="display:block">${wrongN ? `错题 ${wrongN} 道` : '错题本是空的'}</span>
      <span class="today-sub">${wrongN ? `重练一遍，连续答对两次才移出` : '做错的题会自动收进来'}</span>
    </span>
    <span class="today-go">${wrongN ? '重练' : '去看看'}</span>
  </button>`);
  rows.push(`<button class="today-row" data-act="start-exam">
    <span class="today-no">03</span>
    <span class="today-main">
      <span class="today-title" style="display:block">模考 20 题</span>
      <span class="today-sub">必考优先，交卷后给分与逐题解析</span>
    </span>
    <span class="today-go">开考</span>
  </button>`);
  rows.push(`<button class="today-row" data-act="go-essay">
    <span class="today-no">04</span>
    <span class="today-main">
      <span class="today-title" style="display:block">${subjN} 道问答题</span>
      <span class="today-sub">背要点，看示例答案，答“怎样在校园里做”</span>
    </span>
    <span class="today-go">去背</span>
  </button>`);

  const syl = bank.syllabus?.[state.who === 'develop' ? 'develop' : 'active'];

  view().innerHTML = `
    <div class="home-top">
      <div class="home-lead">
        <section class="hero">
          <p class="kicker">今日 · ${esc(whoLabel())} ${whoSwitch()}</p>
          <h1>${days > 1 ? `第 ${days} 天，接着读。` : '今天也读三页。'}</h1>
          <p class="lede">${esc(prof().lede || '必考先过硬，重点再补齐；时政放最后，按周更新。')}</p>
        </section>
        <div class="record">
          <span class="record-tag">学员档案</span>
          <div class="record-body">
            <div class="stamp" aria-hidden="true">${ring(pct, Math.round(pct * 100) + '%')}</div>
            <div class="record-fields">
              <div class="record-field"><span class="k">已读</span><span class="v">${seen}<small>/${pool.length}</small></span></div>

function viewLearn() {
  const groups = { 1: [], 2: [], 3: [] };
  bank.modules.forEach((m) => { (groups[m.priority] || groups[2]).push(m); });

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">学 · 知识点与记忆卡 ${whoSwitch()}</p>
      <h1>按紧急度读</h1>
      <p class="lede">必考是底线，重点拉分，拓展只求眼熟。每个模块里先看要点，再过记忆卡。</p>
    </section>
    ${[1, 2, 3].map((p) => {
      const ms = groups[p];
      if (!ms.length) return '';
      const title = { 1: '必考核心', 2: '重点掌握', 3: '时政拓展' }[p];
      const sub = { 1: '考试必出，先全部拿下', 2: '拉开差距的部分', 3: '考前一周过一遍即可' }[p];
      return `<div class="section">
        <div class="section-head"><h2>${title}</h2><span class="count">${sub}</span></div>
        <div class="list">
          ${ms.map((m) => {
            const n = bank.questions.filter((q) => q.m === m.id && relevant(q)).length;
            const c = CARDS.filter((x) => x.m === m.id).length;
            if (!n) return '';
            return `<a class="row" href="#/learn/${m.id}">
              <span class="row-main">
                <span class="row-title" style="display:block">${esc(m.name)}</span>
                <span class="row-sub"><span>${n} 题</span><span>${c} 张卡</span><span>${m.tags?.slice(0, 2).join(' · ') || ''}</span></span>
              </span>
              <span class="row-arrow" aria-hidden="true">→</span>
            </a>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}

/* ---------------------------------------------------------------- runner */
function currentQ() {
  if (!session) return null;
  return QBY.get(session.ids[session.i]) || null;
}
function answeredNow() {
  return !!(session && session.answers[session.i]?.done);
}
function isExam() {
  return session?.mode === 'exam';
}

function startSession(mode, ids, moduleId = null) {
  ids = ids.filter((id) => QBY.has(id));
  if (!ids.length) { toast('这里还没有题'); return; }
  session = { mode, moduleId, ids, i: 0, answers: {}, startedAt: Date.now() };
  persistSession();
  viewRunner();
}

function persistSession() {
  if (!session || session.mode === 'exam') return;
  state.last = {
    mode: session.mode,
    moduleId: session.moduleId,
    ids: session.ids.slice(0, 60),
    i: session.i,
    answers: session.answers,
    startedAt: session.startedAt,
  };
  save(state);
}

function viewRunner() {
  if (!session) { location.hash = '#/'; return; }
  const q = currentQ();
  if (!q) { session = null; location.hash = '#/'; return; }
  renderChrome();

  const answered = answeredNow();
  const a = session.answers[session.i] || {};
  const picked = a.picked;
  const n = session.ids.length;
  const pct = ((session.i + (answered ? 1 : 0)) / n) * 100;
  const exam = isExam();

  const head = `
    <div class="runner-head">
      <button class="btn-quiet" data-act="quit">退出</button>
      <div class="runner-progress">
        <div class="runner-count">${exam ? '模考' : '练习'} · 第 ${session.i + 1} / ${n} 题</div>
        <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      </div>
      <div class="runner-count">${esc(modName(q.m))}</div>
    </div>`;

  const meta = `<div class="qmeta">
    <span class="tag">${TYPE[q.t] || q.t}</span>${freqTag(q.lv)}
    ${(q.obj || []).map(objTag).join('')}
  </div>`;

  view().innerHTML = `${head}${meta}
    <h2 class="qstem">${esc(q.q)}</h2>
    ${optsHTML(q, picked, answered, exam)}
    ${feedbackHTML(q, picked, a, answered, exam)}
    ${exam ? `<div class="runner-foot">
      <span class="kbd-hint">已答 ${Object.values(session.answers).filter((x) => x && x.done).length} / ${n} 题</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost" data-act="prev" ${session.i === 0 ? 'disabled' : ''}>上一题</button>
      <button class="btn btn-primary" data-act="next">${session.i + 1 >= n ? '交卷' : '下一题'}</button>
    </div>` : ''}`;

  if (q.t === 'fill' && !answered) {
    const input = $('#fill-in');
    if (input) input.focus();
  }
  persistSession();
}

function optsHTML(q, picked, answered, exam) {
  const reveal = answered && !exam;

  if ((q.t === 'single' || q.t === 'multi') && q.o && q.o.length) {
    const multi = q.t === 'multi';
    const sel = Array.isArray(picked) ? picked : [];
    const body = q.o.map((text, idx) => {
      let cls = '';
      let mk = '';
      if (multi) {
        if (!reveal && sel.includes(idx)) cls += ' is-picked';
      } else if (!reveal && picked === idx) {
        cls += ' is-picked';
      }
      if (reveal) {
        const right = multi ? (Array.isArray(q.a) && q.a.includes(idx)) : idx === q.a;
        if (right) { cls += ' is-ok'; mk = '<span class="mk" style="color:var(--jade)">正确</span>'; }
        else if (multi ? sel.includes(idx) : picked === idx) { cls += ' is-no'; mk = '<span class="mk" style="color:var(--danger)">你的选择</span>'; }
      }
      return `<button class="opt${cls}" data-act="pick" data-i="${idx}" ${reveal ? 'disabled' : ''}>
        <span class="key" aria-hidden="true">${'ABCD'[idx]}</span><span class="txt">${esc(text)}</span>${mk}</button>`;
    }).join('');

    const confirm = (multi && !answered && sel.length)
      ? `<button class="btn btn-primary btn-block" data-act="confirm-multi" style="margin-top:12px">确认（已选 ${sel.length} 项）</button>` : '';
    return `<div class="opts">${body}</div>${confirm}
      ${multi ? '<p class="qnote">多选题：选全才得分，漏选、错选都算错。</p>' : ''}`;
  }

  if (q.t === 'judge') {
    const mk = (val) => {
      if (isExam()) return picked === val ? ' is-picked' : '';
      if (answered) return q.a === val ? ' is-ok' : (picked === val ? ' is-no' : '');
      return picked === val ? ' is-picked' : '';
    };
    return `<div class="judge-row">
      <button class="opt${mk(true)}" data-act="pick" data-i="1" ${answered && !exam ? 'disabled' : ''}>正确</button>
      <button class="opt${mk(false)}" data-act="pick" data-i="0" ${answered && !exam ? 'disabled' : ''}>错误</button>
    </div>`;
  }

  if (q.t === 'fill') {
    return `<input class="fill-input" id="fill-in" value="${esc(picked || '')}"
        placeholder="填写答案，按 Enter 提交" aria-label="填空答案" ${answered && !exam ? 'disabled' : ''}>
      ${answered ? '' : '<div class="chips" style="margin-top:12px"><button class="btn btn-primary" data-act="submit-fill">提交</button></div>'}`;
  }

  if (q.t === 'short') {
    const body = `<textarea class="fill-input" id="fill-in" rows="5" placeholder="先自己写一遍要点，再对照参考答案自评"
        aria-label="简答草稿" ${answered ? 'disabled' : ''}>${esc(picked || '')}</textarea>
      ${answered ? '' : '<div class="chips" style="margin-top:12px"><button class="btn btn-primary" data-act="show-answer">看参考答案</button></div>'}`;
    return body;
  }
  return '';
}

function feedbackHTML(q, picked, a, answered, exam) {
  if (!answered) return '';
  if (exam) return '';

  const ok = a.ok === true;
  const verdict = q.t === 'short'
    ? (a.ok === null || a.ok === undefined ? '对照参考答案，给自己一个判断' : (ok ? '自评：会' : (state.selfEval[q.id] === 'fuzzy' ? '自评：模糊' : '自评：不会')))
    : (ok ? '回答正确' : '回答错误');

  let answerLine = '';
  if (q.t === 'single') answerLine = `正确答案 ${'ABCD'[q.a]}. ${esc(q.o[q.a] || '')}`;
  else if (q.t === 'multi') answerLine = `正确答案 ${(q.a || []).map((i) => 'ABCD'[i]).join('、')}`;
  else if (q.t === 'judge') answerLine = `正确答案 ${q.a ? '正确' : '错误'}`;
  else if (q.t === 'fill') answerLine = `参考答案：${esc(Array.isArray(q.a) ? q.a.join(' / ') : q.a)}`;
  else if (q.t === 'short') answerLine = `参考答案：${esc(q.a)}`;

  const selfEval = q.t === 'short' ? `<div class="self-eval" role="group" aria-label="自评">
      ${[['know', '会'], ['fuzzy', '模糊'], ['no', '不会']].map(([v, t]) =>
        `<button class="btn ${state.selfEval[q.id] === v ? 'btn-primary' : 'btn-ghost'}" data-act="self" data-v="${v}">${t}</button>`).join('')}
    </div>` : '';

  const nextLabel = session.i + 1 >= session.ids.length ? (isExam() ? '交卷' : '完成本轮') : '下一题';

  return `<div class="feedback">
    <div class="verdict ${ok ? 'ok' : (q.t === 'short' && a.ok === null ? '' : 'no')}">${verdict}${ok ? '' : (q.t === 'short' && a.ok === null ? '' : ' · ' + answerLine)}</div>
    ${ok && q.t !== 'short' ? `<p class="small muted" style="margin:0 0 8px">${answerLine}</p>` : ''}
    <p class="explain">${esc(q.e || '')}${q.src ? `<span class="src">出处：${esc(q.src)}</span>` : ''}</p>
    ${q.t === 'short' ? `<p class="explain" style="margin-top:8px">${answerLine}</p>${selfEval}` : ''}
    <div class="runner-foot">
      <span class="kbd-hint">键盘 1–4 选项 · Enter 下一题</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" data-act="next">${nextLabel}</button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- scoring */
function norm(s) {
  return String(s ?? '').replace(/[\s，。、；：""''（）()《》·,.;:!?！？—\-]/g, '').toLowerCase();
}

function check(q, picked) {
  if (picked == null) return false;
  if (q.t === 'judge') return Number(Boolean(picked)) === Number(Boolean(q.a));
  if (q.t === 'single') return picked === q.a;
  if (q.t === 'multi') {
    const a = (q.a || []).slice().sort().join(',');
    const p = (picked || []).slice().sort().join(',');
    return a === p && a !== '';
  }
  if (q.t === 'fill') {
    const inp = norm(picked);
    if (!inp) return false;
    const list = Array.isArray(q.a) ? q.a : String(q.a).split(/[、，,；;/]/);
    return list.some((raw) => {
      const an = norm(raw);
      if (!an) return false;
      if (inp === an) return true;
      if (inp.includes(an)) return true;
      return inp.length >= 3 && an.includes(inp);
    });
  }
  return false;
}

function commit(picked, ok) {
  const q = currentQ();
  if (!q || !session) return;
  session.answers[session.i] = { picked, ok, done: true };

  if (!isExam()) {
    const prev = state.seen[q.id];
    state.seen[q.id] = { n: (prev?.n || 0) + 1, ok, at: Date.now() };
    if (ok) {
      // 错题要连续答对两次才移出，避免蒙对一次就消失
      const w = state.wrong[q.id];
      if (w) {
        w.ok = (w.ok || 0) + 1;
        if (w.ok >= 2) delete state.wrong[q.id];
        else w.at = Date.now();
      }
    } else {
      state.wrong[q.id] = { n: (state.wrong[q.id]?.n || 0) + 1, ok: 0, at: Date.now() };
    }
    touchDay(state);
    save(state);
  }

  announce(ok ? '回答正确' : '回答错误，正确答案已标出');
  viewRunner();
}

function nextQ() {
  if (!session) return;
  // 模考里填空/简答没有“提交”动作，翻页时把草稿收进答案
  if (isExam()) {
    const q = currentQ();
    const box = $('#fill-in');
    if (q && box && (q.t === 'fill' || q.t === 'short') && !session.answers[session.i]?.picked) {
      const v = box.value.trim();
      if (v) session.answers[session.i] = { picked: v, done: true };
    }
  }
  if (isExam() && session.i + 1 >= session.ids.length) return submitExam();
  if (session.i + 1 >= session.ids.length) return finishQuiz();
  session.i += 1;
  persistSession();
  viewRunner();
}

function finishQuiz() {
  const total = session.ids.length;
  const right = Object.values(session.answers).filter((x) => x && x.ok === true).length;
  const answered = Object.values(session.answers).filter((x) => x && x.done).length;
  const mode = session.mode;
  session = null;
  state.last = null;
  save(state);
  activeTab = mode === 'wrong' ? 'wrong' : 'practice';

  view().innerHTML = `

/* ---------------------------------------------------------------- exam */
function pickExamIds() {
  // 简答题无法自动判分，模考只出可判题型
  const pool = bank.questions.filter((q) => relevant(q) && q.t !== 'short');
  const byPrio = { 1: [], 2: [], 3: [] };
  pool.forEach((q) => { (byPrio[MOD.get(q.m)?.priority || 2]).push(q); });
  const mix = prof().mix || { 1: 13, 2: 5, 3: 2 };
  const out = [];
  [1, 2, 3].forEach((p) => { out.push(...shuffle(byPrio[p]).slice(0, mix[p] || 0)); });
  const rest = shuffle(pool.filter((q) => !out.includes(q)));
  while (out.length < 20 && rest.length) out.push(rest.shift());
  return shuffle(out).map((q) => q.id).slice(0, 20);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 刷题顺序：客观题先上，简答放最后，组内仍随机 */
const TYPE_ORDER = { single: 0, multi: 1, judge: 2, fill: 3, short: 4 };
function orderByType(list) {
  const buckets = {};
  for (const q of list) (buckets[q.t] || (buckets[q.t] = [])).push(q.id);
  return Object.keys(TYPE_ORDER)
    .flatMap((t) => shuffle(buckets[t] || []));
}

        </div>
      </div>
      <div class="chips" style="margin-top:24px">
        <button class="btn btn-primary" data-act="start-exam">开始模考</button>
      </div>
    </section>
    ${exams.length ? `<div class="section">
      <div class="section-head"><h2>最近三次</h2><span class="count">百分制</span></div>
      ${exams.map((e) => `<div class="plain-row"><div class="body" style="display:flex;justify-content:space-between;gap:12px">
        <span class="small muted">${new Date(e.at).toLocaleString('zh-CN', { hour12: false })}</span>
        <span class="small"><b style="font-family:var(--serif);font-size:18px">${Math.round((e.right / e.total) * 100)}</b> 分 · 答对 ${e.right}/${e.total}</span>
      </div></div>`).join('')}
    </div>` : ''}`;
}

function submitExam() {
  const s = session;
  const rows = [];
  let right = 0;
  s.ids.forEach((id, i) => {
    const q = QBY.get(id);
    const picked = s.answers[i]?.picked;
    const ok = check(q, picked);
    if (ok) right += 1;
    rows.push({ q, picked, ok });
  });
  state.exams = [...(state.exams || []), { at: Date.now(), total: s.ids.length, right }].slice(-20);
  touchDay(state);
  save(state);
  session = null;
  viewExamResult(rows, right, s.ids.length);
}

function viewExamResult(rows, right, total) {
  activeTab = 'exam';
  renderChrome();
  const score = Math.round((right / total) * 100);
  const answerOf = (q) => {
    if (q.t === 'single') return `${'ABCD'[q.a]}. ${q.o[q.a] || ''}`;
    if (q.t === 'multi') return (q.a || []).map((i) => 'ABCD'[i]).join('、');
    if (q.t === 'judge') return q.a ? '正确' : '错误';
    return Array.isArray(q.a) ? q.a.join(' / ') : q.a;
  };
  const pickedOf = (q, p) => {
    if (p == null) return '未作答';
    if (q.t === 'single') return `${'ABCD'[p]}. ${q.o[p] || ''}`;
    if (q.t === 'multi') return (p || []).map((i) => 'ABCD'[i]).join('、');
    if (q.t === 'judge') return p ? '正确' : '错误';
    return String(p);
  };

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">交卷 · ${esc(whoLabel())}</p>
      <h1>${score >= 90 ? '稳了，保持手感。' : score >= 70 ? '基本盘在，细节要补。' : '先回知识点，再来一遍。'}</h1>
      <div class="score"><b>${score}</b><span>分 · 答对 ${right} / ${total}</span></div>
      <div class="chips" style="margin-top:20px">
        <button class="btn btn-primary" data-act="start-exam">再考一次</button>
        <a class="btn btn-ghost" href="#/wrong">看错题本</a>
        <a class="btn btn-ghost" href="#/">回首页</a>
      </div>
    </section>
    <div class="section">
      <div class="section-head"><h2>逐题解析</h2><span class="count">错的先看</span></div>
      ${rows.map(({ q, picked, ok }, i) => `<div class="review-item ${ok ? 'ok' : 'no'}">
        <div class="review-q">${i + 1}. ${esc(q.q)}</div>
        <div class="review-line">你的答案：<b>${esc(pickedOf(q, picked))}</b></div>
        <div class="review-line">正确答案：<b>${esc(answerOf(q))}</b></div>
        <div class="review-line" style="margin-top:4px">${esc(q.e || '')}${q.src ? ` · 出处：${esc(q.src)}` : ''}</div>
      </div>`).join('')}
    </div>`;
}

/* ---------------------------------------------------------------- wrong */
function viewWrong() {
  const ids = Object.keys(state.wrong).filter((id) => QBY.has(id) && relevant(QBY.get(id)));
  const rows = ids.sort((a, b) => (state.wrong[b].at || 0) - (state.wrong[a].at || 0));

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">错 · 错题本</p>
      <h1>${rows.length ? `${rows.length} 道待重练` : '错题本是空的'}</h1>
      <p class="lede">${rows.length ? '连续答对两次才移出，只蒙对一次不算；也可以直接移除不想再看的题。' : '做错的题会自动收进来，连续答对两次才移出。'}</p>
      ${rows.length ? `<div class="chips" style="margin-top:20px">
        <button class="btn btn-primary" data-act="retry-all">重练全部 ${rows.length} 题</button>
        <button class="btn-quiet" data-act="clear-wrong">清空错题本</button>
      </div>` : ''}
    </section>
    ${rows.length ? `<div class="list">
      ${rows.map((id) => {
        const q = QBY.get(id);
        return `<div class="plain-row">
          <div class="body">
            <div class="row-title" style="font-size:15px">${esc(q.q)}</div>
            <div class="row-sub"><span>${esc(modName(q.m))}</span><span>${TYPE[q.t]}</span><span>错 ${state.wrong[id].n || 1} 次</span></div>
          </div>
          <button class="btn btn-ghost" data-act="retry-one" data-id="${id}">重练</button>
          <button class="icon-btn" data-act="drop-wrong" data-id="${id}" aria-label="从错题本移除">✕</button>
        </div>`;
      }).join('')}
    </div>` : `<div class="empty" style="margin-top:24px">
      <p>还没有错题。先去练十道，错的会自动留在这里。</p>
      <a class="btn btn-ghost" href="#/practice">去练题</a>
    </div>`}`;
}

/* ---------------------------------------------------------------- search */
function viewSearch(q) {
  const query = (q || '').trim();
  const hits = query ? bank.questions.filter((x) =>
    relevant(x) && (x.q.includes(query) || (x.e || '').includes(query) || (x.o || []).some((o) => o.includes(query)))
  ).slice(0, 40) : [];

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">搜 · 题干与解析</p>
      <h1>查一句话</h1>
      <div style="display:flex;gap:8px;margin-top:16px">
        <input class="fill-input" id="search-in" value="${esc(query)}" placeholder="比如：预备期、六大纪律、十五五" aria-label="搜索关键词">
        <button class="btn btn-primary" data-act="do-search">搜索</button>
      </div>
      ${query ? `<p class="small muted" style="margin-top:12px">“${esc(query)}”命中 ${hits.length} 题${hits.length >= 40 ? '（只显示前 40 条）' : ''}</p>` : '<p class="small muted" style="margin-top:12px">输入关键词，题干、选项与解析都会匹配。</p>'}
    </section>
    <div class="list">
      ${hits.map((x) => `<button class="row" data-act="open-q" data-id="${x.id}">
        <span class="row-main">
          <span class="row-title" style="display:block">${esc(x.q)}</span>
          <span class="row-sub"><span>${esc(modName(x.m))}</span><span>${TYPE[x.t]}</span></span>
        </span>
        <span class="row-arrow" aria-hidden="true">→</span>
      </button>`).join('')}
    </div>`;
  const input = $('#search-in');
  if (input && !query) input.focus();
}

/* ---------------------------------------------------------------- essay */
function viewSubj() {
  const all = subjOf();
  const cur = viewSubj._cat || 'all';
  const list = cur === 'all' ? all : all.filter((s) => s.cat === cur);
  const tips = prof().tips || [];

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">问 · 问答题与论述 ${whoSwitch()}</p>
      <h1>先背要点，<br>再写自己的话。</h1>
      <p class="lede">${all.length} 篇。每题给 4 条采分点和一篇示范答案，考场上先列点再展开，300–400 字就够。答案里的“落到自身”按信息管理与信息系统专业写的，可以照结构换成你自己的事。</p>
      ${tips.length ? `<ul class="subj-tips">${tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    </section>
    <div class="chips" role="group" aria-label="按主题筛选">
      ${[['all', '全部'], ...Object.entries(CATS)].map(([k, t]) => `<button class="chip" data-act="subj-cat" data-v="${k}" aria-pressed="${cur === k}">${t}</button>`).join('')}
    </div>
    <div class="subj-list">
      ${list.map((s) => `<article class="subj">
        <div class="subj-head">
          <span class="tag tag-must">${CATS[s.cat] || s.cat}</span>
          <span class="tag">采分点 ${s.pts.length} 条</span>
          <span class="tag">${s.a.length} 字</span>
        </div>
        <h3 class="subj-q">${esc(s.q)}</h3>
        <ol class="subj-pts">${(s.pts || []).map((p) => `<li>${esc(p)}</li>`).join('')}</ol>
        <button class="btn btn-ghost subj-toggle" data-act="subj-toggle" aria-expanded="false">看示范答案</button>
        <div class="subj-ans" hidden>${esc(s.a)}</div>
      </article>`).join('') || `<div class="empty"><p>这个主题下暂时没有题。</p><button class="btn btn-ghost" data-act="subj-cat" data-v="all">看全部</button></div>`}
    </div>`;
}

/* ---------------------------------------------------------------- route */
function route() {
  const hash = location.hash || '#/';
  const [path, qs] = hash.slice(1).split('?');
  const parts = path.split('/').filter(Boolean);
  const p0 = parts[0] || '';

  if (route._sig !== path) {
    route._sig = path;
    window.scrollTo(0, 0);
  }

  if (!state.who && p0 !== 'search') {
    activeTab = '';
    renderChrome();
    viewIdentity();
    focusView();
    return;
  }

  if (session) {
    activeTab = session.mode === 'exam' ? 'exam' : session.mode === 'wrong' ? 'wrong' : 'practice';
    renderChrome();
    viewRunner();
    focusView();
    return;
  }

  activeTab = ['learn', 'practice', 'essay', 'exam', 'wrong'].includes(p0) ? p0 : '';
  renderChrome();

  if (!p0) viewHome();
  else if (p0 === 'learn') { parts[1] ? viewModule(parts[1]) : viewLearn(); }
  else if (p0 === 'practice') viewPractice();
  else if (p0 === 'essay') viewSubj();
  else if (p0 === 'exam') viewExamStart();
  else if (p0 === 'wrong') viewWrong();
  else if (p0 === 'search') viewSearch(new URLSearchParams(qs || '').get('q') || '');
  else viewHome();

  focusView();
}

/** 切页后把焦点交给主区，但不让浏览器顺手把页头滚出视口 */
function focusView() {
  try { view().focus({ preventScroll: true }); } catch (e) { /* 老浏览器忽略参数 */ }
}

/* ---------------------------------------------------------------- actions */
document.addEventListener('click', async (e) => {
  const el = e.target instanceof Element ? e.target.closest('[data-act]') : null;

  // 同 hash 的站内链接不会触发 hashchange，这里补一次
  const link = e.target instanceof Element ? e.target.closest('a[href^="#/"]') : null;
  if (link) {
    const href = link.getAttribute('href');
    if (href === location.hash) { e.preventDefault(); route(); return; }
  }
  if (!el) return;

  const act = el.dataset.act;

  switch (act) {
    case 'who': {
      state.who = el.dataset.who;
      save(state);
      toast(`已切换到${whoLabel()}`);
      route();
      break;
    }
    case 'switch-who': {
      const next = state.who === 'active' ? 'develop' : 'active';
      state.who = next;
      save(state);
      toast(`已切换到${whoLabel()}`);
      route();
      break;
    }
    case 'theme': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      save(state);
      renderChrome();
      break;
    }
    case 'search': {
      location.hash = '#/search';
      break;
    }
    case 'do-search': {
      const v = $('#search-in')?.value.trim() || '';
      location.hash = v ? `#/search?q=${encodeURIComponent(v)}` : '#/search';
      break;
    }
    case 'open-q': {
      startSession('search', [el.dataset.id], QBY.get(el.dataset.id)?.m || null);
      break;
    }
    case 'start-module': {
      const mid = el.dataset.mid;
      let qs = bank.questions.filter((q) => q.m === mid && relevant(q));
      if (el.dataset.lv) qs = qs.filter((q) => q.lv === Number(el.dataset.lv));
      if (!qs.length) { toast('这个筛选下没有题'); break; }
      startSession('module', orderByType(qs), mid);
      break;
    }
    case 'start-lv': {
      const lv = Number(el.dataset.lv || 1);
      const qs = bank.questions.filter((q) => relevant(q) && q.lv === lv);
      if (!qs.length) { toast('这个紧急度下没有题'); break; }
      startSession('lv', orderByType(qs).slice(0, 30));
      break;
    }
    case 'start-stage': {
      const i = Number(el.dataset.i);
      const syl = bank.syllabus?.[state.who === 'develop' ? 'develop' : 'active'];
      const st = syl?.stages?.[i];
      if (!st) { toast('阶段数据缺失'); break; }
      const ids = shuffle(bank.questions.filter((q) => st.modules.includes(q.m) && relevant(q))).map((q) => q.id).slice(0, 20);
      startSession('stage', ids);
      break;
    }
    case 'resume': {
      const last = state.last;
      if (!last || !last.ids?.length) { toast('没有未完成的一轮'); break; }
      session = {
        mode: last.mode || 'module',
        moduleId: last.moduleId || null,
        ids: last.ids.filter((id) => QBY.has(id)),
        i: Math.min(last.i || 0, last.ids.length - 1),
        answers: last.answers || {},
        startedAt: last.startedAt || Date.now(),
      };
      route();
      break;
    }
    case 'go-wrong': {
      location.hash = '#/wrong';
      break;
    }
    case 'go-essay': {
      location.hash = '#/essay';
      break;
    }
    case 'subj-cat': {
      viewSubj._cat = el.dataset.v;
      viewSubj();
      break;
    }
    case 'subj-toggle': {
      const ans = el.parentElement?.querySelector('.subj-ans');
      const open = el.getAttribute('aria-expanded') === 'true';
      el.setAttribute('aria-expanded', String(!open));
      if (ans) ans.hidden = open;
      el.textContent = open ? '看示范答案' : '收起答案';
      break;
    }
    case 'start-exam': {
      if (session) break;
      const ids = pickExamIds();
      startSession('exam', ids);
      break;
    }
    case 'filter': {
      viewPractice._filter = el.dataset.v;
      viewPractice();
      break;
    }
    case 'flip': {
      const back = $('.mcard-back', el);
      const open = el.getAttribute('aria-expanded') === 'true';
      el.setAttribute('aria-expanded', String(!open));
      if (back) back.hidden = open;
      break;
    }
    case 'pick': {
      pick(Number(el.dataset.i));
      break;
    }
    case 'confirm-multi': {
      const q = currentQ();
      const a = session.answers[session.i];
      commit(a?.picked || [], check(q, a?.picked || []));
      break;
    }
    case 'submit-fill': {
      submitFill();
      break;
    }
    case 'show-answer': {
      const q = currentQ();
      if (!q) break;
      const draft = $('#fill-in')?.value || '';
      session.answers[session.i] = { picked: draft, ok: null, done: true };
      announce('参考答案已展开，请自评');
      viewRunner();
      break;
    }
    case 'self': {
      const v = el.dataset.v;
      const q = currentQ();
      if (!q) break;
      state.selfEval[q.id] = v;
      const ok = v === 'know';
      session.answers[session.i] = { ...session.answers[session.i], ok };
      const prev = state.seen[q.id];
      state.seen[q.id] = { n: (prev?.n || 0) + 1, ok, at: Date.now() };
      if (ok) {
        const w = state.wrong[q.id];
        if (w) {
          w.ok = (w.ok || 0) + 1;
          if (w.ok >= 2) delete state.wrong[q.id];
          else w.at = Date.now();
        }
      } else {
        state.wrong[q.id] = { n: (state.wrong[q.id]?.n || 0) + 1, ok: 0, at: Date.now() };
      }
      touchDay(state);
      save(state);
      persistSession();
      announce(ok ? '记为会' : v === 'fuzzy' ? '记为模糊' : '记为不会');
      viewRunner();
      break;
    }
    case 'next': {
      nextQ();
      break;
    }
    case 'prev': {
      if (!session || session.i === 0) break;
      session.i -= 1;
      viewRunner();
      break;
    }
    case 'retry-all': {
      const ids = Object.keys(state.wrong).filter((id) => QBY.has(id) && relevant(QBY.get(id)));
      startSession('wrong', shuffle(ids));
      break;
    }
    case 'retry-one': {
      startSession('wrong', [el.dataset.id], QBY.get(el.dataset.id)?.m || null);
      break;
    }
    case 'drop-wrong': {
      delete state.wrong[el.dataset.id];
      save(state);
      toast('已移出错题本');
      viewWrong();
      break;
    }
    case 'clear-wrong': {
      if (!(await confirmBox('清空错题本', '错题记录会全部删除，已做过的题数不受影响。', '清空'))) break;
      state.wrong = {};
      save(state);
      toast('错题本已清空');
      viewWrong();
      break;
    }
    case 'quit': {
      if (isExam()) {
        if (!(await confirmBox('退出模考', '这一轮的成绩不会保存。', '退出'))) break;
        session = null;
        state.last = null;
        save(state);
        location.hash = '#/exam';
        break;
      }
      if (Object.keys(session.answers).length) {
        if (!(await confirmBox('退出这一轮', '进度已经存下，下次从首页“继续上次”接着做。', '退出'))) break;
      }
      session = null;
      state.last = { ...(state.last || {}), i: 0 };
      save(state);
      location.hash = '#/practice';
      break;
    }
    case 'wipe': {
      if (!(await confirmBox('清除本机进度', '已做题目、错题、连续天数都会清零，且不能恢复。', '清除'))) break;
      reset();
      state = load();
      session = null;
      toast('进度已清空');
      route();
      break;
    }
    default:
      break;
  }
});

function submitFill() {
  const q = currentQ();
  if (!q || !session) return;
  const input = $('#fill-in');
  const val = input ? input.value.trim() : '';
  if (!val) { toast('先写下答案'); if (input) input.focus(); return; }
  if (isExam()) {
    session.answers[session.i] = { picked: val, done: true };
    viewRunner();
    return;
  }
  commit(val, check(q, val));
}

function pick(i) {
  const q = currentQ();
  if (!q || !session) return;
  if (answeredNow() && !isExam()) return;

  if (q.t === 'multi') {
    const cur = Array.isArray(session.answers[session.i]?.picked) ? session.answers[session.i].picked.slice() : [];
    const at = cur.indexOf(i);
    if (at >= 0) cur.splice(at, 1); else cur.push(i);
    session.answers[session.i] = { picked: cur, done: false };
    viewRunner();
    return;
  }

  if (isExam()) {
    session.answers[session.i] = { picked: i, done: true };
    viewRunner();
    return;
  }
  commit(i, check(q, i));
}

/* ---------------------------------------------------------------- keyboard */
document.addEventListener('keydown', (e) => {
  if (!$('.runner-head')) return;
  if (!session) return;
  const tag = document.activeElement?.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';

  if (e.key === 'Enter') {
    if (typing) {
      const q = currentQ();
      if (q?.t === 'fill') { e.preventDefault(); submitFill(); return; }
    }
    if (answeredNow()) { e.preventDefault(); nextQ(); return; }
    if (currentQ()?.t === 'multi') {
      const btn = $('[data-act="confirm-multi"]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
    return;
  }

  if (typing) return;

  const n = Number(e.key);
  if (!Number.isNaN(n) && n >= 1 && n <= 4) {
    const idx = n - 1;
    const q = currentQ();
    if (!q) return;
    if (q.t === 'judge') { e.preventDefault(); pick(idx === 0 ? 1 : 0); return; }
    if ((q.o || []).length >= n) { e.preventDefault(); pick(idx); }
  }
});

/* ---------------------------------------------------------------- start */
renderChrome();
route();
window.addEventListener('hashchange', route);

})().catch(function (err) { console.error(err); });
</script>
