支部党员大会、支部委员会会议、党小组会，按时上好党课。","tag":"精华"},{"k":"双重组织生活","v":"党员领导干部除参加党委（党组）的组织生活外，还应当参加所在党支部或者党小组的组织生活。","tag":"重点"},{"k":"三大优良作风","v":"理论联系实际、密切联系群众、批评和自我批评（党的<b>七大概括</b>）。","tag":"精华"},{"k":"中央八项规定","v":"<b>2012年12月</b>出台，是新时代改进作风的切入口和动员令；2025年开展深入贯彻中央八项规定精神学习教育。","tag":"重点"}]},{"g":"三、纪律与处分","items":[{"k":"六大纪律","v":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律；<b>政治纪律</b>最重要、最根本、最关键。","tag":"精华"},{"k":"五种处分","v":"警告、严重警告、撤销党内职务、<b>留党察看</b>、开除党籍。","tag":"精华"},{"k":"留党察看","v":"期限一般为一年，<b>最长不超过二年</b>；期间没有表决权、选举权和被选举权。","tag":"精华"},{"k":"处分程序","v":"对党员的纪律处分，必须经过<b>支部大会</b>讨论决定，报党的基层委员会批准。","tag":"重点"},{"k":"《纪律处分条例》","v":"2023年12月修订，2024年1月1日起施行。","tag":"了解"}]}],"xd6":[{"g":"一、六大思想提出时间与核心要义","items":[{"k":"“六大思想”提出顺序","v":"经党中央批准公开使用的六大思想依次为：<b>习近平强军思想（2017）</b>、<b>习近平经济思想（2017年12月中央经济工作会议）</b>、<b>习近平生态文明思想（2018年5月全国生态环境保护大会）</b>、<b>习近平外交思想（2018年6月中央外事工作会议）</b>、<b>习近平法治思想（2020年11月中央全面依法治国工作会议）</b>、<b>习近平文化思想（2023年10月全国宣传思想文化工作会议）</b>。","tag":"精华"},{"k":"习近平强军思想","v":"党在新时代的强军目标：建设一支<b>听党指挥、能打胜仗、作风优良</b>的人民军队；<b>2027年实现建军一百年奋斗目标</b>，2035年基本实现国防和军队现代化，本世纪中叶建成世界一流军队。","tag":"精华"},{"k":"习近平经济思想","v":"加强党对经济工作的全面领导；以人民为中心；完整准确全面贯彻<b>新发展理念</b>（创新、协调、绿色、开放、共享）；构建<b>新发展格局</b>；推动<b>高质量发展</b>；市场在资源配置中起决定性作用；发展<b>新质生产力</b>。","tag":"精华"},{"k":"习近平生态文明思想","v":"<b>绿水青山就是金山银山</b>；人与自然和谐共生；山水林田湖草沙一体化保护和系统治理；<b>“双碳”目标：2030年前碳达峰、2060年前碳中和</b>。","tag":"精华"},{"k":"习近平外交思想","v":"推动构建<b>人类命运共同体</b>；“十个坚持”；中国特色大国外交；高质量共建“一带一路”；<b>三大全球倡议</b>——全球发展倡议、全球安全倡议、全球文明倡议。","tag":"精华"},{"k":"习近平法治思想 / 习近平文化思想","v":"法治思想核心要义为<b>“十一个坚持”</b>，第一条是坚持党对全面依法治国的领导；总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。文化思想特质为<b>“明体达用、体用贯通”</b>，到<b>2035年建成文化强国</b>。","tag":"精华"}]},{"g":"二、另两个常考重要思想与概念","items":[{"k":"习近平关于党的建设的重要思想","v":"<b>2023年6月全国组织工作会议</b>首次概括，核心是<b>“十三个坚持”</b>，以“两个维护”为最高政治原则、以坚持和加强党的全面领导为根本保证。<b>它不属于“六大思想”序列</b>，但常作为干扰项或单独考点出现。","tag":"精华"},{"k":"总体国家安全观","v":"<b>2014年4月</b>中央国家安全委员会第一次会议提出：以<b>人民安全为宗旨</b>、以<b>政治安全为根本</b>、以<b>经济安全为基础</b>、以军事科技文化社会安全为保障、以促进国际安全为依托。","tag":"精华"},{"k":"易混辨析：六个必须坚持 ≠ 十四个坚持","v":"<b>“六个必须坚持”</b>是党的二十大提出的世界观和方法论：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下；<b>“十四个坚持”</b>是基本方略。二者层次不同，考试常设陷阱。","tag":"重点"},{"k":"易混辨析：六大思想 vs 十个明确","v":"“十个明确”是习近平新时代中国特色社会主义思想的核心内容（十九届六中全会概括）；“六大思想”是分领域的思想体系。二者不在同一层次，不能互相替代。","tag":"重点"},{"k":"记忆口诀","v":"时间顺序记“<b>军—经—生—外—法—文</b>”：17、17、18、18、20、23。<b>先军后经再生态，外交法治文化来</b>。","tag":"了解"}]}]},"essentials":[{"id":"e_2df5d4fb","c":"zc","f":"党的六大纪律是什么？","b":"政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。"},{"id":"e_8a0c78bb","c":"zc","f":"对党员的五种纪律处分是什么？","b":"警告、严重警告、撤销党内职务、留党察看、开除党籍。"},{"id":"e_c649eda0","c":"zc","f":"党内法规体系“1+4”布局指什么？","b":"以党章为根本，包括党的组织法规、党的领导法规、党的自身建设法规、党的监督保障法规四个板块。"},{"id":"e_5402c5fb","c":"zc","f":"监督执纪“四种形态”指什么？","b":"红脸出汗成常态；轻处分组织调整是大多数；重处分重大职务调整是少数；严重违纪涉嫌犯罪是极少数。"},{"id":"e_2d2ab3b9","c":"lj","f":"党的性质是什么？（两个先锋队）","b":"中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，是中国特色社会主义事业的领导核心，代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。"},{"id":"e_d3e6cd90","c":"lj","f":"党的行动指南（指导思想）是什么？","b":"马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想。"},{"id":"e_d6580d6c","c":"lj","f":"党的最高理想和最终目标、初心使命是什么？","b":"最高理想和最终目标是实现共产主义；初心使命是为中国人民谋幸福、为中华民族谋复兴。"},{"id":"e_40c862ee","c":"lj","f":"党在社会主义初级阶段的基本路线（一个中心两个基本点）？","b":"领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则、坚持改革开放，自力更生、艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。"},{"id":"e_fc79bdf6","c":"lj","f":"新时代我国社会主要矛盾？","b":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。"},{"id":"e_86494176","c":"lj","f":"党的根本组织原则与“四个服从”？","b":"民主集中制；四个服从：党员个人服从党的组织、少数服从多数、下级组织服从上级组织、全党各个组织和全体党员服从党的全国代表大会和中央委员会。"},{"id":"e_defe075b","c":"lj","f":"党的最大政治优势与执政后的最大危险？","b":"最大政治优势是密切联系群众；执政后最大危险是脱离群众。党风问题、党同人民群众联系问题是关系党生死存亡的问题。"},{"id":"e_d19bc1e7","c":"lj","f":"伟大建党精神（32字）？","b":"坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。"},{"id":"e_031f370e","c":"zc","f":"中国式现代化的五个特色？","b":"人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路的现代化。"},{"id":"e_5d5d3ca1","c":"zc","f":"高质量发展的重要地位？","b":"高质量发展是全面建设社会主义现代化国家的首要任务，推动经济实现质的有效提升和量的合理增长。"},{"id":"e_3a27df04","c":"zc","f":"新质生产力的三要素（特点、关键、本质）？","b":"特点是创新，关键在质优，本质是先进生产力；以科技创新引领产业升级，因地制宜发展新质生产力。"},{"id":"e_f33e6078","c":"zc","f":"新发展理念与新发展格局？","b":"新发展理念：创新、协调、绿色、开放、共享；新发展格局：构建以国内大循环为主体、国内国际双循环相互促进的新发展格局。"},{"id":"e_68a396d8","c":"zc","f":"“两个毫不动摇”与民营经济？","b":"毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展；落实民营经济促进法，构建民营企业参与国家重点项目建设长效机制。"},{"id":"e_10d9a2e0","c":"zc","f":"中央八项规定精神？","b":"改进调查研究等八项（2012年12月），是全面从严治党的切入口和动员令；锲而不舍落实中央八项规定精神，推进作风建设常态化长效化。"},{"id":"e_a6e7b770","c":"zc","f":"新时代两步走战略目标？","b":"到2035年基本实现社会主义现代化；到本世纪中叶把我国建成社会主义现代化强国。"},{"id":"e_836d7b04","c":"sz","f":"党的二十届三中全会（2024年7月）？","b":"审议通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》，总目标是继续完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化，到2035年全面建成高水平社会主义市场经济体制。"},{"id":"e_5152e422","c":"sz","f":"党的二十届四中全会（2025年10月）？","b":"审议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》，明确“十五五”时期主要目标，为2035年人均GDP达到中等发达国家水平打基础。"},{"id":"e_3775ade1","c":"sz","f":"2026年全国两会主要成果？","b":"十四届全国人大四次会议（2026年3月）批准“十五五”规划纲要，通过生态环境法典、民族团结进步促进法、国家发展规划法；2026年GDP增长目标4.5%—5%。"},{"id":"e_9b375319","c":"sz","f":"纪念抗战胜利80周年（2025年9月3日）？","b":"北京天安门广场举行纪念大会与盛大阅兵；中国人民经过14年浴血奋战，是中华民族从近代深重危机走向伟大复兴的历史转折点；伟大抗战精神是精神力量。"},{"id":"e_aa0b30b5","c":"sz","f":"建党105周年与习近平党建思想？","b":"2026年6月15日全国党建工作座谈会部署学习贯彻；是习近平新时代中国特色社会主义思想的“党建篇”，集中概括为“十四个坚持”。"},{"id":"e_e76c2b91","c":"sz","f":"2025年中央经济工作会议？","b":"2025年12月召开，部署2026年经济工作、布局“十五五”开局；坚持稳中求进、提质增效，实施更加积极的财政政策和适度宽松的货币政策。"},{"id":"e_158830b5","c":"sz","f":"党的自我革命（跳出历史周期率第二个答案）？","b":"第二个答案是不断推进党的自我革命；落实“九个以”实践要求，推进“四个自我”（自我净化、自我完善、自我革新、自我提高），确保党永远不变质、不变色、不变味。"},{"id":"e_04f6cc9c","c":"rd","f":"申请加入中国共产党的基本条件？","b":"年满十八岁的中国工人、农民、军人、知识分子和其他社会阶层的先进分子，承认党的纲领和章程，愿意参加党的一个组织并在其中积极工作、执行党的决议和按期交纳党费。"},{"id":"e_b2e3acf9","c":"rd","f":"发展党员工作的十六字总要求？","b":"控制总量、优化结构、提高质量、发挥作用。"},{"id":"e_145cd0ea","c":"rd","f":"发展党员的五个阶段？","b":"入党申请人→入党积极分子→发展对象→预备党员→正式党员。"},{"id":"e_1f15a0f9","c":"rd","f":"入党积极分子的确定与培养要点？","b":"收到入党申请书后一个月内派人谈话；通过推优等方式确定积极分子；每半年进行一次考察；培养教育一年以上且条件成熟的可列为发展对象。"},{"id":"e_43a0325d","c":"rd","f":"发展对象接收为预备党员的关键程序？","b":"两名正式党员作介绍人；进行政治审查；短期集中培训；支部大会讨论通过；党委三个月内审批；预备期一年（从支部大会通过之日算起）。"},{"id":"e_a68bd907","c":"rd","f":"预备党员的权利限制与党龄？","b":"预备党员义务同正式党员，但没有表决权、选举权和被选举权；党龄从预备期满转为正式党员之日算起。"},{"id":"e_b8227308","c":"rd","f":"入党誓词（80字）？","b":"我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。"},{"id":"e_0aca096c","c":"lj","f":"党史学习教育的目标要求（学史四要求）是什么？","b":"学史明理、学史增信、学史崇德、学史力行。"},{"id":"e_dba0410e","c":"lj","f":"《党史学习教育工作条例》何时施行？","b":"2024年1月18日审议批准、2024年2月5日发布并施行，由中央宣传部、中央党史和文献研究院负责解释。"},{"id":"e_05809691","c":"lj","f":"党的二十大大会主题是什么？","b":"高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘扬伟大建党精神，自信自强、守正创新，踔厉奋发、勇毅前行，为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。"},{"id":"e_acf54269","c":"lj","f":"新时代十年的三件大事是什么？","b":"①迎来中国共产党成立一百周年；②中国特色社会主义进入新时代；③完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。"},{"id":"e_30488e66","c":"lj","f":"新时代新征程党的中心任务是什么？","b":"团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。"},{"id":"e_5111cd08","c":"lj","f":"习近平新时代中国特色社会主义思想的世界观方法论（六个必须坚持）是什么？","b":"必须坚持人民至上、必须坚持自信自立、必须坚持守正创新、必须坚持问题导向、必须坚持系统观念、必须坚持胸怀天下。"},{"id":"e_9a25fffd","c":"sz","f":"进一步全面深化改革的总目标是什么？","b":"继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。"},{"id":"e_a801632d","c":"sz","f":"进一步全面深化改革要聚焦哪七个方面？","b":"聚焦构建高水平社会主义市场经济体制、发展全过程人民民主、建设社会主义文化强国、提高人民生活品质、建设美丽中国、建设更高水平平安中国、提高党的领导水平和长期执政能力。"},{"id":"e_d2077c39","c":"sz","f":"“十五五”时期经济社会发展必须坚持的“六个坚持”原则是什么？","b":"①坚持党的全面领导；②坚持人民至上；③坚持高质量发展；④坚持全面深化改革；⑤坚持有效市场和有为政府相结合；⑥坚持统筹发展和安全。"},{"id":"e_6efcabbf","c":"sz","f":"2035年远景目标是什么？","b":"在“十五五”基础上再奋斗五年，到2035年实现我国经济实力、科技实力、国防实力、综合国力和国际影响力大幅跃升，人均国内生产总值达到中等发达国家水平，基本实现社会主义现代化。"}],"essays":[{"id":"s_56c7c32e","c":"zc","f":"党的六大纪律不包括（）。","b":"保密纪律。六大纪律：政治、组织、廉洁、群众、工作、生活纪律。"},{"id":"s_45660973","c":"zc","f":"对党员的纪律处分种类有（）。","b":"五种。五种：警告、严重警告、撤销党内职务、留党察看、开除党籍。"},{"id":"s_1d63c837","c":"zc","f":"新修订的《纪律处分条例》自（）起施行。","b":"2024年1月1日。2023年12月印发，2024年1月1日起施行。"},{"id":"s_8289322e","c":"zc","f":"党章是最根本的党内法规，是管党治党的总规矩。","b":"正确。党章是最根本的党内法规，是管党治党的总规矩。"},{"id":"s_9f91b601","c":"lj","f":"中国共产党的性质是（），同时是中国人民和中华民族的先锋队。","b":"中国工人阶级的先锋队。两个先锋队：中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队。"},{"id":"s_fb8b900e","c":"lj","f":"新时代我国社会主要矛盾是（）。","b":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。十九大起：美好生活需要与不平衡不充分发展之间的矛盾。"},{"id":"s_effb2f43","c":"lj","f":"党的最高理想和最终目标是实现中华民族伟大复兴。","b":"错误。最高理想和最终目标是实现共产主义；中华民族伟大复兴是初心使命。"},{"id":"s_427c0f3f","c":"lj","f":"党在社会主义初级阶段基本路线的核心是“一个中心、两个基本点”，即以________为中心，坚持四项基本原则，坚持改革开放。","b":"经济建设。一个中心即经济建设，两个基本点即四项基本原则和改革开放。"},{"id":"s_1604b9ea","c":"lj","f":"简述四项基本原则的内容及地位。","b":"四个坚持，立国之本。"},{"id":"s_7fde14b0","c":"zc","f":"高质量发展是全面建设社会主义现代化国家的（）。","b":"首要任务。高质量发展是首要任务。"},{"id":"s_da842cea","c":"zc","f":"新质生产力以（）大幅提升为核心标志。","b":"全要素生产率。新质生产力以全要素生产率大幅提升为核心标志。"},{"id":"s_9f3df143","c":"zc","f":"毫不动摇巩固和发展非公有制经济，毫不动摇鼓励、支持、引导公有制经济发展。","b":"错误。两个毫不动摇：巩固发展公有制经济，鼓励支持引导非公有制经济。顺序不能颠倒。"},{"id":"s_380268a9","c":"zc","f":"新发展理念是创新、协调、________、开放、共享。","b":"绿色。创新协调绿色开放共享。"},{"id":"s_5620f4db","c":"zc","f":"简述中国式现代化的五个特色。","b":"五个特色需成套记忆。"},{"id":"s_900cc5f3","c":"sz","f":"党的二十届四中全会审议通过的重要文件是（）。","b":"关于制定“十五五”规划的建议。2025年10月四中全会审议通过“十五五”规划建议。"},{"id":"s_fe55540c","c":"sz","f":"2026年3月，十四届全国人大四次会议审查批准的是（）。","b":"“十五五”规划纲要。批准“十五五”规划纲要，并通过生态环境法典等三部法律。"},{"id":"s_96947fa1","c":"sz","f":"2026年政府工作报告提出的经济增长预期目标是（）。","b":"4.5%—5%，在实际工作中努力争取更好结果。2026年GDP增长目标4.5%—5%。"},{"id":"s_ec5b3f80","c":"sz","f":"纪念抗战胜利80周年大会于2025年9月3日在北京天安门广场举行并阅兵。","b":"正确。正确。14年浴血奋战，是中华民族走向伟大复兴的历史转折点。"},{"id":"s_79b4c8ef","c":"sz","f":"习近平党建思想的定位是习近平新时代中国特色社会主义思想的（）。","b":"党建篇。习近平党建思想是“党建篇”。"},{"id":"s_e637e7a1","c":"sz","f":"简述习近平党建思想“十四个坚持”的重大意义。","b":"集中概括、重大原创性贡献、根本遵循。"},{"id":"s_00030355","c":"rd","f":"申请加入中国共产党必须年满（）。","b":"十八岁。入党基本条件：年满十八岁。"},{"id":"s_be9e9122","c":"rd","f":"发展党员工作的十六字总要求是（）。","b":"控制总量、优化结构、提高质量、发挥作用。十六字总要求：控制总量、优化结构、提高质量、发挥作用。"},{"id":"s_d13aba41","c":"rd","f":"预备党员的预备期从（）算起。","b":"支部大会通过他为预备党员之日。预备期一年，从支部大会通过他为预备党员之日算起。"},{"id":"s_7246b813","c":"rd","f":"预备党员享有与正式党员完全相同的表决权、选举权和被选举权。","b":"错误。预备党员没有表决权、选举权和被选举权。"},{"id":"s_6d7b6da3","c":"rd","f":"入党誓词开头为“我志愿加入中国共产党，拥护党的纲领，遵守党的章程，________……”。","b":"履行党员义务。誓词：拥护纲领、遵守章程、履行义务、执行决定、严守纪律、保守秘密、对党忠诚、积极工作……"},{"id":"s_29d24ffc","c":"rd","f":"简述发展党员的五个阶段。","b":"五个阶段的身份称谓链条是常考点。"},{"id":"s_56628a72","c":"lj","f":"党史学习教育的总要求（目标）是（）。","b":"学史明理、学史增信、学史崇德、学史力行。学史明理、学史增信、学史崇德、学史力行。"},{"id":"s_0b35d4fb","c":"lj","f":"《党史学习教育工作条例》自2024年2月5日起施行。","b":"正确。条例2024年1月18日审议批准、2024年2月5日发布并施行。"},{"id":"s_bfda6ffb","c":"sz","f":"党的二十届三中全会审议通过的《决定》的主题是（）。","b":"进一步全面深化改革、推进中国式现代化。全会主题：进一步全面深化改革、推进中国式现代化。"},{"id":"s_14d1dc0b","c":"sz","f":"进一步全面深化改革的总目标，是继续完善和发展____制度，推进国家治理体系和治理能力现代化。","b":"中国特色社会主义。总目标：继续完善和发展中国特色社会主义制度，推进国家治理体系和治理能力现代化。"},{"id":"s_b7c5d50a","c":"lj","f":"新时代十年的三件大事不包括（）。","b":"基本实现社会主义现代化。三件大事：建党百年、进入新时代、完成脱贫攻坚全面建成小康实现第一个百年目标。"},{"id":"s_5db449a8","c":"lj","f":"新时代新征程党的中心任务是（）。","b":"团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。中心任务：全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化推进中华民族伟大复兴。"},{"id":"s_7cde3980","c":"lj","f":"“三个务必”是务必不忘初心牢记使命、务必谦虚谨慎艰苦奋斗、务必敢于斗争善于斗争。","b":"正确。三个务必：务必不忘初心牢记使命，务必谦虚谨慎艰苦奋斗，务必敢于斗争善于斗争。"},{"id":"s_e4e230c3","c":"lj","f":"下列属于“六个必须坚持”的有（）。","b":"必须坚持人民至上、必须坚持守正创新、必须坚持系统观念。六个必须坚持：人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下。"},{"id":"s_3d2f0408","c":"sz","f":"党的二十届三中全会《决定》提出，到2029年中华人民共和国成立80周年时，完成《决定》提出的改革任务。","b":"正确。全会提出到2029年完成《决定》提出的改革任务。"},{"id":"s_ad905fe0","c":"sz","f":"党的二十届四中全会于2025年10月20日至23日在北京举行。","b":"正确。四中全会2025年10月20日至23日举行，出席中央委员168人。"},{"id":"s_ff044008","c":"sz","f":"根据“十五五”规划建议，到2035年我国人均国内生产总值要达到（）。","b":"中等发达国家水平。2035年远景：人均GDP达到中等发达国家水平，基本实现社会主义现代化。"}],"syllabus":{"active":{"title":"入党积极分子 · 三阶段","stages":[{"name":"入门 · 先把身份弄清楚","modules":["rzsd","dz","fz"],"goal":"想清楚为什么入党，党章总纲与入党流程全链条过一遍，知道自己在哪一步、下一步做什么"},{"name":"核心 · 为什么要入党","modules":["jjjc","esd","zwgm","djsx"],"goal":"纪律底线、理论主线、自我革命三块打穿，答得出“为什么”而不只是“是什么”"},{"name":"冲刺 · 考前一周","modules":["jcgn","dsl","bxd","kz80","jd105"],"goal":"基础概念与党史时政快速回忆，错题本清零，模考稳定 85 分以上"}]},"develop":{"title":"发展对象 · 三阶段","stages":[{"name":"入门 · 程序与规矩","modules":["fz","dz"],"goal":"《发展党员工作细则》五个阶段、时限、政审与预备期细节全部记准"},{"name":"核心 · 理论的深度","modules":["esd","jjjc","zwgm","dsl"],"goal":"能复述报告原文并解释逻辑，纪律处分运用与党史坐标不出错"},{"name":"冲刺 · 时政攻坚","modules":["ssqh","szqh","shiwu","jjgz","fczc","jd105"],"goal":"四中全会、十五五、中央经济工作会议三条线打通，时政题不丢分"}]}},"subjective":[{"id":"sub_01","cat":"dj","obj":["active","develop"],"q":"结合这次培训，谈谈你为什么入党，什么才是正确的入党动机。","pts":["正确动机是献身共产主义事业、更好为人民服务","错误动机多为功利化、随大流、图光环","检验动机看平常时候表现和关键时刻选择","端正动机要靠学理论、学榜样、经实践校正"],"a":"入党不是给自己添一个身份标签，而是志愿把一生同党和人民的事业绑在一起。党章第二条规定，中国共产党党员是中国工人阶级的有共产主义觉悟的先锋战士，必须全心全意为人民服务，不惜牺牲个人的一切，为实现共产主义奋斗终身。这就是正确动机的内核：献身共产主义事业、更好为人民服务。\n不正确的动机有几种：把入党当成就业评优的加分项；看同学交申请书就跟着交，图合群；把党员身份当光环，只要先进称号，不担吃苦在前、享受在后的义务。它们的共同点是把入党当成收获，而不是担当。\n这次培训校正了我的认识。共读《七律·长征》、看《血战湘江》，我掂出了长征精神中把民族根本利益看得高于一切的分量；《榜样10》里茹振钢四十年守着麦田、梁建英带队攻克高铁难题，让我明白榜样不是喊出来的，是把入党志愿书上的话一天天做出来。\n我是商务信息学院信息管理与信息系统专业的学生，端正动机要落在具体处：作业不抄、数据不造假，党课不缺席、不打卡式参与，社区助老志愿活动愿意去，网络上不传谣不起哄。先把看得见的事做满一年，再谈组织上入党。","tip":"四段走：先立正确动机并引党章第二条，再破错误动机，然后用长征精神和榜样各举一例，最后落到本专业的具体行动，别通篇喊口号。"},{"id":"sub_02","cat":"dj","obj":["active","develop"],"q":"作为入党积极分子，如何以实际行动争取入党？","pts":["思想上先入党，学理论、纯动机、强党性","学业上做表率，成绩与学风双过硬","服务同学，主动承担班级和支部的具体工作","自觉接受培养考察，定期汇报思想真实情况"],"a":"争取入党，前提是把思想根子扎正。党章第二条讲的党员基本条件，第一条就落在觉悟上。我把党章和二十大报告原文当作必修课，每半月写一次学习笔记，把为什么入党这道题反复问自己，不让动机随着时间松下来。\n行动首先在学业上见。我读信息管理与信息系统，专业课涉及数据库、数据分析、系统开发，这些恰恰来不得半点含糊。我给自己定下不抄作业、不代做课设、实验数据不修饰三条底线，课设主动当组长把进度顶住，成绩从班级中游提到前列，同学也愿意找我一起做项目。\n其次是服务同学。班级学风互助、支部主题党日的材料整理、学院志愿服务，我都主动认领具体一摊，不挑轻的。社区数字化助老那类活动，我负责教老人用手机挂号、识别诈骗链接，把专业用在别人真正需要的地方。\n最后是自觉接受组织的培养考察。培养联系人谈话，我不报喜不报忧；每季度交一次思想汇报，写清楚做了什么、差在哪里。组织上是否发展我，我服从安排；但思想上的进步，不能等组织来催。","tip":"按思想、学业、服务、接受考察四层推进，每层配一件具体事加一条底线，避免通篇表态。"},{"id":"sub_03","cat":"dj","obj":["active"],"q":"怎样理解思想上入党先于组织上入党？","pts":["组织上入党是一次程序，思想上入党是一生课题","思想入党指信念、立场、宗旨意识真正到位","程序有期限，思想改造没有毕业的时候","警惕入党前拼命干、入党后松一半"],"a":"组织上入党，走的是申请、培养、政审、支部大会、宣誓、预备期、转正这套程序，时间节点清楚；思想上入党，是把党的理想信念、立场观点、宗旨意识真正装进心里，没有表格可填，也没有截止日期。\n为什么先？因为程序只能证明我愿意，思想才能决定我能不能一直愿意。入党誓词说为共产主义奋斗终身，随时准备为党和人民牺牲一切，这不是宣誓那一天的情绪，而是此后每一次选择的分量。思想上没到位，程序走完也只是挂了个名。\n现实中能看出差别。有人入党前抢着干活，转正后支部活动开始请假；有人把思想汇报写成流水账，回避自己的问题。反过来，真正思想入党的人，在没人看见的场合也守得住：评奖评优不伸手，同学有难肯搭手，被误解时不撂挑子。\n作为入党积极分子，我现在能做的是把这个先落到实处：理论学习不停、动机自省不断、小事上先让一步。组织上什么时候吸收我，由支部按程序决定；思想上够不够格，我自己每天都在被检验。","tip":"先分清程序和思想两种入党的差别，再用入党前拼命干、入党后松一半的反面现象论证必要性，最后回到自己当下能做的事。"},{"id":"sub_04","cat":"xy","obj":["active"],"q":"作为入党积极分子，怎样在校园生活中践行初心使命？","pts":["初心使命是为中国人民谋幸福、为中华民族谋复兴","校园里先守住学生本分，学风第一位","主动承担班级、支部、社团的服务性工作","在志愿服务和网络言行里体现党员样子"],"a":"党的初心使命是为中国人民谋幸福，为中华民族谋复兴。这话听着宏大，落到校园里却很具体：把身边同学的事当自己的事，把该我担的担子担稳。\n第一是守住学生本分。我读信息管理与信息系统，课上认真听、课下把课设做扎实，作业不抄、数据不编、报告不拼凑。学风是一个积极分子最容易被看见的地方，成绩单和课设质量比任何表态都硬。\n第二是接住服务性的事。班级学风互助小组我负责结对帮扶两位高数吃力的同学；支部主题党日的材料准备、活动签到我主动认领；学院迎新、图书馆整理、社区数字化助老这些志愿岗位，报名就去，不挑轻松的。\n第三是管住自己的言行。班级群里不转未经核实的消息，遇到情绪化的争论不跟风起哄，同学有实际困难时先问一句需要我做什么。初心不在口号里，就在这三件小事日复一日的重复里。","tip":"把为人民谋幸福翻译成校园语言：学风、服务、言行三条线各举一例，一定写出专业和具体岗位，别写成通用表态。"},{"id":"sub_05","cat":"xy","obj":["active","develop"],"q":"作为发展对象，如何在班级和支部中发挥先锋模范作用？","pts":["先锋模范作用是党章第三条写明的党员义务","学业上带头，把成绩和学风做成标杆","工作上带头，急难任务先接、责任先扛","作风上带头，守纪律、讲团结、能吃亏"],"a":"党章第三条把在生产、工作、学习和社会生活中起先锋模范作用写成党员的一项义务。发展对象离党员只差一步，这一步不是等着被发展，而是先按党员的样子干起来。\n学业上带头。信息管理类专业的课设、数据分析项目大多要组队，我固定做那个把进度表和分工表拉出来的人，遇到有人掉队就补位，不把不会当挡箭牌。班级平均绩点上去，比个人拿一次奖学金更有说服力。\n工作上带头。支部的主题党日、组织生活会、志愿服务，需要人干杂活时我先应；班里评奖评优、助学金材料审核这类容易得罪人的事，按规矩办、把依据摆清。急难任务不推，出了问题不躲。\n作风上带头。遵守校纪校规和支部纪律，会上有意见当面讲、会后不议论；同学之间起矛盾时做那个劝和的人。先锋模范不是头衔，是别人回头看的时候，发现你一直在。","tip":"三个带头各配一个可核查的动作，并点明党章第三条这个依据，比空谈先进性强。"},{"id":"sub_06","cat":"xy","obj":["active","develop"],"q":"结合专业学习（商学院信息管理类），谈谈青年学生如何把个人成长融入国家发展。","pts":["专业能力是国家发展需要的真本事","把课设和论文做在中国式现代化的真问题上","数据伦理与学术诚信同样是专业底色","到产业一线和基层去，把知识变成生产力"],"a":"我读信息管理与信息系统，学的是数据、系统和管理怎么咬合在一起。这个专业恰好卡在国家发展的一处关节上：二十届三中全会提出健全因地制宜发展新质生产力体制机制，教育、科技、人才一体推进，数字化、智能化正是新质生产力最活跃的部分。\n融入国家发展，第一步是把本事练真。数据库设计、数据分析、系统开发这些课，不能停在交作业。我在课程设计里选了社区养老服务数据台账这个题目，跑了两家社区，发现老人信息散在几张互不相通的表里，最后做出一套简易的录入与查询原型。题目很小，但让我第一次感到专业能解决真问题。\n第二步是守住专业底线。数据能做出好看的图，也能做出假的结论。学术诚信、数据伦理、隐私保护，是信息管理学生的职业底色。求真务实对我们就是：分析不挑对自己有利的样本，报告不写没跑过的结论。\n第三步是选对去处。国家需要人去产业一线、去基层、去卡脖子的地方。我打算毕业前把实习放到制造业或基层治理的数字化岗位上，先弄明白真实业务怎么运转，再谈个人发展。个人成长和国家需要同向，路才走得远。","tip":"别泛泛谈努力学习报效祖国，要给出一条专业、问题、底线、去处的链条，课设例子必须具体到题目。"},{"id":"sub_07","cat":"js","obj":["active","develop"],"q":"伟大长征精神的内涵是什么？新时代如何传承？","pts":["五条内涵分别对应信念、求是、团结、为民、奋斗","遵义会议是党的历史上生死攸关的转折点","每一代人有每一代人的长征路","传承落在信念、求实、团结、为民、奋斗五关"],"a":"伟大长征精神，总书记概括为五条：把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利；为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲；坚持独立自主、实事求是，一切从实际出发；顾全大局、严守纪律、紧密团结；紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。\n长征路上，1935年1月的遵义会议事实上确立了毛泽东同志在党中央和红军的领导地位，是党的历史上生死攸关的转折点；1936年10月红军三大主力在甘肃会宁和将台堡会师，长征胜利结束。征途上翻越十八座大山、跨过二十四条大河，靠的不是运气。\n新时代怎么传？总书记讲，每一代人有每一代人的长征路。今天的长征路是强国建设、民族复兴，是卡脖子技术、乡村振兴。没有雪山草地，但有硬仗要打；不必流血，但需要有人肯坐冷板凳。\n落到我身上，就是把五条拆成五关：信念关，理论学习不松劲；求实关，课设数据不修饰、结论不夸大；团结关，小组作业不甩锅；为民关，志愿去干真需要人的活；奋斗关，遇难课难项目不先想退。我这一程也得走实。","tip":"五条内涵按原文顺序背，别漏顾全大局和依靠人民；传承部分必须有每一代人有每一代人的长征路这句原话，再拆成自己能做的五件事。"},{"id":"sub_08","cat":"js","obj":["active","develop"],"q":"《榜样10》中的人物事迹给了你什么启示？","pts":["榜样是伟大建党精神在新时代的具体化身","茹振钢守麦田，守护国家粮食安全","梁建英攻高铁难题，体现科技自立自强","学榜样要内化于心、外化于行，落到具体事"],"a":"《榜样10》由中央组织部和中央广播电视总台联合制作，2026年1月20日在央视一套播出，集中展现五名党员和两个党支部的事迹，还安排了重温入党志愿书的环节。看的时候我最强烈的感受是：这些人岗位差得很远，但把事做到极致的劲头是一样的。\n茹振钢教授在麦田里守了四十多年，育成矮抗58等品种，推广面积超过四亿亩，把论文写在田野上，这是把国家粮食安全扛在肩上的样子。梁建英面对国外高铁技术封锁，带队啃下空气动力学、噪声控制这些世界级难题，让中国高铁从跟跑、并跑到领跑，这是科技自立自强的样子。\n冷晓琨从零起步做人形机器人，田野在贵州纳雍的乡镇里跑乡村振兴，罗胤在基层司法所守了二十年。他们身上共同的东西，是伟大建党精神在新时代的具体化：坚持真理、坚守理想，践行初心、担当使命。\n启示有两条。一是把大事拆成长事：榜样都不是靠一次爆发，是靠几十年不换方向。二是把榜样放回自己的坐标：我是商务信息学院的学生，眼下能做的就是课设不糊弄、志愿活动不缺席、答应同学的事跟到底。内化于心、外化于行，先从不装样子开始。","tip":"三段式：先总起点出共同点，再具体谈茹振钢和梁建英两人，最后落到自己的具体行动；重温入党志愿书这个节目形式要点一句，天然扣初心。"},{"id":"sub_09","cat":"sz","obj":["active","develop"],"q":"党的二十届五中全会聚焦全面从严治党，谈谈你的认识。","pts":["2026年10月审议通过全面从严治党《决定》","全面从严治党永远在路上，自我革命永远在路上","跳出历史周期率的两个答案是人民监督和自我革命","一体推进不敢腐、不能腐、不想腐"],"a":"党的二十届五中全会于2026年10月26日至29日在北京召开，审议通过《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。全会判断十四五圆满收官、十五五开局良好，同时把持之以恒四个字放进标题，这本身就是态度：从严治党不是一阵风。\n为什么必须常抓不懈？全会重申了两个答案：延安窑洞里毛泽东同志给出第一个答案，让人民来监督政府；经过百年奋斗特别是新时代实践，党给出第二个答案，自我革命。这是中国共产党区别于其他政党的显著标志，也是跳出治乱兴衰历史周期率的独特创造。\n《决定》的中心线索是健全全面从严治党体系。体系意味着不靠运动式整治，而是把教育、制度、监督、执纪贯通起来：一体推进不敢腐、不能腐、不想腐，正风肃纪，把政治纪律和政治规矩摆在首位。全会还部署树立和践行正确政绩观学习教育，说明作风问题的根子在政绩观。\n对我这个发展对象，从严治党的第一课是守纪律。支部开会不迟到、材料不注水、思想汇报不套模板；评奖评优按规则来，不打听不递话。纪律是党的事业取得胜利的保证，我要在自己身上先立起这条线。","tip":"记住会议时间、文件名和持之以恒这个题眼，用两个答案解释必要性，最后必须落到自己的纪律要求，否则容易写成社论。"},{"id":"sub_10","cat":"sz","obj":["active","develop"],"q":"结合中国式现代化的中国特色和本质要求，谈谈青年一代的担当。","pts":["五大特征突出人口规模巨大与共同富裕","本质要求第一条是坚持中国共产党领导","青年是现代化建设的生力军和突击队","担当要落到专业本领和基层一线"],"a":"中国式现代化是人口规模巨大的现代化，是全体人民共同富裕的现代化，是物质文明和精神文明相协调的现代化，是人与自然和谐共生的现代化，是走和平发展道路的现代化。这五条不是形容词，是十四亿人规模下的实际约束：资源要省着用，成果要大家分，路要自己走。\n本质要求里，第一条是坚持中国共产党领导，接着是坚持中国特色社会主义、实现高质量发展、发展全过程人民民主、丰富人民精神世界、实现全体人民共同富裕、促进人与自然和谐共生、推动构建人类命运共同体、创造人类文明新形态。青年要担当，先得知道自己在为哪件事出力。\n担当不是表态，是接得住活。这个事业还要走几十年，主力必然是今天二三十岁的人。我读信息管理，能看到的具体战场有三个：产业数字化、基层治理的数据化、公共服务的适老化改造。\n所以我把规划定得实一点：在校把数据分析与系统开发的底子打牢，参加一次真实的企业或社区数字化项目；毕业后先去一线岗位，把业务摸清再谈创新。我这一代人赶上的是十五五开局和2035年的节点，做多做少，账上都记着。","tip":"五大特征与本质要求要分开说，别混成一锅；青年担当一定要有接得住活的具体路径，否则容易空。"},{"id":"sub_11","cat":"ll","obj":["active","develop"],"q":"结合党章，谈谈党员义务与权利的关系。","pts":["八项义务、八项权利分别见于党章第三、四条","义务在前，权利是为更好履行义务服务的","没有无义务的权利，也没有无权利的义务","任何一级组织直至中央都无权剥夺党员权利"],"a":"党章第三条列了党员八项义务，第四条列了八项权利。义务排在前面不是编排顺序的偶然：入党誓词里履行党员义务先于其他承诺，说明党员身份首先是一份责任。\n两者是统一体。义务为权利定方向：有了坚持党和人民的利益高于一切、吃苦在前享受在后，表决权、选举权才不会被用成谋私的工具。权利为义务作保障：没有批评权、建议权、申辩权，党员就没法真正参与党内事务，也没法监督组织和其他党员，切实开展批评和自我批评就会落空。\n党章特别写明，任何一级组织直至中央都无权剥夺党员的上述权利。这一条是保护性的：权利不是恩赐，是党内民主的制度安排。同时权利也有边界，对党的决议政策有不同意见，必须在坚决执行的前提下声明保留，不能会上不说、会后乱说。\n对我而言，现在还没有党员权利，但可以先按党员的样子尽义务：学习不走过场，班级和支部的事肯担，看到问题敢提、提了负责。等真的有了表决权和选举权，我得对得起手里这一票。","tip":"先讲清义务在前这个排序的含义，再双向论证义务定方向、权利作保障，最后引无权剥夺和坚决执行的前提两句原文收口。"},{"id":"sub_12","cat":"ll","obj":["active","develop"],"q":"如何理解两个确立的决定性意义？","pts":["两个确立：确立核心地位、确立指导思想指导地位","是十九届六中全会《决议》作出的重大政治论断","对新时代党和国家事业发展具有决定性意义","做到两个维护是最高政治原则和根本政治规矩"],"a":"两个确立是党的十九届六中全会《历史决议》作出的重大政治论断：确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位。前者解决靠谁领，后者解决按什么干。\n决定性意义从实践里来。新时代十年，党面临形势环境的复杂性和严峻性、肩负任务的繁重性和艰巨性世所罕见、史所罕见，之所以能办成脱贫攻坚、全面建成小康社会这些大事，能有力应对各种风险挑战，根本在于有核心领航、有科学理论指引。核心领航，全党才有主心骨；理论指引，行动才有定盘星。\n两个确立是政治保证和思想保证的统一。核心地位不是个人崇拜，是民主集中制下全党全国各族人民共同意志的凝聚；指导地位不是教条，是马克思主义中国化时代化的最新成果，六个必须坚持就是它的世界观和方法论。二者相互支撑，缺一则组织涣散或方向迷失。\n做到两个维护是最高政治原则和根本政治规矩。对我这样的发展对象，具体化为三条：理论学习跟进不落后，重大是非面前立场清楚不含糊，日常和网络言行不传播与党中央不一致的声音。政治上的坚定，先从嘴上和手上守住。","tip":"分三层：是什么、为什么有决定性（新时代十年的实践检验）、怎么落实（两个维护的具体化）；注意区分核心地位与指导地位各自解决的问题。"}],"profiles":{"active":{"label":"入党积极分子","lede":"积极分子先弄明白“我是谁、我为什么入党”。党章、政治基础概念、入党动机三块打底，时政跟上最新即可。","note":"重点：党章 · 政治基础概念 · 入党动机","mix":{"1":13,"2":5,"3":2},"focus":["dz","jcgn","rzsd","fz","jjjc","esd","czjx","kz80"],"tips":["先把党章总纲和入党条件背熟，其他模块的判断题多半从这里长出来。","错题要重做两遍才算过，别只看解析。"]},"develop":{"label":"发展对象","lede":"发展对象要能对上流程和时间节点。发展党员细则、五中全会、六大思想是这次的硬骨头，时政占比更高。","note":"重点：发展党员细则 · 五中全会 · 六大思想","mix":{"1":10,"2":7,"3":3},"focus":["fz","fzqh","xd6","szqh","ssqh","jjjc","dz","zwgm"],"tips":["流程题的硬数字（天数、人数、比例、期限）必须精确到个位。","时政题交给最新文件，别用旧口径。"]}}}
</script>
<script>
(function () {
"use strict";
/**
 * store.js — 本地进度。所有键带版本前缀，清空只清自己的键。
 */
const KEY = 'rdks.v2';
const DEFAULT = {
  who: null,          // 'active' | 'develop'
  theme: 'light',     // 'light' | 'dark'
  seen: {},           // qid -> { n, ok, at }
  wrong: {},          // qid -> { n, at }
  selfEval: {},       // qid -> 'know' | 'fuzzy' | 'no'
  days: [],           // ['2026-11-09', ...]
  last: null,         // 继续上次：{ mode, moduleId, ids, i, answers }
  exams: [],          // [{ at, total, right }]
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { ...DEFAULT };
    const saved = JSON.parse(raw);
    return {
      ...DEFAULT,
      ...saved,
      seen: saved.seen || {},
      wrong: saved.wrong || {},
      selfEval: saved.selfEval || {},
      days: Array.isArray(saved.days) ? saved.days : [],
      exams: Array.isArray(saved.exams) ? saved.exams : [],
    };
  } catch (e) {
    return { ...DEFAULT };
  }
}

function save(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    /* 隐私模式或配额满：静默失败，不影响答题 */
  }
}

function reset() {
  try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
}

function today() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/** 记录今天学习过：连续天数 = 从今天往前相邻的天数 */
function touchDay(state) {
  const t = today();
  if (state.days.includes(t)) return state.days.length;
  state.days.push(t);
  state.days.sort();
  if (state.days.length > 120) state.days = state.days.slice(-120);
  return streak(state.days, t);
}

function streak(days) {
  if (!days.length) return 0;
  const t = today();
  const set = new Set(days);
  if (!set.has(t)) return 0;
  let n = 0;
  const d = new Date();
  for (;;) {
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (!set.has(key)) break;
    n += 1;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/** 站内二次确认，替掉 window.confirm */
function confirmBox(title, body, okText = '确认') {
  return new Promise((resolve) => {
    const modal = $('#modal');
    const prev = document.activeElement;
    $('#modal-title').textContent = title;
    $('#modal-body').textContent = body;
    $('[data-act="modal-ok"]', modal).textContent = okText;
    modal.hidden = false;
    $('[data-act="modal-cancel"]', modal).focus();

    const done = (val) => {
      modal.hidden = true;
      modal.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
      if (prev && prev.focus) prev.focus();
      resolve(val);
    };
    const onClick = (e) => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'modal-ok') done(true);
      else if (act === 'modal-cancel') done(false);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); done(false); }
    };
    modal.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
  });
}

function ring(frac, label) {
  const r = 20;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, frac)));
  return `<div class="ring" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle class="ring-bg" cx="26" cy="26" r="${r}" fill="none" stroke-width="3"/>
      <circle class="ring-fg" cx="26" cy="26" r="${r}" fill="none" stroke-width="3"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 26 26)"/>
      <text class="ring-text" x="26" y="30" text-anchor="middle">${esc(label)}</text>
    </svg>
  </div>`;
}

/* ---------------------------------------------------------------- home */
function viewHome() {
  if (!state.who) return viewIdentity();

  const pool = bank.questions.filter(relevant);
  const seen = pool.filter((q) => state.seen[q.id]).length;
  const wrongN = Object.keys(state.wrong).filter((id) => QBY.has(id)).length;
  const days = streak(state.days);
  const pct = pool.length ? seen / pool.length : 0;
  const last = state.last && state.last.ids?.length ? state.last : null;
  const lastQ = last ? QBY.get(last.ids[last.i]) : null;
  const todo = Math.max(0, pool.length - seen);
  const subjN = subjOf().length;

  const rows = [];
  if (lastQ) {
    rows.push(`<button class="today-row" data-act="resume">
      <span class="today-no">01</span>
      <span class="today-main">
        <span class="today-title" style="display:block">继续上次</span>
        <span class="today-sub">${esc(modName(lastQ.m))} · 第 ${last.i + 1} / ${last.ids.length} 题</span>
      </span>
      <span class="today-go">接着做</span>
    </button>`);
  } else {
    const mustN = pool.filter((q) => q.lv === 1).length;
    rows.push(`<button class="today-row" data-act="start-lv" data-lv="1">
      <span class="today-no">01</span>
      <span class="today-main">
        <span class="today-title" style="display:block">从必考核心开始</span>
        <span class="today-sub">按模块顺序，先做 ${mustN} 道必考题</span>
      </span>
      <span class="today-go">开始</span>
    </button>`);
  }
  rows.push(`<button class="today-row" data-act="go-wrong">
    <span class="today-no">02</span>
    <span class="today-main">
      <span class="today-title" style="display:block">${wrongN ? `错题 ${wrongN} 道` : '错题本是空的'}</span>
      <span class="today-sub">${wrongN ? `重练一遍，连续答对两次才移出` : '做错的题会自动收进来'}</span>
    </span>
    <span class="today-go">${wrongN ? '重练' : '去看看'}</span>
  </button>`);
  rows.push(`<button class="today-row" data-act="start-exam">
    <span class="today-no">03</span>
    <span class="today-main">
      <span class="today-title" style="display:block">模考 20 题</span>
      <span class="today-sub">必考优先，交卷后给分与逐题解析</span>
    </span>
    <span class="today-go">开考</span>
  </button>`);
  rows.push(`<button class="today-row" data-act="go-essay">
    <span class="today-no">04</span>
    <span class="today-main">
      <span class="today-title" style="display:block">${subjN} 道问答题</span>
      <span class="today-sub">背要点，看示例答案，答“怎样在校园里做”</span>
    </span>
    <span class="today-go">去背</span>
  </button>`);

  const syl = bank.syllabus?.[state.who === 'develop' ? 'develop' : 'active'];

  view().innerHTML = `
    <div class="home-top">
      <div class="home-lead">
        <section class="hero">
          <p class="kicker">今日 · ${esc(whoLabel())} ${whoSwitch()}</p>
          <h1>${days > 1 ? `第 ${days} 天，接着读。` : '今天也读三页。'}</h1>
          <p class="lede">${esc(prof().lede || '必考先过硬，重点再补齐；时政放最后，按周更新。')}</p>
        </section>
        <div class="record">
          <span class="record-tag">学员档案</span>
          <div class="record-body">
            <div class="stamp" aria-hidden="true">${ring(pct, Math.round(pct * 100) + '%')}</div>
            <div class="record-fields">
              <div class="record-field"><span class="k">已读</span><span class="v">${seen}<small>/${pool.length}</small></span></div>
              <div class="record-field"><span class="k">错题</span><span class="v">${wrongN}<small>道</small></span></div>
              <div class="record-field"><span class="k">连续</span><span class="v">${days}<small>天</small></span></div>
              <div class="record-field"><span class="k">问答</span><span class="v">${subjN}<small>篇</small></span></div>
            </div>
          </div>
          <p class="record-foot">${esc(prof().note || '')}　进度只记在本机浏览器，换设备不跟随。</p>
        </div>
      </div>
      <div class="home-today">
        <div class="section-head" style="margin:0 0 12px">
          <h2 style="font-size:20px">今日任务</h2><span class="count">四件事，二十分钟</span>
        </div>
        <div class="today" style="margin-top:0">${rows.join('')}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>三阶段路线</h2><span class="count">${esc(whoLabel())}</span></div>
      ${(syl?.stages || []).map((st, i) => `
        <div class="stage">
          <div class="stage-no">阶段 ${pad2(i + 1)}</div>
          <div class="stage-body">
            <h3>${esc(st.name)}</h3>
            <p class="small muted" style="margin:4px 0 0">${esc(st.goal)}</p>
            <div class="stage-mods">${(st.modules || []).map((m) => `<span class="tag">${esc(modName(m))}</span>`).join('')}</div>
            <button class="btn btn-ghost" style="margin-top:12px" data-act="start-stage" data-i="${i}">从这阶段开始</button>
          </div>
        </div>`).join('')}
    </div>

    <div class="section">
      <div class="section-head"><h2>本机进度</h2><span class="count">只存在这台设备</span></div>
      <p class="small muted">已做 ${seen} 题、错题 ${wrongN} 道、连续 ${days} 天。换设备或清缓存会归零。</p>
      <button class="btn-quiet" data-act="wipe">清除本机进度</button>
    </div>`;
}

function viewLearn() {
  const groups = { 1: [], 2: [], 3: [] };
  bank.modules.forEach((m) => { (groups[m.priority] || groups[2]).push(m); });

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">学 · 知识点与记忆卡 ${whoSwitch()}</p>
      <h1>按紧急度读</h1>
      <p class="lede">必考是底线，重点拉分，拓展只求眼熟。每个模块里先看要点，再过记忆卡。</p>
    </section>
    ${[1, 2, 3].map((p) => {
      const ms = groups[p];
      if (!ms.length) return '';
      const title = { 1: '必考核心', 2: '重点掌握', 3: '时政拓展' }[p];
      const sub = { 1: '考试必出，先全部拿下', 2: '拉开差距的部分', 3: '考前一周过一遍即可' }[p];
      return `<div class="section">
        <div class="section-head"><h2>${title}</h2><span class="count">${sub}</span></div>
        <div class="list">
          ${ms.map((m) => {
            const n = bank.questions.filter((q) => q.m === m.id && relevant(q)).length;
            const c = CARDS.filter((x) => x.m === m.id).length;
            if (!n) return '';
            return `<a class="row" href="#/learn/${m.id}">
              <span class="row-main">
                <span class="row-title" style="display:block">${esc(m.name)}</span>
                <span class="row-sub"><span>${n} 题</span><span>${c} 张卡</span><span>${m.tags?.slice(0, 2).join(' · ') || ''}</span></span>
              </span>
              <span class="row-arrow" aria-hidden="true">→</span>
            </a>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}

    <div class="section">
      <div class="section-head"><h2>应知应会</h2><span class="count">${bank.essentials.length} 条</span></div>
      ${['lj', 'zc', 'sz', 'rd'].map((c) => {
        const list = bank.essentials.filter((e) => e.c === c);
        if (!list.length) return '';
        return `<div class="pt-group">
          <h3>${CAT[c] || c}</h3>
          ${list.map((e) => `<div class="plain-row"><div class="body">
            <div style="font-size:14px;color:var(--ink-2)">${esc(e.f)}</div>
            <div style="font-size:14px;margin-top:2px">${esc(e.b)}</div>
          </div></div>`).join('')}

function viewModule(mid) {
  const m = MOD.get(mid);
  if (!m) { location.hash = '#/learn'; return; }
  const qs = bank.questions.filter((q) => q.m === mid && relevant(q));
  const cards = CARDS.filter((c) => c.m === mid);
  const pts = bank.points[mid] || [];
  const done = qs.filter((q) => state.seen[q.id]).length;

/* ---------------------------------------------------------------- runner */
function currentQ() {
  if (!session) return null;
  return QBY.get(session.ids[session.i]) || null;
}
function answeredNow() {
  return !!(session && session.answers[session.i]?.done);
}
function isExam() {
  return session?.mode === 'exam';
}

function startSession(mode, ids, moduleId = null) {
  ids = ids.filter((id) => QBY.has(id));
  if (!ids.length) { toast('这里还没有题'); return; }
  session = { mode, moduleId, ids, i: 0, answers: {}, startedAt: Date.now() };
  persistSession();
  viewRunner();
}

function persistSession() {
  if (!session || session.mode === 'exam') return;
  state.last = {
    mode: session.mode,
    moduleId: session.moduleId,
    ids: session.ids.slice(0, 60),
    i: session.i,
    answers: session.answers,
    startedAt: session.startedAt,
  };
  save(state);
}

function viewRunner() {
  if (!session) { location.hash = '#/'; return; }
  const q = currentQ();
  if (!q) { session = null; location.hash = '#/'; return; }
  renderChrome();

  const answered = answeredNow();
  const a = session.answers[session.i] || {};
  const picked = a.picked;
  const n = session.ids.length;
  const pct = ((session.i + (answered ? 1 : 0)) / n) * 100;
  const exam = isExam();

  const head = `
    <div class="runner-head">
      <button class="btn-quiet" data-act="quit">退出</button>
      <div class="runner-progress">
        <div class="runner-count">${exam ? '模考' : '练习'} · 第 ${session.i + 1} / ${n} 题</div>
        <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      </div>
      <div class="runner-count">${esc(modName(q.m))}</div>
    </div>`;

  const meta = `<div class="qmeta">
    <span class="tag">${TYPE[q.t] || q.t}</span>${freqTag(q.lv)}
    ${(q.obj || []).map(objTag).join('')}
  </div>`;

  view().innerHTML = `${head}${meta}
    <h2 class="qstem">${esc(q.q)}</h2>
    ${optsHTML(q, picked, answered, exam)}
    ${feedbackHTML(q, picked, a, answered, exam)}
    ${exam ? `<div class="runner-foot">
      <span class="kbd-hint">已答 ${Object.values(session.answers).filter((x) => x && x.done).length} / ${n} 题</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost" data-act="prev" ${session.i === 0 ? 'disabled' : ''}>上一题</button>
      <button class="btn btn-primary" data-act="next">${session.i + 1 >= n ? '交卷' : '下一题'}</button>
    </div>` : ''}`;

  if (q.t === 'fill' && !answered) {
    const input = $('#fill-in');
    if (input) input.focus();
  }
  persistSession();
}

function optsHTML(q, picked, answered, exam) {
  const reveal = answered && !exam;

  if ((q.t === 'single' || q.t === 'multi') && q.o && q.o.length) {
    const multi = q.t === 'multi';
    const sel = Array.isArray(picked) ? picked : [];
    const body = q.o.map((text, idx) => {
      let cls = '';
      let mk = '';
      if (multi) {
        if (!reveal && sel.includes(idx)) cls += ' is-picked';
      } else if (!reveal && picked === idx) {
        cls += ' is-picked';
      }
      if (reveal) {
        const right = multi ? (Array.isArray(q.a) && q.a.includes(idx)) : idx === q.a;
        if (right) { cls += ' is-ok'; mk = '<span class="mk" style="color:var(--jade)">正确</span>'; }
        else if (multi ? sel.includes(idx) : picked === idx) { cls += ' is-no'; mk = '<span class="mk" style="color:var(--danger)">你的选择</span>'; }
      }
      return `<button class="opt${cls}" data-act="pick" data-i="${idx}" ${reveal ? 'disabled' : ''}>
        <span class="key" aria-hidden="true">${'ABCD'[idx]}</span><span class="txt">${esc(text)}</span>${mk}</button>`;
    }).join('');

    const confirm = (multi && !answered && sel.length)
      ? `<button class="btn btn-primary btn-block" data-act="confirm-multi" style="margin-top:12px">确认（已选 ${sel.length} 项）</button>` : '';
    return `<div class="opts">${body}</div>${confirm}
      ${multi ? '<p class="qnote">多选题：选全才得分，漏选、错选都算错。</p>' : ''}`;
  }

  if (q.t === 'judge') {
    const mk = (val) => {
      if (isExam()) return picked === val ? ' is-picked' : '';
      if (answered) return q.a === val ? ' is-ok' : (picked === val ? ' is-no' : '');
      return picked === val ? ' is-picked' : '';
    };
    return `<div class="judge-row">
      <button class="opt${mk(true)}" data-act="pick" data-i="1" ${answered && !exam ? 'disabled' : ''}>正确</button>
      <button class="opt${mk(false)}" data-act="pick" data-i="0" ${answered && !exam ? 'disabled' : ''}>错误</button>
    </div>`;
  }

  if (q.t === 'fill') {
    return `<input class="fill-input" id="fill-in" value="${esc(picked || '')}"
        placeholder="填写答案，按 Enter 提交" aria-label="填空答案" ${answered && !exam ? 'disabled' : ''}>
      ${answered ? '' : '<div class="chips" style="margin-top:12px"><button class="btn btn-primary" data-act="submit-fill">提交</button></div>'}`;
  }

  if (q.t === 'short') {
    const body = `<textarea class="fill-input" id="fill-in" rows="5" placeholder="先自己写一遍要点，再对照参考答案自评"
        aria-label="简答草稿" ${answered ? 'disabled' : ''}>${esc(picked || '')}</textarea>
      ${answered ? '' : '<div class="chips" style="margin-top:12px"><button class="btn btn-primary" data-act="show-answer">看参考答案</button></div>'}`;
    return body;
  }
  return '';
}

function feedbackHTML(q, picked, a, answered, exam) {
  if (!answered) return '';
  if (exam) return '';

  const ok = a.ok === true;
  const verdict = q.t === 'short'
    ? (a.ok === null || a.ok === undefined ? '对照参考答案，给自己一个判断' : (ok ? '自评：会' : (state.selfEval[q.id] === 'fuzzy' ? '自评：模糊' : '自评：不会')))
    : (ok ? '回答正确' : '回答错误');

  let answerLine = '';
  if (q.t === 'single') answerLine = `正确答案 ${'ABCD'[q.a]}. ${esc(q.o[q.a] || '')}`;
  else if (q.t === 'multi') answerLine = `正确答案 ${(q.a || []).map((i) => 'ABCD'[i]).join('、')}`;
  else if (q.t === 'judge') answerLine = `正确答案 ${q.a ? '正确' : '错误'}`;
  else if (q.t === 'fill') answerLine = `参考答案：${esc(Array.isArray(q.a) ? q.a.join(' / ') : q.a)}`;
  else if (q.t === 'short') answerLine = `参考答案：${esc(q.a)}`;

  const selfEval = q.t === 'short' ? `<div class="self-eval" role="group" aria-label="自评">
      ${[['know', '会'], ['fuzzy', '模糊'], ['no', '不会']].map(([v, t]) =>
        `<button class="btn ${state.selfEval[q.id] === v ? 'btn-primary' : 'btn-ghost'}" data-act="self" data-v="${v}">${t}</button>`).join('')}
    </div>` : '';

  const nextLabel = session.i + 1 >= session.ids.length ? (isExam() ? '交卷' : '完成本轮') : '下一题';

  return `<div class="feedback">
    <div class="verdict ${ok ? 'ok' : (q.t === 'short' && a.ok === null ? '' : 'no')}">${verdict}${ok ? '' : (q.t === 'short' && a.ok === null ? '' : ' · ' + answerLine)}</div>
    ${ok && q.t !== 'short' ? `<p class="small muted" style="margin:0 0 8px">${answerLine}</p>` : ''}
    <p class="explain">${esc(q.e || '')}${q.src ? `<span class="src">出处：${esc(q.src)}</span>` : ''}</p>
    ${q.t === 'short' ? `<p class="explain" style="margin-top:8px">${answerLine}</p>${selfEval}` : ''}
    <div class="runner-foot">
      <span class="kbd-hint">键盘 1–4 选项 · Enter 下一题</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" data-act="next">${nextLabel}</button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- scoring */
function norm(s) {
  return String(s ?? '').replace(/[\s，。、；：""''（）()《》·,.;:!?！？—\-]/g, '').toLowerCase();
}

function check(q, picked) {
  if (picked == null) return false;
  if (q.t === 'judge') return Number(Boolean(picked)) === Number(Boolean(q.a));
  if (q.t === 'single') return picked === q.a;
  if (q.t === 'multi') {
    const a = (q.a || []).slice().sort().join(',');
    const p = (picked || []).slice().sort().join(',');
    return a === p && a !== '';
  }
  if (q.t === 'fill') {
    const inp = norm(picked);
    if (!inp) return false;
    const list = Array.isArray(q.a) ? q.a : String(q.a).split(/[、，,；;/]/);
    return list.some((raw) => {
      const an = norm(raw);
      if (!an) return false;
      if (inp === an) return true;
      if (inp.includes(an)) return true;
      return inp.length >= 3 && an.includes(inp);
    });
  }
  return false;
}

function commit(picked, ok) {
  const q = currentQ();
  if (!q || !session) return;
  session.answers[session.i] = { picked, ok, done: true };

  if (!isExam()) {
    const prev = state.seen[q.id];
    state.seen[q.id] = { n: (prev?.n || 0) + 1, ok, at: Date.now() };
    if (ok) {
      // 错题要连续答对两次才移出，避免蒙对一次就消失
      const w = state.wrong[q.id];
      if (w) {
        w.ok = (w.ok || 0) + 1;
        if (w.ok >= 2) delete state.wrong[q.id];
        else w.at = Date.now();
      }
    } else {
      state.wrong[q.id] = { n: (state.wrong[q.id]?.n || 0) + 1, ok: 0, at: Date.now() };
    }
    touchDay(state);
    save(state);
  }

  announce(ok ? '回答正确' : '回答错误，正确答案已标出');
  viewRunner();
}

function nextQ() {
  if (!session) return;
  // 模考里填空/简答没有“提交”动作，翻页时把草稿收进答案
  if (isExam()) {
    const q = currentQ();
    const box = $('#fill-in');
    if (q && box && (q.t === 'fill' || q.t === 'short') && !session.answers[session.i]?.picked) {
      const v = box.value.trim();
      if (v) session.answers[session.i] = { picked: v, done: true };
    }
  }
  if (isExam() && session.i + 1 >= session.ids.length) return submitExam();
  if (session.i + 1 >= session.ids.length) return finishQuiz();
  session.i += 1;
  persistSession();
  viewRunner();
}

function finishQuiz() {
  const total = session.ids.length;
  const right = Object.values(session.answers).filter((x) => x && x.ok === true).length;
  const answered = Object.values(session.answers).filter((x) => x && x.done).length;
  const mode = session.mode;
  session = null;
  state.last = null;
  save(state);
  activeTab = mode === 'wrong' ? 'wrong' : 'practice';
  renderChrome();

  view().innerHTML = `
    <section style="padding-top:32px">
      <p class="kicker">本轮结束</p>

/* ---------------------------------------------------------------- exam */
function pickExamIds() {
  // 简答题无法自动判分，模考只出可判题型
  const pool = bank.questions.filter((q) => relevant(q) && q.t !== 'short');
  const byPrio = { 1: [], 2: [], 3: [] };
  pool.forEach((q) => { (byPrio[MOD.get(q.m)?.priority || 2]).push(q); });
  const mix = prof().mix || { 1: 13, 2: 5, 3: 2 };
  const out = [];
  [1, 2, 3].forEach((p) => { out.push(...shuffle(byPrio[p]).slice(0, mix[p] || 0)); });
  const rest = shuffle(pool.filter((q) => !out.includes(q)));
  while (out.length < 20 && rest.length) out.push(rest.shift());
  return shuffle(out).map((q) => q.id).slice(0, 20);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 刷题顺序：客观题先上，简答放最后，组内仍随机 */
const TYPE_ORDER = { single: 0, multi: 1, judge: 2, fill: 3, short: 4 };
function orderByType(list) {
  const buckets = {};
  for (const q of list) (buckets[q.t] || (buckets[q.t] = [])).push(q.id);
  return Object.keys(TYPE_ORDER)
    .flatMap((t) => shuffle(buckets[t] || []));
}

function submitExam() {
  const s = session;
  const rows = [];
  let right = 0;
  s.ids.forEach((id, i) => {
    const q = QBY.get(id);
    const picked = s.answers[i]?.picked;
    const ok = check(q, picked);
    if (ok) right += 1;
    rows.push({ q, picked, ok });
  });
  state.exams = [...(state.exams || []), { at: Date.now(), total: s.ids.length, right }].slice(-20);
  touchDay(state);
  save(state);
  session = null;
  viewExamResult(rows, right, s.ids.length);
}

function viewExamResult(rows, right, total) {
  activeTab = 'exam';
  renderChrome();
  const score = Math.round((right / total) * 100);
  const answerOf = (q) => {
    if (q.t === 'single') return `${'ABCD'[q.a]}. ${q.o[q.a] || ''}`;
    if (q.t === 'multi') return (q.a || []).map((i) => 'ABCD'[i]).join('、');
    if (q.t === 'judge') return q.a ? '正确' : '错误';
    return Array.isArray(q.a) ? q.a.join(' / ') : q.a;
  };
  const pickedOf = (q, p) => {
    if (p == null) return '未作答';
    if (q.t === 'single') return `${'ABCD'[p]}. ${q.o[p] || ''}`;
    if (q.t === 'multi') return (p || []).map((i) => 'ABCD'[i]).join('、');
    if (q.t === 'judge') return p ? '正确' : '错误';
    return String(p);
  };

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">交卷 · ${esc(whoLabel())}</p>
      <h1>${score >= 90 ? '稳了，保持手感。' : score >= 70 ? '基本盘在，细节要补。' : '先回知识点，再来一遍。'}</h1>
      <div class="score"><b>${score}</b><span>分 · 答对 ${right} / ${total}</span></div>
      <div class="chips" style="margin-top:20px">
        <button class="btn btn-primary" data-act="start-exam">再考一次</button>
        <a class="btn btn-ghost" href="#/wrong">看错题本</a>
        <a class="btn btn-ghost" href="#/">回首页</a>
      </div>
    </section>
    <div class="section">
      <div class="section-head"><h2>逐题解析</h2><span class="count">错的先看</span></div>
      ${rows.map(({ q, picked, ok }, i) => `<div class="review-item ${ok ? 'ok' : 'no'}">
        <div class="review-q">${i + 1}. ${esc(q.q)}</div>
        <div class="review-line">你的答案：<b>${esc(pickedOf(q, picked))}</b></div>
        <div class="review-line">正确答案：<b>${esc(answerOf(q))}</b></div>
        <div class="review-line" style="margin-top:4px">${esc(q.e || '')}${q.src ? ` · 出处：${esc(q.src)}` : ''}</div>
      </div>`).join('')}
    </div>`;
}

/* ---------------------------------------------------------------- wrong */
function viewWrong() {
  const ids = Object.keys(state.wrong).filter((id) => QBY.has(id) && relevant(QBY.get(id)));
  const rows = ids.sort((a, b) => (state.wrong[b].at || 0) - (state.wrong[a].at || 0));

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">错 · 错题本</p>
      <h1>${rows.length ? `${rows.length} 道待重练` : '错题本是空的'}</h1>
      <p class="lede">${rows.length ? '连续答对两次才移出，只蒙对一次不算；也可以直接移除不想再看的题。' : '做错的题会自动收进来，连续答对两次才移出。'}</p>
      ${rows.length ? `<div class="chips" style="margin-top:20px">
        <button class="btn btn-primary" data-act="retry-all">重练全部 ${rows.length} 题</button>
        <button class="btn-quiet" data-act="clear-wrong">清空错题本</button>
      </div>` : ''}
    </section>
    ${rows.length ? `<div class="list">
      ${rows.map((id) => {
        const q = QBY.get(id);
        return `<div class="plain-row">
          <div class="body">
            <div class="row-title" style="font-size:15px">${esc(q.q)}</div>
            <div class="row-sub"><span>${esc(modName(q.m))}</span><span>${TYPE[q.t]}</span><span>错 ${state.wrong[id].n || 1} 次</span></div>
          </div>
          <button class="btn btn-ghost" data-act="retry-one" data-id="${id}">重练</button>
          <button class="icon-btn" data-act="drop-wrong" data-id="${id}" aria-label="从错题本移除">✕</button>
        </div>`;
      }).join('')}
    </div>` : `<div class="empty" style="margin-top:24px">
      <p>还没有错题。先去练十道，错的会自动留在这里。</p>
      <a class="btn btn-ghost" href="#/practice">去练题</a>
    </div>`}`;
}

/* ---------------------------------------------------------------- search */
function viewSearch(q) {
  const query = (q || '').trim();
  const hits = query ? bank.questions.filter((x) =>
    relevant(x) && (x.q.includes(query) || (x.e || '').includes(query) || (x.o || []).some((o) => o.includes(query)))
  ).slice(0, 40) : [];

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">搜 · 题干与解析</p>
      <h1>查一句话</h1>
      <div style="display:flex;gap:8px;margin-top:16px">
        <input class="fill-input" id="search-in" value="${esc(query)}" placeholder="比如：预备期、六大纪律、十五五" aria-label="搜索关键词">
        <button class="btn btn-primary" data-act="do-search">搜索</button>
      </div>
      ${query ? `<p class="small muted" style="margin-top:12px">“${esc(query)}”命中 ${hits.length} 题${hits.length >= 40 ? '（只显示前 40 条）' : ''}</p>` : '<p class="small muted" style="margin-top:12px">输入关键词，题干、选项与解析都会匹配。</p>'}
    </section>
    <div class="list">
      ${hits.map((x) => `<button class="row" data-act="open-q" data-id="${x.id}">
        <span class="row-main">
          <span class="row-title" style="display:block">${esc(x.q)}</span>
          <span class="row-sub"><span>${esc(modName(x.m))}</span><span>${TYPE[x.t]}</span></span>
        </span>
        <span class="row-arrow" aria-hidden="true">→</span>
      </button>`).join('')}
    </div>`;
  const input = $('#search-in');
  if (input && !query) input.focus();
}

/* ---------------------------------------------------------------- essay */
function viewSubj() {
  const all = subjOf();
  const cur = viewSubj._cat || 'all';
  const list = cur === 'all' ? all : all.filter((s) => s.cat === cur);
  const tips = prof().tips || [];

  view().innerHTML = `
    <section style="padding-top:24px">
      <p class="kicker">问 · 问答题与论述 ${whoSwitch()}</p>
      <h1>先背要点，<br>再写自己的话。</h1>
      <p class="lede">${all.length} 篇。每题给 4 条采分点和一篇示范答案，考场上先列点再展开，300–400 字就够。答案里的“落到自身”按信息管理与信息系统专业写的，可以照结构换成你自己的事。</p>
      ${tips.length ? `<ul class="subj-tips">${tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    </section>
    <div class="chips" role="group" aria-label="按主题筛选">
      ${[['all', '全部'], ...Object.entries(CATS)].map(([k, t]) => `<button class="chip" data-act="subj-cat" data-v="${k}" aria-pressed="${cur === k}">${t}</button>`).join('')}
    </div>
    <div class="subj-list">
      ${list.map((s) => `<article class="subj">
        <div class="subj-head">
          <span class="tag tag-must">${CATS[s.cat] || s.cat}</span>
          <span class="tag">采分点 ${s.pts.length} 条</span>
          <span class="tag">${s.a.length} 字</span>
        </div>
        <h3 class="subj-q">${esc(s.q)}</h3>
        <ol class="subj-pts">${(s.pts || []).map((p) => `<li>${esc(p)}</li>`).join('')}</ol>
        <button class="btn btn-ghost subj-toggle" data-act="subj-toggle" aria-expanded="false">看示范答案</button>
        <div class="subj-ans" hidden>${esc(s.a)}</div>
      </article>`).join('') || `<div class="empty"><p>这个主题下暂时没有题。</p><button class="btn btn-ghost" data-act="subj-cat" data-v="all">看全部</button></div>`}
    </div>`;
}

/* ---------------------------------------------------------------- route */
function route() {
  const hash = location.hash || '#/';
  const [path, qs] = hash.slice(1).split('?');
  const parts = path.split('/').filter(Boolean);
  const p0 = parts[0] || '';

  if (route._sig !== path) {
    route._sig = path;
    window.scrollTo(0, 0);
  }

  if (!state.who && p0 !== 'search') {
    activeTab = '';
    renderChrome();
    viewIdentity();
    focusView();
    return;
  }

  if (session) {
    activeTab = session.mode === 'exam' ? 'exam' : session.mode === 'wrong' ? 'wrong' : 'practice';
    renderChrome();
    viewRunner();
    focusView();
    return;
  }

  activeTab = ['learn', 'practice', 'essay', 'exam', 'wrong'].includes(p0) ? p0 : '';
  renderChrome();

  if (!p0) viewHome();
  else if (p0 === 'learn') { parts[1] ? viewModule(parts[1]) : viewLearn(); }
  else if (p0 === 'practice') viewPractice();
  else if (p0 === 'essay') viewSubj();
  else if (p0 === 'exam') viewExamStart();
  else if (p0 === 'wrong') viewWrong();
  else if (p0 === 'search') viewSearch(new URLSearchParams(qs || '').get('q') || '');
  else viewHome();

  focusView();
}

/** 切页后把焦点交给主区，但不让浏览器顺手把页头滚出视口 */
function focusView() {
  try { view().focus({ preventScroll: true }); } catch (e) { /* 老浏览器忽略参数 */ }
}

/* ---------------------------------------------------------------- actions */
document.addEventListener('click', async (e) => {
  const el = e.target instanceof Element ? e.target.closest('[data-act]') : null;

  // 同 hash 的站内链接不会触发 hashchange，这里补一次
  const link = e.target instanceof Element ? e.target.closest('a[href^="#/"]') : null;
  if (link) {
    const href = link.getAttribute('href');
    if (href === location.hash) { e.preventDefault(); route(); return; }
  }
  if (!el) return;

  const act = el.dataset.act;

  switch (act) {
    case 'who': {
      state.who = el.dataset.who;
      save(state);
      toast(`已切换到${whoLabel()}`);
      route();
      break;
    }
    case 'switch-who': {
      const next = state.who === 'active' ? 'develop' : 'active';
      state.who = next;
      save(state);
      toast(`已切换到${whoLabel()}`);
      route();
      break;
    }
    case 'theme': {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      save(state);
      renderChrome();
      break;
    }
    case 'search': {
      location.hash = '#/search';
      break;
    }
    case 'do-search': {
      const v = $('#search-in')?.value.trim() || '';
      location.hash = v ? `#/search?q=${encodeURIComponent(v)}` : '#/search';
      break;
    }
    case 'open-q': {
      startSession('search', [el.dataset.id], QBY.get(el.dataset.id)?.m || null);
      break;
    }
    case 'start-module': {
      const mid = el.dataset.mid;
      let qs = bank.questions.filter((q) => q.m === mid && relevant(q));
      if (el.dataset.lv) qs = qs.filter((q) => q.lv === Number(el.dataset.lv));
      if (!qs.length) { toast('这个筛选下没有题'); break; }
      startSession('module', orderByType(qs), mid);
      break;
    }
    case 'start-lv': {
      const lv = Number(el.dataset.lv || 1);
      const qs = bank.questions.filter((q) => relevant(q) && q.lv === lv);
      if (!qs.length) { toast('这个紧急度下没有题'); break; }
      startSession('lv', orderByType(qs).slice(0, 30));
      break;
    }
    case 'start-stage': {
      const i = Number(el.dataset.i);
      const syl = bank.syllabus?.[state.who === 'develop' ? 'develop' : 'active'];
      const st = syl?.stages?.[i];
      if (!st) { toast('阶段数据缺失'); break; }
      const ids = shuffle(bank.questions.filter((q) => st.modules.includes(q.m) && relevant(q))).map((q) => q.id).slice(0, 20);
      startSession('stage', ids);
      break;
    }
    case 'resume': {
      const last = state.last;
      if (!last || !last.ids?.length) { toast('没有未完成的一轮'); break; }
      session = {
        mode: last.mode || 'module',
        moduleId: last.moduleId || null,
        ids: last.ids.filter((id) => QBY.has(id)),
        i: Math.min(last.i || 0, last.ids.length - 1),
        answers: last.answers || {},
        startedAt: last.startedAt || Date.now(),
      };
      route();
      break;
    }
    case 'go-wrong': {
      location.hash = '#/wrong';
      break;
    }
    case 'go-essay': {
      location.hash = '#/essay';
      break;
    }
    case 'subj-cat': {
      viewSubj._cat = el.dataset.v;
      viewSubj();
      break;
    }
    case 'subj-toggle': {
      const ans = el.parentElement?.querySelector('.subj-ans');
      const open = el.getAttribute('aria-expanded') === 'true';
      el.setAttribute('aria-expanded', String(!open));
      if (ans) ans.hidden = open;
      el.textContent = open ? '看示范答案' : '收起答案';
      break;
    }
    case 'start-exam': {
      if (session) break;
      const ids = pickExamIds();
      startSession('exam', ids);
      break;
    }
    case 'filter': {
      viewPractice._filter = el.dataset.v;
      viewPractice();
      break;
    }
    case 'flip': {
      const back = $('.mcard-back', el);
      const open = el.getAttribute('aria-expanded') === 'true';
      el.setAttribute('aria-expanded', String(!open));
      if (back) back.hidden = open;
      break;
    }
    case 'pick': {
      pick(Number(el.dataset.i));
      break;
    }
    case 'confirm-multi': {
      const q = currentQ();
      const a = session.answers[session.i];
      commit(a?.picked || [], check(q, a?.picked || []));
      break;
    }
    case 'submit-fill': {
      submitFill();
      break;
    }
    case 'show-answer': {
      const q = currentQ();
      if (!q) break;
      const draft = $('#fill-in')?.value || '';
      session.answers[session.i] = { picked: draft, ok: null, done: true };
      announce('参考答案已展开，请自评');
      viewRunner();
      break;
    }
    case 'self': {
      const v = el.dataset.v;
      const q = currentQ();
      if (!q) break;
      state.selfEval[q.id] = v;
      const ok = v === 'know';
      session.answers[session.i] = { ...session.answers[session.i], ok };
      const prev = state.seen[q.id];
      state.seen[q.id] = { n: (prev?.n || 0) + 1, ok, at: Date.now() };
      if (ok) {
        const w = state.wrong[q.id];
        if (w) {
          w.ok = (w.ok || 0) + 1;
          if (w.ok >= 2) delete state.wrong[q.id];
          else w.at = Date.now();
        }
      } else {
        state.wrong[q.id] = { n: (state.wrong[q.id]?.n || 0) + 1, ok: 0, at: Date.now() };
      }
      touchDay(state);
      save(state);
      persistSession();
      announce(ok ? '记为会' : v === 'fuzzy' ? '记为模糊' : '记为不会');
      viewRunner();
      break;
    }
    case 'next': {
      nextQ();
      break;
    }
    case 'prev': {
      if (!session || session.i === 0) break;
      session.i -= 1;
      viewRunner();
      break;
    }
    case 'retry-all': {
      const ids = Object.keys(state.wrong).filter((id) => QBY.has(id) && relevant(QBY.get(id)));
      startSession('wrong', shuffle(ids));
      break;
    }
    case 'retry-one': {
      startSession('wrong', [el.dataset.id], QBY.get(el.dataset.id)?.m || null);
      break;
    }
    case 'drop-wrong': {
      delete state.wrong[el.dataset.id];
      save(state);
      toast('已移出错题本');
      viewWrong();
      break;
    }
    case 'clear-wrong': {
      if (!(await confirmBox('清空错题本', '错题记录会全部删除，已做过的题数不受影响。', '清空'))) break;
      state.wrong = {};
      save(state);
      toast('错题本已清空');
      viewWrong();
      break;
    }
    case 'quit': {
      if (isExam()) {
        if (!(await confirmBox('退出模考', '这一轮的成绩不会保存。', '退出'))) break;
        session = null;
        state.last = null;
        save(state);
        location.hash = '#/exam';
        break;
      }
      if (Object.keys(session.answers).length) {
        if (!(await confirmBox('退出这一轮', '进度已经存下，下次从首页“继续上次”接着做。', '退出'))) break;
      }
      session = null;
      state.last = { ...(state.last || {}), i: 0 };
      save(state);
      location.hash = '#/practice';
      break;
    }
    case 'wipe': {
      if (!(await confirmBox('清除本机进度', '已做题目、错题、连续天数都会清零，且不能恢复。', '清除'))) break;
      reset();
      state = load();
      session = null;
      toast('进度已清空');
      route();
      break;
    }
    default:
      break;
  }
});

function submitFill() {
  const q = currentQ();
  if (!q || !session) return;
  const input = $('#fill-in');
  const val = input ? input.value.trim() : '';
  if (!val) { toast('先写下答案'); if (input) input.focus(); return; }
  if (isExam()) {
    session.answers[session.i] = { picked: val, done: true };
    viewRunner();
    return;
  }
  commit(val, check(q, val));
}

function pick(i) {
  const q = currentQ();
  if (!q || !session) return;
  if (answeredNow() && !isExam()) return;

  if (q.t === 'multi') {
    const cur = Array.isArray(session.answers[session.i]?.picked) ? session.answers[session.i].picked.slice() : [];
    const at = cur.indexOf(i);
    if (at >= 0) cur.splice(at, 1); else cur.push(i);
    session.answers[session.i] = { picked: cur, done: false };
    viewRunner();
    return;
  }

  if (isExam()) {
    session.answers[session.i] = { picked: i, done: true };
    viewRunner();
    return;
  }
  commit(i, check(q, i));
}

/* ---------------------------------------------------------------- keyboard */
document.addEventListener('keydown', (e) => {
  if (!$('.runner-head')) return;
  if (!session) return;
  const tag = document.activeElement?.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';

  if (e.key === 'Enter') {
    if (typing) {
      const q = currentQ();
      if (q?.t === 'fill') { e.preventDefault(); submitFill(); return; }
    }
    if (answeredNow()) { e.preventDefault(); nextQ(); return; }
    if (currentQ()?.t === 'multi') {
      const btn = $('[data-act="confirm-multi"]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
    return;
  }

  if (typing) return;

  const n = Number(e.key);
  if (!Number.isNaN(n) && n >= 1 && n <= 4) {
    const idx = n - 1;
    const q = currentQ();
    if (!q) return;
    if (q.t === 'judge') { e.preventDefault(); pick(idx === 0 ? 1 : 0); return; }
    if ((q.o || []).length >= n) { e.preventDefault(); pick(idx); }
  }
});

/* ---------------------------------------------------------------- start */
renderChrome();
route();
window.addEventListener('hashchange', route);

})();
</script>
</body>
